name: PT1570-H10-CU-RTW89-EXP-sysupgrade

# EXPERIMENTAL workflow — validates mainline rtw89 on PT1570-H10-CU.
# Isolated from the stable build-pt1570-fit.yml (private rtl_ax_ap) channel.
# Baseline: lyq1996/rtl9617c-openwrt @ rtw89-enabled refactor (kernel built-in).
# Board: new-base taurus PCIe/USB + H10-CU verified MDIO/NI/PON/LED mapping;
#        TYFC0003 wifi calibration @0x2000/@3000 preserved. Stable channel untouched.
# CI: AN758X-style cache closure, device-package precheck, failure diagnosis.
# Usage:
#   1) dispatch with test_only=true  -> static assertions + .config, no compile
#   2) dispatch with test_only=false -> build sysupgrade.itb artifact (no release)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'lyq1996/rtl9617c-openwrt commit/branch (default refactor HEAD with rtw89)'
        required: false
        default: '2df200550b73316094ff53c02899954beb22efeb'
        type: string
      test_only:
        description: 'Only validate config + assert rtw89 assets; no compile'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Publish to GitHub Release (off by default; experiment)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pt1570-h10-cu-rtw89-exp-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: PT1570-H10-CU-RTW89-EXP / build
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Resolve board parameters
        run: |
          echo "PROFILE=youhua_pt1570_h10_cu_rtw89_exp"    >> "$GITHUB_ENV"
          echo "BOARD_NAME=youhua,pt1570-h10-cu-rtw89-exp" >> "$GITHUB_ENV"
          echo "DTS=rtl9617c-pt1570-h10-cu-rtw89"          >> "$GITHUB_ENV"
          echo "MODEL=PT1570-H10-CU-rtw89-exp"             >> "$GITHUB_ENV"
          echo "profile set"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"
          df -h /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang curl cmake cpio device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-unknown-linux-musl
          else
            echo "::error::runner missing rustup" >&2; exit 1
          fi

      - name: Clone rtl9617c-openwrt source (refactor baseline)
        run: |
          set -e
          REF="${{ inputs.source_ref || '2df200550b73316094ff53c02899954beb22efeb' }}"
          cd /mnt/build_wrt
          git init -q
          git remote add origin https://github.com/lyq1996/rtl9617c-openwrt.git
          [ "${#REF}" -eq 40 ] \
            || { echo "::error::source_ref must be a 40-char commit SHA, got: $REF" >&2; exit 1; }
          git fetch -q --depth=1 origin "$REF" \
            || { echo "::error::failed to fetch source ref '$REF'" >&2; exit 1; }
          git checkout -q FETCH_HEAD
          SOURCE_HASH=$(git rev-parse HEAD)
          [ "${#SOURCE_HASH}" -eq 40 ] \
            || { echo "::error::SOURCE_HASH is not a 40-char SHA: $SOURCE_HASH" >&2; exit 1; }
          echo "SOURCE_HASH=$SOURCE_HASH" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$REF"          >> "$GITHUB_ENV"
          # baseline markers
          test -f target/linux/rtl9617c/dts/rtk-taurus.dtsi
          test -f target/linux/rtl9617c/patches-6.18/740-wifi-rtw89-8192xb.patch
          grep -q '^CONFIG_RTW89_8192XBE=y$' target/linux/rtl9617c/config-6.18
          grep -q '^CONFIG_RTW89_8852CE=y$' target/linux/rtl9617c/config-6.18
          test -s target/linux/rtl9617c/base-files/lib/firmware/rtw89/rtw8192xb_fw.bin
          test -s target/linux/rtl9617c/base-files/lib/firmware/rtw89/rtw8852c_fw.bin
          echo "source: $(git rev-parse HEAD) (rtw89 assets present)"

      - name: Compute build cache keys
        id: cachekeys
        working-directory: /mnt/build_wrt
        env:
          SOURCE_REF: ${{ inputs.source_ref || '2df200550b73316094ff53c02899954beb22efeb' }}
          SOURCE_HASH: ${{ env.SOURCE_HASH }}
        run: |
          bash "$GITHUB_WORKSPACE/rtw89-h10/wb-build-common.sh" key /mnt/build_wrt
          bash "$GITHUB_WORKSPACE/rtw89-h10/wb-build-common.sh" dlkey /mnt/build_wrt

      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            /mnt/build_wrt/staging_dir/host
            /mnt/build_wrt/staging_dir/hostpkg
            /mnt/build_wrt/staging_dir/toolchain
            /mnt/build_wrt/.ccache
          key: ${{ steps.cachekeys.outputs.KEY }}
          restore-keys: ${{ steps.cachekeys.outputs.PREFIX }}

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: /mnt/build_wrt/dl
          key: ${{ steps.cachekeys.outputs.DL_KEY }}
          restore-keys: ${{ steps.cachekeys.outputs.DL_PREFIX }}

      - name: Prepare restored cache
        run: bash "$GITHUB_WORKSPACE/rtw89-h10/wb-build-common.sh" prepare /mnt/build_wrt

      - name: Update and install feeds
        working-directory: /mnt/build_wrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "feeds done"

      - name: Apply H10-CU rtw89 experiment board
        working-directory: /mnt/build_wrt
        run: |
          set -e
          bash "$GITHUB_WORKSPACE/rtw89-h10/apply.sh"

      - name: Configure
        working-directory: /mnt/build_wrt
        env:
          ASSETS: ${{ github.workspace }}
        run: |
          set -e
          # Order-sensitive: seed minimal config first, then defconfig.
          rm -f .config
          cat "$GITHUB_WORKSPACE/rtw89-h10/Config.txt" >> .config
          # target profile device symbol
          echo "CONFIG_TARGET_rtl9617c_generic_DEVICE_youhua_pt1570_h10_cu_rtw89_exp=y" >> .config
          sed -i 's|^CONFIG_PACKAGE_uboot-envtools=y|# CONFIG_PACKAGE_uboot-envtools is not set|' .config
          make defconfig
          cat "$GITHUB_WORKSPACE/rtw89-h10/Config.txt" >> .config
          echo "CONFIG_TARGET_rtl9617c_generic_DEVICE_youhua_pt1570_h10_cu_rtw89_exp=y" >> .config
          make defconfig

          # Re-assert user packages that defconfig may drop.
          for sym in wpad-openssl hostapd-common iw wireless-tools \
                     rtl9617c-pon-control luci-app-rtl9617c-pon luci-ssl uhttpd fitblk \
                     tailscale; do
            if ! grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${sym} is not set$/d; /^CONFIG_PACKAGE_${sym}=/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
              echo "  re-asserted $sym"
            fi
          done
          make defconfig

          echo "===== hard assertions ====="
          grep -q "^CONFIG_TARGET_rtl9617c_generic_DEVICE_youhua_pt1570_h10_cu_rtw89_exp=y$" .config \
            || { echo "ERROR: profile not enabled" >&2; exit 1; }
          for sym in wpad-openssl hostapd-common iw fitblk rtl9617c-pon-control; do
            grep -q "^CONFIG_PACKAGE_${sym}=y$" .config \
              || { echo "ERROR: $sym dropped after defconfig" >&2; exit 1; }
            echo "  OK   $sym"
          done
          grep -q '^# CONFIG_PACKAGE_uboot-envtools is not set$' .config \
            || { echo "ERROR: uboot-envtools must be off" >&2; exit 1; }
          # private driver must NOT be selected
          grep -qE '^CONFIG_PACKAGE_.*rtl.ax.ap.*=y$' .config \
            && { echo "ERROR: private rtl_ax_ap selected in experimental build" >&2; exit 1; } || true
          # FIT/UBI essentials
          grep -q '^CONFIG_UIMAGE_FIT_BLK=y$' target/linux/rtl9617c/config-6.18 \
            || { echo "ERROR: CONFIG_UIMAGE_FIT_BLK missing" >&2; exit 1; }
          echo "  OK   FIT/UBI essentials"
          cp .config "$GITHUB_WORKSPACE/Config-final.txt"

      - name: Verify rtw89 assets
        working-directory: /mnt/build_wrt
        run: |
          set -e
          echo "H10 rtw89 assets applied by apply.sh; config asserted in Configure step"
          grep -q 'CONFIG_RTW89_8192XBE=y' target/linux/rtl9617c/config-6.18
          grep -q 'CONFIG_RTW89_8852CE=y' target/linux/rtl9617c/config-6.18
          test -s target/linux/rtl9617c/base-files/lib/firmware/rtw89/rtw8192xb_fw.bin
          test -s target/linux/rtl9617c/base-files/lib/firmware/rtw89/rtw8852c_fw.bin
          grep -q 'pci10ec,c852' "$GITHUB_WORKSPACE/rtw89-h10/dts/rtl9617c-pt1570-h10-cu-rtw89.dts"
          grep -q 'pci10ec,0192' "$GITHUB_WORKSPACE/rtw89-h10/dts/rtl9617c-pt1570-h10-cu-rtw89.dts"
          grep -q 'CONFIG_EXTRA_FIRMWARE="rtw89/rtw8852c_fw.bin' target/linux/rtl9617c/config-6.18
          grep -q 'youhua,pt1570-h10-cu-rtw89-exp' target/linux/rtl9617c/base-files/etc/board.d/02_network
          echo "  OK rtw89 kernel cfg + early firmware + H10 board/wifi bindings"

      - name: Verify device package closure
        working-directory: /mnt/build_wrt
        run: |
          bash "$GITHUB_WORKSPACE/rtw89-h10/wb-build-common.sh" check-packages /mnt/build_wrt "$PROFILE"

      - name: Upload config (test_only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: rtw89-h10-config-${{ github.run_number }}
          path: |
            Config-final.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build toolchain (cacheable)
        if: ${{ !inputs.test_only }}
        working-directory: /mnt/build_wrt
        run: |
          set -e
          JOBS=$(bash "$GITHUB_WORKSPACE/rtw89-h10/wb-build-common.sh" jobs /mnt/build_wrt)
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "building toolchain with -j$JOBS"
          make -j"$JOBS" toolchain/compile

      - name: Save toolchain cache (early)
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/build_wrt/staging_dir/host
            /mnt/build_wrt/staging_dir/hostpkg
            /mnt/build_wrt/staging_dir/toolchain
            /mnt/build_wrt/.ccache
          key: ${{ steps.cachekeys.outputs.KEY }}-${{ github.run_id }}

      - name: Build firmware
        if: ${{ !inputs.test_only }}
        working-directory: /mnt/build_wrt
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/artifact/build.log"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          : > "$LOG"
          JOBS="${JOBS:-$(nproc)}"
          if make -j"$JOBS" 2>&1 | tee -a "$LOG"; then
            echo "PARALLEL_BUILD_OK=True"
          else
            echo "::warning::parallel build failed, running targeted verbose retry"
            bash "$GITHUB_WORKSPACE/rtw89-h10/wb-build-common.sh" diagnose "$LOG" || true
            FAILED_SUB=$(grep -oE 'ERROR: [^ ]+ failed to build' "$LOG" \
              | tail -1 | sed 's/^ERROR: //; s/ failed to build$//' || true)
            if [ -n "$FAILED_SUB" ]; then
              case "$FAILED_SUB" in
                package/*|target/*) RETRY="$FAILED_SUB/compile" ;;
                *) RETRY="$FAILED_SUB" ;;
              esac
              echo "::warning::retrying $RETRY with V=s"
              make -j1 V=s "$RETRY" 2>&1 | tee -a "$LOG" || true
            else
              make -j1 V=s 2>&1 | tee -a "$LOG" || true
            fi
            echo "::group::BUILD FAILED - last 150 lines"
            tail -n 150 "$LOG"
            echo "::endgroup::"
            exit 1
          fi
          # OpenWrt FIT image is named <prefix>-sysupgrade.itb, NOT plain sysupgrade.itb
          echo "=== bin/targets/rtl9617c/generic/ listing ==="
          ls -lah bin/targets/rtl9617c/generic/ 2>&1 || true
          ITB=$(ls bin/targets/rtl9617c/generic/*sysupgrade.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "ERROR: sysupgrade.itb not produced" >&2; exit 1; }
          echo "FOUND ITB: $ITB"
          cp "$ITB" "$GITHUB_WORKSPACE/artifact/PT1570-H10-CU-rtw89-exp-sysupgrade.itb"
          # sanity: ITB must contain rtw89 firmware strings, not private ap bins
          strings "$ITB" | grep -q 'rtw8192xb_fw.bin' \
            || { echo "WARN: rtw8192xb_fw.bin string not found in ITB" >&2; } || true
          echo "SRC_HASH=$SOURCE_HASH" > "$GITHUB_WORKSPACE/artifact/BUILD_INFO.txt"
          echo "profile=$PROFILE dts=$DTS" >> "$GITHUB_WORKSPACE/artifact/BUILD_INFO.txt"
          (cd "$GITHUB_WORKSPACE/artifact" && sha256sum *.itb > sha256sums.txt)
          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: Upload firmware
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: rtw89-h10-firmware-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (failure)
        if: ${{ failure() && !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: rtw89-h10-buildlog-${{ github.run_number }}
          path: artifact/build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Save dl cache
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/build_wrt/dl
          key: ${{ steps.cachekeys.outputs.DL_KEY }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ !inputs.test_only && inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rtw89-h10-${{ github.run_number }}
          name: PT1570-H10-CU rtw89 experiment (${{ github.run_number }})
          files: artifact/*
          body: |
            ⚠️ EXPERIMENTAL — mainline rtw89 validation on PT1570-H10-CU. NOT for daily use.
            Source ${{ env.SOURCE_REF }} @ ${{ env.SOURCE_HASH }} (refactor baseline, rtw89 built-in).
            Board: new-base taurus PCIe/USB + H10-CU verified 1x2.5GE+3xGE/PON/LED mapping, WiFi cal @0x2000/@3000 preserved.
            Built with wpad-openssl + iw. No private rtl_ax_ap.ko.
            Flash only after backing up current firmware + factory UBI volume. Revert = reflash known-good.
