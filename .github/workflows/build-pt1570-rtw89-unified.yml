name: PT1570-RTW89-UNIFIED-sysupgrade

# Unified workflow for PT1570-R10 and PT1570-H10-CU rtw89 experimental builds.
# Everything except board assets is shared: dependency install, source checkout,
# feeds, cache, defconfig, toolchain build, image build and artifact handling.
# Board-specific pieces live under:
#   boards/pt1570-r10/...  (preferred) or repository root (legacy exp branch)
#   rtw89-h10/...          (H10-CU assets)
# Usage:
#   dispatch with board=<name>, test_only=true  -> static checks + .config only
#   dispatch with board=<name>, test_only=false -> sysupgrade.itb artifact

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Target board'
        required: true
        default: 'pt1570-r10'
        type: choice
        options:
          - pt1570-r10
          - pt1570-h10-cu
      source_ref:
        description: 'Upstream commit/branch override (blank = board default)'
        required: false
        default: ''
        type: string
      test_only:
        description: 'Validate config/assets only, no compile'
        required: false
        default: true
        type: boolean
      create_release:
        description: 'Publish artifact as a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pt1570-rtw89-${{ inputs.board }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: ${{ inputs.board }} / build
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve board parameters
        id: board
        run: |
          set -e
          BOARD="${{ inputs.board }}"
          case "$BOARD" in
            pt1570-r10)
              DEFAULT_REF='d39cfc6367e3f9226f1e0590aec7f6206f784047'
              PROFILE='youhua_pt1570_r10_rtw89_exp'
              DTS='rtl9617c-pt1570-r10-rtw89'
              COMPAT='youhua,pt1570-r10-rtw89-exp'
              ASSET_DIR="$GITHUB_WORKSPACE/boards/pt1570-r10"
              if [ ! -d "$ASSET_DIR" ]; then
                echo "legacy R10 asset layout detected (repository root)"
                ASSET_DIR="$GITHUB_WORKSPACE"
              fi
              CONFIG_FILE="$ASSET_DIR/Config-PT1570-R10-RTW89.txt"
              APPLY_SCRIPT="$ASSET_DIR/scripts/apply-r10-rtw89-exp.sh"
              VERIFY_SCRIPT="$ASSET_DIR/scripts/verify-r10-rtw89-exp.py"
              ;;
            pt1570-h10-cu)
              # Keep the known-good H10 baseline until its extra 8192XB
              # DLFW/thermal patches are revalidated on d39cfc6367e3.
              DEFAULT_REF='2df200550b73316094ff53c02899954beb22efeb'
              PROFILE='youhua_pt1570_h10_cu_rtw89_exp'
              DTS='rtl9617c-pt1570-h10-cu-rtw89'
              COMPAT='youhua,pt1570-h10-cu-rtw89-exp'
              ASSET_DIR="$GITHUB_WORKSPACE/rtw89-h10"
              CONFIG_FILE="$ASSET_DIR/Config.txt"
              APPLY_SCRIPT="$ASSET_DIR/apply.sh"
              VERIFY_SCRIPT="$ASSET_DIR/verify.py"
              ;;
            *)
              echo "::error::unknown board '$BOARD'" >&2; exit 1
              ;;
          esac
          REF="${{ inputs.source_ref }}"
          [ -n "$REF" ] || REF="$DEFAULT_REF"
          for f in "$CONFIG_FILE" "$APPLY_SCRIPT"; do
            [ -f "$f" ] || { echo "::error::missing asset $f" >&2; exit 1; }
          done
          [ -f "$VERIFY_SCRIPT" ] || VERIFY_SCRIPT=''
          ASSET_HASH=$(find "$ASSET_DIR" -type f -not -path '*/.git/*' -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          {
            echo "BOARD=$BOARD"
            echo "PROFILE=$PROFILE"
            echo "DTS=$DTS"
            echo "COMPAT=$COMPAT"
            echo "ASSET_DIR=$ASSET_DIR"
            echo "CONFIG_FILE=$CONFIG_FILE"
            echo "APPLY_SCRIPT=$APPLY_SCRIPT"
            echo "VERIFY_SCRIPT=$VERIFY_SCRIPT"
            echo "SOURCE_REF_INPUT=$REF"
            echo "ASSET_HASH=$ASSET_HASH"
          } >> "$GITHUB_ENV"
          echo "board=$BOARD profile=$PROFILE dts=$DTS ref=$REF"
          echo "asset_hash=$ASSET_HASH"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"
          df -h /mnt

      - name: Install build dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang curl cmake cpio device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-unknown-linux-musl
          else
            echo "::error::runner missing rustup" >&2; exit 1
          fi

      - name: Clone rtl9617c-openwrt source
        run: |
          set -e
          cd /mnt/build_wrt
          git init -q
          git remote add origin https://github.com/lyq1996/rtl9617c-openwrt.git
          git fetch -q --depth=1 origin "$SOURCE_REF_INPUT" \
            || { echo "::error::failed to fetch source_ref '$SOURCE_REF_INPUT'" >&2; exit 1; }
          git checkout -q FETCH_HEAD
          SOURCE_HASH=$(git rev-parse HEAD)
          echo "SOURCE_HASH=$SOURCE_HASH" >> "$GITHUB_ENV"
          # Upstream feeds.conf.default has a typo: cryster/ instead of
          # crysister/. Fix it before feeds update for the new baseline.
          sed -i 's#github.com/cryster/rtl9617c-packages.git#github.com/crysister/rtl9617c-packages.git#' feeds.conf.default
          echo "source: $SOURCE_HASH (ref=$SOURCE_REF_INPUT)"

      - name: Compute build cache keys
        id: cachekeys
        env:
          BOARD: ${{ env.BOARD }}
          SOURCE_HASH: ${{ env.SOURCE_HASH }}
          ASSET_HASH: ${{ env.ASSET_HASH }}
        run: bash "$GITHUB_WORKSPACE/scripts/wb-cache.sh" key /mnt/build_wrt

      - name: Restore toolchain / build cache
        id: restore_build_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /mnt/build_wrt/build_dir/toolchain-*
            /mnt/build_wrt/build_dir/host
            /mnt/build_wrt/build_dir/stamp
            /mnt/build_wrt/staging_dir/host
            /mnt/build_wrt/staging_dir/hostpkg
            /mnt/build_wrt/staging_dir/toolchain
          key: ${{ steps.cachekeys.outputs.KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.PREFIX }}

      - name: Restore ccache
        id: restore_ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/build_wrt/.ccache
          key: ${{ steps.cachekeys.outputs.CCACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.CCACHE_PREFIX }}

      - name: Restore dl cache
        id: restore_dl
        uses: actions/cache/restore@v4
        with:
          path: /mnt/build_wrt/dl
          key: ${{ steps.cachekeys.outputs.DL_KEY }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.DL_PREFIX }}

      - name: Update and install feeds
        working-directory: /mnt/build_wrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "feeds done"

      - name: Apply board assets
        working-directory: /mnt/build_wrt
        run: |
          set -e
          bash "$APPLY_SCRIPT"

      - name: Configure
        working-directory: /mnt/build_wrt
        run: |
          set -e
          rm -f .config
          cat "$CONFIG_FILE" >> .config
          echo "CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y" >> .config
          sed -i 's|^CONFIG_PACKAGE_uboot-envtools=y|# CONFIG_PACKAGE_uboot-envtools is not set|' .config
          make defconfig
          cat "$CONFIG_FILE" >> .config
          echo "CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y" >> .config
          make defconfig
          for sym in wpad-openssl hostapd-common iw wireless-tools \
                     rtl9617c-pon-control luci-app-rtl9617c-pon luci-ssl uhttpd \
                     fitblk tailscale; do
            if ! grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${sym} is not set$/d; /^CONFIG_PACKAGE_${sym}=/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
              echo "  re-asserted $sym"
            fi
          done
          make defconfig
          grep -q "^CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y$" .config \
            || { echo "ERROR: profile $PROFILE not enabled" >&2; exit 1; }
          for sym in wpad-openssl hostapd-common iw fitblk rtl9617c-pon-control; do
            grep -q "^CONFIG_PACKAGE_${sym}=y$" .config \
              || { echo "ERROR: $sym dropped after defconfig" >&2; exit 1; }
            echo "  OK   $sym"
          done
          grep -q '^# CONFIG_PACKAGE_uboot-envtools is not set$' .config \
            || { echo "ERROR: uboot-envtools must be off" >&2; exit 1; }
          grep -qE '^CONFIG_PACKAGE_.*rtl.ax.ap.*=y$' .config \
            && { echo "ERROR: private rtl_ax_ap selected" >&2; exit 1; } || true
          grep -q '^CONFIG_UIMAGE_FIT_BLK=y$' target/linux/rtl9617c/config-6.18 \
            || { echo "ERROR: CONFIG_UIMAGE_FIT_BLK missing" >&2; exit 1; }
          cp .config "$GITHUB_WORKSPACE/Config-final.txt"

      - name: Verify board assets
        working-directory: /mnt/build_wrt
        run: |
          set -e
          if [ -n "$VERIFY_SCRIPT" ] && [ -f "$VERIFY_SCRIPT" ]; then
            SRC_DIR=/mnt/build_wrt GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
              python3 "$VERIFY_SCRIPT"
          else
            echo "::warning::no board verify script; relying on Configure assertions"
          fi
          HELPER="$ASSET_DIR/wb-build-common.sh"
          [ -f "$HELPER" ] || HELPER="$GITHUB_WORKSPACE/scripts/wb-build-common.sh"
          if [ -f "$HELPER" ]; then
            bash "$HELPER" check-packages /mnt/build_wrt "$PROFILE"
          fi

      - name: Prepare restored cache for incremental build
        # Must run AFTER feeds/board injection/defconfig: those steps create
        # fresh files with "now" mtimes. Age them here, then refresh cached
        # stamps so make sees an up-to-date toolchain on a cache hit.
        run: |
          BOARD="$BOARD" bash "$GITHUB_WORKSPACE/scripts/wb-cache.sh" prepare /mnt/build_wrt
          echo "build_cache_hit=${{ steps.restore_build_cache.outputs.cache-hit }}"
          echo "ccache_hit=${{ steps.restore_ccache.outputs.cache-hit }}"
          echo "dl_cache_hit=${{ steps.restore_dl.outputs.cache-hit }}"

      - name: Upload config (test_only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: rtw89-${{ inputs.board }}-config-${{ github.run_number }}
          path: Config-final.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build toolchain (cacheable)
        if: ${{ !inputs.test_only }}
        working-directory: /mnt/build_wrt
        run: |
          set -e
          JOBS=$(awk -v p="$(nproc)" '/^MemAvailable:/{m=int($2/2097152)+1}
            END{n=(m<p?m:p); if(n<1)n=1; print n}' /proc/meminfo)
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "building toolchain with -j$JOBS"
          make -j"$JOBS" toolchain/compile

      - name: Save toolchain / build cache
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/build_wrt/build_dir/toolchain-*
            /mnt/build_wrt/build_dir/host
            /mnt/build_wrt/build_dir/stamp
            /mnt/build_wrt/staging_dir/host
            /mnt/build_wrt/staging_dir/hostpkg
            /mnt/build_wrt/staging_dir/toolchain
          key: ${{ steps.cachekeys.outputs.KEY }}-${{ github.run_id }}

      - name: Build firmware
        if: ${{ !inputs.test_only }}
        working-directory: /mnt/build_wrt
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/artifact/build.log"
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          : > "$LOG"
          JOBS="${JOBS:-$(nproc)}"
          if make -j"$JOBS" 2>&1 | tee -a "$LOG"; then
            echo "PARALLEL_BUILD_OK=True"
          else
            echo "::warning::parallel build failed, retrying with -j1 V=s"
            if ! make -j1 V=s 2>&1 | tee -a "$LOG"; then
              echo "::group::BUILD FAILED - last 150 lines"
              tail -n 150 "$LOG"
              echo "::endgroup::"
              exit 1
            fi
          fi
          echo "=== bin/targets/rtl9617c/generic/ ==="
          ls -lah bin/targets/rtl9617c/generic/ 2>&1 || true
          ITB=$(ls bin/targets/rtl9617c/generic/*sysupgrade.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "ERROR: sysupgrade.itb not produced" >&2; exit 1; }
          cp "$ITB" "$GITHUB_WORKSPACE/artifact/PT1570-rtw89-${BOARD}-sysupgrade.itb"
          strings "$ITB" | grep -qE 'rtw(8192xb|8852c)(_ap)?_fw.bin' \
            || echo "::warning::no rtw89 firmware string found in ITB"
          {
            echo "board=$BOARD"
            echo "profile=$PROFILE"
            echo "dts=$DTS"
            echo "source_ref=$SOURCE_REF_INPUT"
            echo "source_hash=$SOURCE_HASH"
          } > "$GITHUB_WORKSPACE/artifact/BUILD_INFO.txt"
          (cd "$GITHUB_WORKSPACE/artifact" && sha256sum *.itb > sha256sums.txt)
          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: Upload firmware
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: rtw89-${{ inputs.board }}-firmware-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Cache statistics
        if: ${{ !inputs.test_only }}
        run: BOARD="$BOARD" bash "$GITHUB_WORKSPACE/scripts/wb-cache.sh" stats /mnt/build_wrt

      - name: Save ccache
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/build_wrt/.ccache
          key: ${{ steps.cachekeys.outputs.CCACHE_KEY }}-${{ github.run_id }}

      - name: Save dl cache
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/build_wrt/dl
          key: ${{ steps.cachekeys.outputs.DL_KEY }}-${{ github.run_id }}

      - name: Publish release
        if: ${{ !inputs.test_only && inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rtw89-${{ inputs.board }}-${{ github.run_number }}
          name: PT1570 rtw89 experiment (${{ inputs.board }}, ${{ github.run_number }})
          files: artifact/*
          body: |
            EXPERIMENTAL rtw89 firmware for ${{ inputs.board }}.
            Source ${{ env.SOURCE_REF_INPUT }} @ ${{ env.SOURCE_HASH }}.
            Profile ${{ env.PROFILE }}, DTS ${{ env.DTS }}.
            Back up factory + current firmware before flashing. Revert by reflashing known-good ITB.
