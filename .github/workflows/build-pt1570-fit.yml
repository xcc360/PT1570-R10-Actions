# SPDX-License-Identifier: MIT
# PonWRT / PT1570-R10 单机型 / 统一 UBI 方案云编译
#
# 这套资产对应《PT1570-R10_H10-FIT统一ABI-云编译补齐方案.md》的方案③。
# 布局：factory(8 MiB static) + fit + rootfs_data，产物 sysupgrade.itb。
# 注：方案名为「统一 UBI 方案」，不是 ABI；状态页型号显示为 RTL9617C UBI。
#
# ⚠️ 2026-11-09 起按用户决定收窄为 **R10-only**：
#    PT1570-H10 暂缓（设备未上线、无 factory、DTS 无可验证硬件事实）。
#    H10 的 Device/DTS 资产保留在 board/ 下但标记为 DORMANT，不参与任何构建；
#    apply-board.sh 需要显式 PT1570_ALLOW_H10=1 才会处理 h10，默认直接拒绝。
#    恢复双机型的方法见方案文档「R10-only 范围与恢复 H10」一节。
#
# ✅ R10 DTS 状态：已于 2026-11-16 转为 VERIFIED。
#    依据：2026-11-09 真机 FDT 静态移植（447 个属性逐项核对，修正了误 include
#    2.5G 板的实质缺陷）；2026-11-13 commit 9d1ea2b690 删除 /chosen 覆盖块后，
#    本 DTS 编译出的固件已在 PT1570-R10 真机启动并验证 —— PPPoE 拨号成功、
#    4×GE（lan0/lan2/lan3/lan4）全部注册并入 br-lan、PCIe 双 WiFi6 卡
#    (10ec:c852 / 10ec:0192) 均枚举且 AP-ENABLED、自编 R10 U-Boot
#    (U-Boot 2026.07-ge029b68a6450) 的 Web Failsafe 恢复页在 4×GE 上实测可达
#    且网口4 恢复可用。
#    现默认 dts_status=verified，产物不再带 DO-NOT-FLASH 警告，并允许发布 Release。
#    仍待现场确认：面板 LED 与三键的实机行为（GPIO/极性已与真机 FDT 逐项核对
#    一致，sysfs 层已验证；属外设表现，不影响本 DTS 的网口/PON/WiFi 正确性）。
#    详见 board/dts/rtl9617c-pt1570-r10.dts 头部的逐条验证记录。
#
# Actions 运行时：checkout@v5 / upload-artifact@v6 / action-gh-release@v3（Node 24）。
# 同批 packages：kmod 绑定本次内核 vermagic，必须与固件成对产出、成对使用。
# 2026-11-15 起按用户要求「暂时不要同步编译 packages 包」停用：
#   publish_packages 默认改为 false，编译只出固件；Refresh package index 也随之跳过。
#   恢复方法：把 default 改回 true（或在 dispatch 传 publish_packages=true），kmod 需与固件成对使用。

# 2026-11-14 原厂 WiFi 整合（本机备份 D:\ONT\PT1570-R10\BackUp-原厂 解包对比）：
#   * 原厂 rtk_wifi6.ko（4.4.140，10.8 MB Realtek SDK）里只出现一个 FEM 名
#     RTK66587_BPF_YH1570；/etc/conf/rtl8852ce/RFE54/RTK66587_BPF_YH1570/
#     PHY_REG_GAIN.txt 头注释 "version = 52-for 17C"，是专为 RTL9617C +
#     PT1570 板标定的 RF 增益（5G LOW/MID/HIGH 各 path A/B 全表不同，
#     204 行差异），MCS8~11 的 TXPWR_ByRate 也从 17/17/18/19 调成 14/15/17/19。
#   * 上游 PonWRT 带的是通用 RTK66587_BPF（version = 51）；开源 rtl_ax_ap
#     在 phy.c / limits.c / power-tables.c 里硬编码读这个目录。所以把该目录
#     3 个差异表替换成原厂 YH1570 版即可无改驱动生效。通用版另存
#     RTK66587_BPF_GENERIC/ 可回滚，原名 RTK66587_BPF_YH1570/ 留作溯源。
#   * 2.4G 默认表 RTK66287 与原厂逐字节一致，保持不动；另打包原厂备选
#     RTC7646/ 供实机对比。
#   * 原厂 hostapd 开了 he_su/mu_beamformer、LDPC、STBC、WMM，MIB 里
#     WLAN*_LDPC_ENABLED / WLAN*_STBC_ENABLED 也都是 1；本版把这些映射成
#     /etc/config/wireless 的 schema 内选项，并由 96-pt1570-wifi-tuning
#     在默认配置被 sysupgrade 保留时幂等补齐。hostapd.uc 会按驱动上报的
#     HE/VHT cap 自动回退，不支持时不会强开。country 保持 CN（原厂写 US，
#     功率上限更宽，但改 regdomain 有合规风险，不跟随）。
#   * 护栏：scripts/verify-stock-wifi-assets.py（23 项 sha256 / 内容断言）
#     + Verify 段镜像内断言，防止原厂表被误改回通用版。
#   说明：原厂是 10.8 MB 完整私有驱动，开源 rtl_ax_ap.ko 只有 353 KB，
#   功能集差距是上限，参数表与 hostapd 配置能明显改善但不能完全追平。
#
# 2026-11-15 PonWRT-TYFZA1 v0.8.5-beta WiFi 信号修复
#   （run34 刷入后实机反馈「WiFi 信号还是不行」）：
#   * 主根因：旧版 rtl_ax_ap/power-tables.c 把 SCC MAC0 的 0xd208 bit20/21
#     与 0xd21c bit18 置 1，额外启用厂商 TXPWR_LMT / TXPWR_LMT_RU 限制表，
#     把 TX 功率压到单板 by-rate 标定值以下。原厂 config.xml 的
#     WLAN_RFPOWER_SCALE=0 / WLAN_FAKE_TX_POWER=0 / POWER_OPTIMIZATION_ENABLE=0
#     与 PonWRT manifests/radio-stock-rf-dm.json 的
#     "power_limit MIB defaults to 0" 都证明原厂不启用这层限制。
#     0.8.5 把这些位清零；by-rate 值本身已含 Linux 信道/用户/regdb 上限，
#     所以清零不放宽合规，只是不再重复限功率。
#   * 0.8.5 是独立的 73 文件双 PE 驱动 + 36 个内核补丁，与本机 60 文件
#     单 PE1 驱动不兼容，**不能整套替换**；只移植能独立生效的
#     power-tables.c 与 wifi-scripts 的 txpower ucode 修复。
#   * 0.8.5 sysupgrade.bin 解出的整套 5G RFE54 表（v51，26 文件）随镜像
#     带在 RFE54_PONWRT085/，由 dispatch input fem_profile 一键切换；
#     默认仍是原厂 YH1570 v52，便于 A/B 对照。
#   * 护栏：scripts/verify-ponwrt085-wifi.py + Verify 段编译树/镜像断言。
#
# 统一命名 ID: PT1570-R10-4GE-CU-sysupgrade
#   规则 <型号>-<网口>-<运营商>-<产物类型>（uboot / sysupgrade）。
#   仅作用于展示层：workflow / job / artifact / release / packages / BUILD_INFO。
#   机器层 PROFILE / BOARD_NAME / DTS / SUPPORTED_DEVICES / Config target 符号
#   一律不动（uci-defaults 门控与 sysupgrade 白名单依赖它们），workflow 文件名
#   也保留，避免 GitHub 按路径重建 workflow、丢失 run 历史。
name: PT1570-R10-4GE-CU-sysupgrade

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'lyq1996/rtl9617c-openwrt 的 commit / 分支（默认锁定已核实 commit 的完整 SHA，来自 pt1500-h10-fixes 分支）'
        required: false
        default: '20b4cf4490ca55cc406d07e391691efa8cd8a087'
        type: string
      dts_status:
        description: 'DTS 验证状态；experimental 只出验证产物，verified 才允许发布 Release。R10 DTS 已于 2026-11-16 转 VERIFIED，默认 verified'
        required: false
        default: 'verified'
        type: choice
        options: [experimental, verified]
      test_only:
        description: '只生成并上传 .config / 校验报告，不编译'
        required: false
        default: false
        type: boolean
      create_release:
        description: '发布到 GitHub Release（仅 dts_status=verified 时生效）'
        required: false
        default: false
        type: boolean
      publish_packages:
        description: '同期收集并发布配套 packages（kmod + packages.adb + 公钥）；暂时默认关闭，只出固件，需要时手动置 true'
        required: false
        default: false
        type: boolean
      packages_repo_url:
        description: '可选：自建 packages 静态源根 URL，随固件写入 customfeeds.list'
        required: false
        default: ''
        type: string
      apk_mirror_base:
        description: '可选：覆盖内置 apk 源（默认北大镜像 immortalwrt 25.12-SNAPSHOT 的 aarch64_cortex-a53 目录，公钥随镜像）。留空即用内置地址'
        required: false
        default: ''
        type: string
      apk_repo_key_url:
        description: '可选：外部 apk 源公钥 URL'
        required: false
        default: ''
        type: string
      wifi_diag:
        description: 'WiFi 诊断模式：注入只读寄存器打点 + CONFIG_DEVMEM/devmem，并保留上游驱动。默认关闭（正式性能版：overlay 已验证好驱动）；仅排查 WiFi 时手动打开'
        required: false
        default: false
        type: boolean
      wifi_port:
        description: '上游单 PE 兼容 WiFi 修复移植（定向子集，默认 off 不改行为）：off / scan-rssi / scan-rssi+ra'
        required: false
        default: 'off'
        type: choice
        options: ['off', scan-rssi, scan-rssi+ra]
      fem_profile:
        description: '5G 射频参数表 profile：yh1570=原厂 PT1570 专用 v52（默认）；ponwrt085=PonWRT 0.8.5 实机验证的 v51 全套；generic=上游通用 v51 回滚'
        required: false
        default: 'yh1570'
        type: choice
        options: [yh1570, ponwrt085, generic]

permissions:
  contents: write

concurrency:
  group: pt1570-r10-4ge-cu-sysupgrade-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: PT1570-R10-4GE-CU-sysupgrade / build
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        # R10-only。H10 暂缓，禁止在此加入（见文件头与方案文档）。
        board: [r10]

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v5

      # 防呆：任何把第二个机型加回 matrix 的改动都会在这里失败。
      # 只检查 matrix 的 board 行，不搜全文（文件头注释里本来就有 H10 说明）。
      - name: Guard R10-only
        env:
          BOARD: ${{ matrix.board }}
        run: |
          [ "$BOARD" = "r10" ] || {
            echo "ERROR: 当前范围是 R10-only，收到 board=$BOARD" >&2; exit 1; }
          WF="$GITHUB_WORKSPACE/.github/workflows/build-pt1570-fit.yml"
          LINE=$(grep -E '^[[:space:]]*board: \[' "$WF" | tr -d '[:space:]')
          [ "$LINE" = "board:[r10]" ] || {
            echo "ERROR: matrix board 行不是 [r10]：'$LINE'" >&2; exit 1; }
          echo "R10_ONLY_GUARD_OK=True board=$BOARD matrix=$LINE"

      - name: Resolve board parameters
        env:
          BOARD: ${{ matrix.board }}
          DTS_STATUS: ${{ inputs.dts_status }}
        run: |
          case "$BOARD" in
            r10)
              echo "PROFILE=youhua_pt1570_r10"          >> "$GITHUB_ENV"
              echo "BOARD_NAME=youhua,pt1570-r10"       >> "$GITHUB_ENV"
              echo "DTS=rtl9617c-pt1570-r10"            >> "$GITHUB_ENV"
              echo "MODEL=PT1570-R10"                   >> "$GITHUB_ENV"
              ;;
            *) echo "ERROR: R10-only 构建不接受 board=$BOARD（H10 暂缓）" >&2; exit 1 ;;
          esac
          echo "DTS_STATUS=${DTS_STATUS:-experimental}" >> "$GITHUB_ENV"
          echo "board=$BOARD profile=youhua_pt1570_r10 dts=rtl9617c-pt1570-r10 status=${DTS_STATUS:-experimental}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"
          df -h /mnt

      - name: Install build dependencies
        # 沿用已在 ubuntu-24.04 上跑通的 OpenWrt 依赖清单（与 HG5585F-CT 路线 B 相同）。
        # 额外显式装 LLVM 18 三件套：target/linux/rtl9617c/pe/Makefile 硬编码
        # clang-18 / ld.lld-18 / llvm-objcopy-18 来编译 MIPS32 裸机 PE 程序，
        # 不能只依赖通用的 clang / lld / llvm 元包（见下一步 PE 构建）。
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clang-18 cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld lld-18 llvm llvm-18 ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          # tyfza1-pon-control（PON 管控，Rust）由其 Makefile 调 host PATH 上的
          # cargo，交叉编译 --target aarch64-unknown-linux-musl；run #9 报
          # E0463 can't find crate for `core`（the aarch64-unknown-linux-musl
          # target may not be installed）。runner 预装 rustup，为其默认工具链
          # 补齐该目标 std 即可；缺失时给出可读报错而不是让 1 小时后的编译才爆。
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-unknown-linux-musl
            rustup target list --installed
          else
            echo "::error::runner 缺 rustup，无法补 aarch64-unknown-linux-musl std" >&2
            exit 1
          fi

      - name: Clone rtl9617c-openwrt source
        run: |
          set -e
          REF="${{ inputs.source_ref || '20b4cf4490ca55cc406d07e391691efa8cd8a087' }}"
          cd /mnt/build_wrt
          git init -q
          git remote add origin https://github.com/lyq1996/rtl9617c-openwrt.git
          if ! git fetch -q --depth=1 origin "$REF"; then
            echo "WARN: 按 commit 拉取失败，回退到 h10 分支" >&2
            git fetch -q --depth=1 origin feature/pt1500-h10-openwrt-fixes
          fi
          git checkout -q FETCH_HEAD
          echo "SOURCE_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$REF"                   >> "$GITHUB_ENV"
          echo "--- target ---"
          test -f target/linux/rtl9617c/image/Makefile
          test -f target/linux/rtl9617c/dts/rtl9617c-tyfza1.dtsi
          test -f package/utils/fitblk/files/fit.sh
          grep -n 'rootdisk' target/linux/rtl9617c/dts/rtl9617c-tyfza1.dtsi | head -3
          echo "source: $(git rev-parse HEAD)"

      - name: Build PE firmware (pe-tx-code.h)
        working-directory: wrt
        run: |
          set -eo pipefail
          # run #7 (2026-11-10) Compile 失败根因：
          #   drivers/net/wireless/realtek/rtl_ax_ap/Makefile:10:
          #   *** pe-tx-code.h is missing; run "make -C target/linux/rtl9617c/pe". Stop.
          # 该头文件被上游 .gitignore 排除，由 target/linux/rtl9617c/pe/Makefile
          # 用 clang-18 / ld.lld-18 / llvm-objcopy-18 现场编译 MIPS32 裸机 PE
          # 程序后生成，OpenWrt 构建系统不会自动调用。必须在任何 make 之前生成，
          # 这样内核首次展开 files-6.18 时就能带上它（否则 target/linux/compile 必挂）。
          echo "=== PE toolchain ==="
          for t in clang-18 ld.lld-18 llvm-objcopy-18 python3; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::PE 构建缺少工具 $t，请检查 Install build dependencies" >&2
              exit 1
            fi
            printf '  OK   %-20s %s\n' "$t" "$(command -v "$t")"
          done

          if ! make -C target/linux/rtl9617c/pe 2>&1 | tee /tmp/pe-build.log; then
            echo "::group::PE BUILD FAILED - last 60 lines"
            tail -n 60 /tmp/pe-build.log
            echo "::endgroup::"
            echo "::error::make -C target/linux/rtl9617c/pe 失败，pe-tx-code.h 未生成"
            exit 1
          fi
          HDR=target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pe-tx-code.h
          test -s "$HDR" || { echo "::error::pe-tx-code.h 未生成或为空"; exit 1; }
          grep -q 'static const u32 pe_tx_program\[\]' "$HDR" \
            || { echo "::error::pe-tx-code.h 内容不符（缺 pe_tx_program 数组）"; exit 1; }
          echo "PE_HEADER_OK=True bytes=$(wc -c < "$HDR") words=$(grep -c '0x[0-9a-fA-F]' "$HDR")"

      - name: Pin APK signing key (optional)
        working-directory: wrt
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -n "$APK_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
            echo "APK build key pinned:"; sha256sum public-key.pem
          else
            echo "no APK_SIGNING_KEY: ephemeral key; firmware + packages of THIS run trust each other only"
          fi

      - name: Update and install feeds
        working-directory: wrt
        run: |
          LOG="$GITHUB_WORKSPACE/step-feeds.log"
          : > "$LOG"
          # 全量输出同时落盘；失败时 trap 打印尾部并把关键错误写成 annotation，
          # 无需仓库管理员权限即可从 check-runs annotations 读到具体原因。
          exec > >(tee -a "$LOG") 2>&1
          trap '
            rc=$?
            if [ "$rc" -ne 0 ]; then
              sleep 1
              echo "::group::FEEDS STEP FAILED (exit $rc) - last 80 lines"
              tail -n 80 "$LOG"
              echo "::endgroup::"
              last_step=$(grep "^STEP:" "$LOG" | tail -n 1)
              echo "::error::失败前最后进度: ${last_step:-未知}"
              grep -E "fatal:|error:|Error [0-9]|ERROR|No such file|not found|Failed|failed|denied|timed out|refusing" "$LOG" \
                | grep -v "::error::" | tail -n 6 | tr -d "\r" | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "::error::Update and install feeds 失败 (exit $rc)，见上方日志与 build-log artifact"
            fi
          ' EXIT

          echo "STEP: feeds update -a"
          ./scripts/feeds update -a

          # vlmcsd / luci-app-vlmcsd 已于 2026-11-10 从 R10 基线移除（用户确认非必需）。
          # 原因：这两个包只在 immortalwrt feeds，而本源码树 feeds.conf.default 指向
          # 官方 git.openwrt.org。此前用 sparse clone 把包目录注入官方 feed，但
          # `feeds update -a` 生成的 feeds/*.index 在注入之前，`feeds install -a`
          # 依据索引工作，导致 run #4 报 "feeds install 未识别 vlmcsd" 并失败。
          # 现在彻底移除整段注入：少两次大仓库 clone，消除索引时序依赖。
          # 若以后确实要加回：注入后必须先 ./scripts/feeds update -i -a 重建索引，
          # 再 ./scripts/feeds install -a，并重新验证 Configure 的包硬断言。

          echo "STEP: feeds install -a"
          ./scripts/feeds install -a
          echo "STEP: fix feed file permissions"
          # rpcd 会拒绝 world-writable 的 ucode handler；Windows/9p 同步过的 feed 必须收敛权限
          chmod -R go-w feeds/luci feeds/packages 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/ucode/*' -type f -exec chmod 0755 {} + 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/acl.d/*.json' -type f -exec chmod 0644 {} + 2>/dev/null || true
          # rpcd exec 插件（/usr/libexec/rpcd/*）另有两个坑，2026-11-14 真机实证：
          #   luci-app-argon-config / luci-theme-argon 带的是 CRLF 文本，首行变成
          #   "#!/bin/sh\r"，内核找不到名为 /bin/sh\r 的解释器；且安装成 0644。
          #   结果 5 个 luci.argon* ubus 对象全不注册，主题设置页第一发 RPC 就报
          #   "RPC call to luci.argon/avail failed ... -32000: Object not found"。
          # 这里对 feed 源码做第一道归一化；真正保证由 files/ overlay + 产物断言兜底。
          find feeds -path '*/root/usr/libexec/rpcd/*' -type f -print 2>/dev/null | while IFS= read -r f; do
            [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ] || continue
            tr -d '\r' < "$f" > "$f.lf" && cat "$f.lf" > "$f" && rm -f "$f.lf"
            chmod 0755 "$f"
          done || true
          echo "  OK   rpcd exec 插件：CRLF 归一化 + 0755"

      - name: Apply board support (DTS + Device + sysupgrade whitelist)
        env:
          PT1570_BOARD: ${{ matrix.board }}
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
          DTS_STATUS: ${{ inputs.dts_status }}
        run: bash "$GITHUB_WORKSPACE/scripts/apply-board.sh"

      - name: Apply custom rootfs files
        env:
          PACKAGES_REPO_URL: ${{ inputs.packages_repo_url }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/wrt/files"
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            cp -a "$GITHUB_WORKSPACE/files/." "$GITHUB_WORKSPACE/wrt/files/"
            chmod +x "$GITHUB_WORKSPACE/wrt/files/etc/uci-defaults/"* 2>/dev/null || true
            # rpcd exec 插件必须可执行，否则 rpcd 不加载，luci.argon* 对象不注册
            chmod +x "$GITHUB_WORKSPACE/wrt/files/usr/libexec/rpcd/"* 2>/dev/null || true
            echo "custom rootfs files injected:"
            find "$GITHUB_WORKSPACE/files" -type f -printf '  %P\n'
          fi
          if [ -n "$PACKAGES_REPO_URL" ]; then
            URL="${PACKAGES_REPO_URL%/}"
            mkdir -p "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d"
            {
              echo '# 本次固件同批编译的 packages 源（由 workflow 注入）'
              echo "$URL/targets/rtl9617c/generic/packages/packages.adb"
            } > "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d/customfeeds.list"
            echo "custom packages repo: $URL/targets/rtl9617c/generic/packages/packages.adb"
          fi

      # 2026-11-16：SSID 按「型号 + 频段」区分，禁用双频合一。
      # radio0=5G / radio1=2.4G 改为 PT1570-R10-5G / PT1570-R10-2.4G。
      # 在注入后的 files overlay 上执行（幂等），确保镜像内 conffile 就是分频 SSID。
      - name: Set band-specific SSIDs (no dual-band unify)
        run: |
          set -e
          WF="$GITHUB_WORKSPACE/wrt/files/etc/config/wireless"
          [ -f "$WF" ] || { echo "::error::缺少注入后的 $WF"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/set-band-ssids.py" "$WF" "PT1570-R10"
          echo "--- SSID in image overlay ---"
          grep -n "option ssid" "$WF"

      - name: Select WiFi RFE54 profile
        env:
          FEM_PROFILE: ${{ inputs.fem_profile }}
          WRT: ${{ github.workspace }}/wrt
          ASSETS: ${{ github.workspace }}
        run: |
          set -e
          DST="$WRT/files/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54"
          [ -d "$DST" ] || { echo "::error::rootfs overlay 缺 RFE54 目录"; exit 1; }
          case "$FEM_PROFILE" in
            yh1570)
              echo "FEM_PROFILE=yh1570 (OEM PT1570 v52 default, no change)"
              ;;
            ponwrt085)
              SRC="$ASSETS/files/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54_PONWRT085"
              [ "$(find "$SRC" -name '*.txt' | wc -l)" = 26 ] \
                || { echo "::error::RFE54_PONWRT085 profile 不完整"; exit 1; }
              cp -a "$SRC"/. "$DST/"
              grep -q 'version = 51' "$DST/RTK66587_BPF/PHY_REG_GAIN.txt" \
                || { echo "::error::ponwrt085 profile 不是 v51 标定"; exit 1; }
              echo "FEM_PROFILE=ponwrt085 (PonWRT 0.8.5 verified v51 full set, 26 tables)"
              ;;
            generic)
              SRC="$ASSETS/files/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54/RTK66587_BPF_GENERIC"
              [ "$(find "$SRC" -name '*.txt' | wc -l)" = 12 ] \
                || { echo "::error::RTK66587_BPF_GENERIC 回滚目录不完整"; exit 1; }
              cp -a "$SRC"/. "$DST/RTK66587_BPF/"
              echo "FEM_PROFILE=generic (upstream v51 rollback, FEM subdir only)"
              ;;
            *)
              echo "::error::未知 fem_profile=$FEM_PROFILE"; exit 1
              ;;
          esac
          echo "FEM_PROFILE_SELECTED=$FEM_PROFILE"

      - name: Patch upstream packages (factory extraction)
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/patch-upstream.sh"

      - name: Patch WiFi driver diagnostics
        if: ${{ inputs.wifi_diag }}
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/patch-wifi-diag.sh"

      # 上游（20b4cf4）的 PE 引擎是 PT1570 实测坏掉并已 revert 的 IRAM/物理 CP3
      # 方案，两张 WiFi 卡 probe 都卡在等 PEWD -> -ETIMEDOUT -> 无 WiFi。
      # 这里把 rtl_ax_ap 驱动整套换成已验证可用的 PT1570 版本（含配套
      # pe-tx-code.h），覆盖掉上面 PE 步骤现场编译出的坏版头文件。
      # 必须在 Build PE firmware 之后、Configure 之前。
      # 诊断模式（wifi_diag=true）保留上游驱动 + 原有寄存器打点，便于对照；
      # 此时不覆盖 pci.c，否则 step 20 的 "diag 打点已注入" 断言会失败。
      - name: Overlay known-good PT1570 WiFi driver (PE IRAM revert)
        if: ${{ inputs.wifi_diag != true }}
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/overlay-wifi-driver.sh"

      # 2026-11-15：把 0.8.5 的功率限制位修复 + wifi-scripts txpower ucode
      # 修复落到编译树。驱动由 overlay 步骤整套复制，这里再做一次源码级
      # 断言，防止资产被误改回旧版（旧版会额外套厂商 TXPWR_LMT 表压功率）。
      - name: Apply PonWRT 0.8.5 TX power fix (driver + wifi-scripts)
        if: ${{ inputs.wifi_diag != true }}
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: |
          set -e
          bash "$ASSETS/scripts/apply-ponwrt-txpower-fixes.sh"
          D="$WRT/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap"
          grep -q "TYFZA1's original power_limit MIB defaults to 0" "$D/power-tables.c" \
            || { echo "::error::overlay 后的驱动缺 0.8.5 功率限制修复"; exit 1; }
          grep -q 'rtl_ax_update32(io, 0xd208, 0x00300000, 0);' "$D/power-tables.c" \
            || { echo "::error::0xd208 厂商限制位未清零"; exit 1; }
          grep -q 'rtl_ax_update32(io, 0xd21c, 0x00040000, 0);' "$D/power-tables.c" \
            || { echo "::error::0xd21c 厂商限制位未清零"; exit 1; }
          ! grep -q '0x00300000, 0x00300000' "$D/power-tables.c" \
            || { echo "::error::旧的 0xd208 置位逻辑残留"; exit 1; }
          echo "PONWRT085_POWER_FIX_OK=True (power_limit MIB=0, TX no longer capped below by-rate)"

      # 上游单 PE 兼容 WiFi 修复移植（C1/C2）：overlay + txpower fix 之后、Configure 之前。
      # 锚点是我们的参考版驱动；脚本内置单 PE1 硬护栏，任何锚点 !=1 直接失败。
      - name: Port upstream single-PE WiFi fixes
        if: ${{ inputs.wifi_diag != true && inputs.wifi_port != 'off' }}
        env:
          WIFI_PORT: ${{ inputs.wifi_port }}
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/apply-upstream-wifi-port.sh"

      - name: Verify upstream WiFi port (compile tree)
        if: ${{ inputs.wifi_diag != true }}
        env:
          WIFI_PORT: ${{ inputs.wifi_port }}
          WRT: ${{ github.workspace }}/wrt
        run: python3 "$GITHUB_WORKSPACE/scripts/verify-upstream-wifi-port.py" check-tree "$WRT" "$WIFI_PORT"

      # 2.4G 速率控制回归护栏。与 H10-CU workflow 同源：driver 源码在
      # board/wifi/rtl_ax_ap/ 与 cu-h10/fw/board/wifi/rtl_ax_ap/ 两处副本，
      # 补丁必须同时落到两份，否则 R10 会静默缺失修复。
      - name: Guard 2.4G rate-control patches (always runs)
        if: ${{ inputs.wifi_diag != true }}
        env:
          WRT: ${{ github.workspace }}/wrt
        run: |
          set -e
          D="$WRT/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap"
          for f in rate.h monitor.h pci.c; do
            [ -f "$D/$f" ] || { echo "::error::驱动缺文件: $f"; exit 1; }
          done
          grep -q 'static inline void rtl_ax_ra_legacy' "$D/rate.h" \
            || { echo "::error::2.4G legacy RA 补丁缺失 (rate.h)"; exit 1; }
          grep -q 'rtl_ax_ra_legacy(command, id, legacy, band5g)' "$D/monitor.h" \
            || { echo "::error::2.4G legacy RA 未接入 rtl_ax_ra_peer (monitor.h)"; exit 1; }
          grep -q 'static inline u8 rtl_ax_ra_rssi_mask' "$D/rate.h" \
            || { echo "::error::RA RSSI 掩码回退缺失 (rate.h)"; exit 1; }
          grep -q 'static inline void rtl_ax_ra_environment' "$D/rate.h" \
            || { echo "::error::RA 环境噪声标记缺失 (rate.h)"; exit 1; }
          grep -q 'level = rtl_ax_ra_rssi_mask(mask_command, rssi, previous);' "$D/monitor.h" \
            || { echo "::error::RSSI 掩码回退未接入 watchdog (monitor.h)"; exit 1; }
          grep -q 'u8 ra_rssi_level\[128\];' "$D/pci.c" \
            || { echo "::error::ra_rssi_level 状态缺失 (pci.c)"; exit 1; }
          echo "PT1570_2G_RATE_CONTROL_GUARD_OK=True"

      - name: Guard 2.4G RFE50 front-end fix (always runs)
        if: ${{ inputs.wifi_diag != true }}
        env:
          WRT: ${{ github.workspace }}/wrt
        run: |
          set -e
          D="$WRT/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap"
          # 8192XB must select RFE50 params (no external FEM), 8852C keeps RFE54.
          grep -q 'const char \*rfe = chip == RTL_AX_8852C ? "RFE54" : "RFE50";' "$D/phy.c" \
            || { echo "::error::2.4G RFE50 路径选择缺失 (phy.c)"; exit 1; }
          grep -q 'const char \*rfe = chip == RTL_AX_8852C ? "RFE54" : "RFE50";' "$D/limits.c" \
            || { echo "::error::2.4G RFE50 路径选择缺失 (limits.c)"; exit 1; }
          grep -q 'const char \*rfe = chip == RTL_AX_8852C ? "RFE54" : "RFE50";' "$D/power-tables.c" \
            || { echo "::error::2.4G RFE50 路径选择缺失 (power-tables.c)"; exit 1; }
          # No external FEM for 8192XB (fem=""), and FEM GPIO only for 8852C.
          grep -q 'const char \*fem = chip == RTL_AX_8852C ? "RTK66587_BPF" : "";' "$D/phy.c" \
            || { echo "::error::8192XB 仍被当作有外置 FEM (phy.c)"; exit 1; }
          grep -q 'if (chip == RTL_AX_8852C) {' "$D/bb-dm.h" \
            || { echo "::error::FEM GPIO 未按芯片限制为 8852C (bb-dm.h)"; exit 1; }
          grep -q 'rtl_ax_xb_gain2g(io, &phy->gain\[RTL_AX_PHY_FEM\]);' "$D/xb-channel.h" \
            || { echo "::error::2.4G FEM 增益补偿未应用 (xb-channel.h)"; exit 1; }
          # RPQ 8192XB stock agg=121 (0x00ff0079)
          grep -q '0x00ff0079' "$D/mac-runtime.h" \
            || { echo "::error::8192XB RPQ agg=121 缺失 (mac-runtime.h)"; exit 1; }
          # Old rfe50_8192xb module-param approach must be gone.
          ! grep -rq 'rfe50_8192xb' "$D" \
            || { echo "::error::旧的 rfe50_8192xb 开关残留"; exit 1; }
          # Complete RFE50 tables must ship in rootfs.
          R="$WRT/files/lib/firmware/realtek/tyfza1/rtl8192xbe/RFE50"
          for f in PHY_REG.txt PHY_REG_GAIN.txt RadioA.txt RadioB.txt \
                   TXPWR_ByRate.txt TXPWR_LMT.txt TXPWR_LMT_RU.txt TXPWR_TrackTSSI.txt; do
            [ -f "$R/$f" ] || { echo "::error::缺 2.4G RFE50 表: $f"; exit 1; }
          done
          [ "$(wc -c < "$R/PHY_REG.txt")" -gt 20000 ] \
            || { echo "::error::RFE50/PHY_REG.txt 不是完整表（<20KB）"; exit 1; }
          echo "PT1570_2G_RFE50_GUARD_OK=True"

      - name: Configure
        working-directory: wrt
        env:
          PT1570_BOARD: ${{ matrix.board }}
          ASSETS: ${{ github.workspace }}
          APK_MIRROR_BASE: ${{ inputs.apk_mirror_base }}
          APK_REPO_KEY_URL: ${{ inputs.apk_repo_key_url }}
          WIFI_DIAG: ${{ inputs.wifi_diag }}
        run: |
          set -e
          # ⚠️ 顺序敏感（run #10 根因，2026-11-10）：
          #   绝不能在空 .config 上先跑 make defconfig。上游 target-metadata.pl
          #   把 Target System choice 硬编码为 default TARGET_mediatek，空配置
          #   defconfig 会选中 mediatek/filogic 的默认机型 openwrt_one，把它的
          #   包集合（kmod-mt7915e → 官方 kmod-mac80211/kmod-cfg80211、
          #   wpad-basic-mbedtls、mt7981-wo-firmware、eip197-mini-firmware、
          #   kmod-rtc-pcf8563 等）以及其它所有包的 "# not set" 写成显式用户
          #   选择。切到 rtl9617c 后这些值原样保留：残留的 kmod-mac80211 与
          #   kmod-rtl-ax-ap 自带的 cfg80211.ko/mac80211.ko 安装时互相覆盖
          #   （package/install Error 1），而设备包默认值也救不回显式 n 的包。
          #   正确顺序：先写最小配置（target + 机型 + 包断言），再 defconfig。
          rm -f .config
          cat "$GITHUB_WORKSPACE/Config-PT1570-FIT.txt" >> .config
          # 诊断产物（wifi_diag=true）：CONFIG_DEVMEM + busybox devmem。
          # WiFi 定位完把 wifi_diag 关掉，正式产物不带 /dev/mem。
          if [ "${WIFI_DIAG:-false}" = "true" ]; then
            cat "$GITHUB_WORKSPACE/Config-DIAG.txt" >> .config
            echo "  diag: CONFIG_DEVMEM + busybox devmem"
          fi
          bash "$GITHUB_WORKSPACE/customize.sh"

          # uboot-envtools 的 host fw_printenv 在此 target 会挂，必须保持关闭
          sed -i 's|^CONFIG_PACKAGE_uboot-envtools=y|# CONFIG_PACKAGE_uboot-envtools is not set|' .config

          make defconfig
          cat "$GITHUB_WORKSPACE/Config-PT1570-FIT.txt" >> .config

          # defconfig 会静默丢掉未被 profile 点名的包，照 pt1500-build.sh 跑两次并断言
          make defconfig
          for sym in tyfza1-pon-control luci-ssl uhttpd fitblk; do
            if ! grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${sym} is not set$/d; /^CONFIG_PACKAGE_${sym}=/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
              echo "  re-asserted $sym"
            fi
          done
          make defconfig

          # 用户软件包基线（Config-EXTRA.txt，tailscale 三件套；vlmcsd 已按用户
          # 要求从 R10 移除）：customize.sh 已在前面追加，但两次 make defconfig
          # 可能把未被 profile 点名的包降级/丢弃；这里统一重新断言一次再检查。
          echo "===== user-requested packages (tailscale baseline) ====="
          USER_PKGS="tailscale luci-app-tailscale-community \
                     luci-i18n-tailscale-community-zh-cn"
          for p in $USER_PKGS; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${p} is not set$/d; /^CONFIG_PACKAGE_${p}=/d" .config
              echo "CONFIG_PACKAGE_${p}=y" >> .config
              echo "  re-asserted $p"
            fi
          done
          make defconfig
          for p in $USER_PKGS; do
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config \
              || { echo "ERROR: $p 未启用（feed 里找不到该包，或依赖不满足被降级）" >&2; exit 1; }
            echo "  OK   $p"
          done

          echo "===== hard assertions ====="
          grep -q "^CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y$" .config \
            || { echo "ERROR: profile $PROFILE 未启用" >&2; exit 1; }
          for sym in tyfza1-pon-control luci-ssl uhttpd fitblk; do
            grep -q "^CONFIG_PACKAGE_${sym}=y$" .config \
              || { echo "ERROR: $sym 二次 defconfig 后仍被丢弃" >&2; exit 1; }
            echo "  OK   $sym"
          done
          grep -q '^# CONFIG_PACKAGE_uboot-envtools is not set$' .config \
            || { echo "ERROR: uboot-envtools 必须关闭" >&2; exit 1; }
          echo "  OK   uboot-envtools disabled"

          # FIT rootfs 能不能挂上，取决于两个内核符号：
          #   UIMAGE_FIT_BLK      —— 把 FIT 里 type=filesystem 的 rootfs 映射成 /dev/fitblk0
          #   MTD_ROOTFS_ROOT_DEV —— 让 ubi 为名为 rootfs/fit 的卷自动建 ubiblock
          # 二者都是内核符号，不能写进顶层 .config（会被 make defconfig 丢弃，
          # run #13 已踩过这个坑）。UIMAGE_FIT_BLK 在 generic config 里默认关闭，
          # 由 target 的 config-6.18 打开；MTD_ROOTFS_ROOT_DEV 由 generic 提供。
          grep -q '^CONFIG_UIMAGE_FIT_BLK=y$' target/linux/rtl9617c/config-6.18 \
            || { echo "ERROR: target config-6.18 缺少 CONFIG_UIMAGE_FIT_BLK=y" >&2; exit 1; }
          echo "  OK   CONFIG_UIMAGE_FIT_BLK (target config)"
          grep -q '^CONFIG_MTD_ROOTFS_ROOT_DEV=y$' target/linux/generic/config-6.18 \
            || { echo "ERROR: generic config-6.18 缺少 CONFIG_MTD_ROOTFS_ROOT_DEV=y" >&2; exit 1; }
          echo "  OK   CONFIG_MTD_ROOTFS_ROOT_DEV (generic config)"

          # 诊断产物 vs 正式产物：/dev/mem 只能出现在 wifi_diag=true 的镜像里。
          # CONFIG_DEVMEM 属于内核选项，必须落在 target 的 config-6.18 上
          # （写顶层 .config 会被 make defconfig 静默丢弃，run #13 已踩过）。
          if [ "${WIFI_DIAG:-false}" = "true" ]; then
            grep -q '^CONFIG_DEVMEM=y$' target/linux/rtl9617c/config-6.18 \
              || { echo "ERROR: wifi_diag=true 但内核 config-6.18 没打开 CONFIG_DEVMEM" >&2; exit 1; }
            grep -q 'rtl_ax_diag_dump' \
              target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pci.c \
              || { echo "ERROR: wifi_diag=true 但驱动打点未注入" >&2; exit 1; }
            echo "  OK   wifi diag (kernel DEVMEM + diag dump)"
          else
            ! grep -q '^CONFIG_DEVMEM=y$' target/linux/rtl9617c/config-6.18 \
              || { echo "ERROR: 正式产物不允许 CONFIG_DEVMEM" >&2; exit 1; }
            echo "  OK   CONFIG_DEVMEM off"
          fi

          # 默认 WAN = pon0.<wan_vlan>（8021q 子设备）+ PPPoE，且 PON FE 必须默认打开
          #   2026-11-11 真机实证：untagged pon0 收不到 PADO；FE 关闭时单播上行被静默丢弃。
          WAN_DEF=files/etc/uci-defaults/95-pt1570-wan-default
          test -x "$WAN_DEF" \
            || { echo "ERROR: 缺少默认 WAN 的 uci-defaults 脚本或其可执行位丢失" >&2; exit 1; }
          grep -q 'network.wan.device="\$vlan_dev"' "$WAN_DEF" \
            || { echo "ERROR: 95-pt1570-wan-default 未把 wan.device 绑到 VLAN 子设备" >&2; exit 1; }
          grep -q 'wan_vlan=1101' "$WAN_DEF" \
            || { echo "ERROR: 默认上网 VLAN 未设为 1101" >&2; exit 1; }
          grep -q "pon.pon.offload='1'" "$WAN_DEF" \
            || { echo "ERROR: 默认未打开 PON FE(offload=1)，单播上行会全丢" >&2; exit 1; }
          # uci 值里不能夹单引号：外层双引号时 '8021q' 会变成字面量（带引号），
          # netifd 认不出设备类型，VLAN 子设备建不出来 → 又是收不到 PADO。
          ! grep -q "type='8021q'" "$WAN_DEF" \
            || { echo "ERROR: uci 值里出现了字面单引号（如 type='8021q'）" >&2; exit 1; }
          echo "  OK   default WAN -> pon0.1101 (pppoe) + PON FE on"
          grep -q "SUPPORTED_DEVICES += ${BOARD_NAME}" target/linux/rtl9617c/image/Makefile \
            || { echo "ERROR: image/Makefile 缺少 SUPPORTED_DEVICES" >&2; exit 1; }
          grep -q "$BOARD_NAME" target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: platform.sh 白名单缺少 $BOARD_NAME" >&2; exit 1; }
          test -f "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: DTS 缺失" >&2; exit 1; }
          echo "  OK   DTS=$DTS board_name=$BOARD_NAME"

          echo "===== R10 config sanity（run #10 修复的防回归断言）====="
          # 空配置 defconfig 会把 mediatek/filogic/openwrt_one 的包集写成显式
          # =y（污染源），并把设备包写成显式 n（压死 DEVICE_PACKAGES 默认值）。
          # 这里正反双向断言，任何一条失败都说明 Configure 的顺序被改坏了。
          for bad in kmod-mac80211 kmod-cfg80211 kmod-mt7915e kmod-mt76-core \
                     wpad-basic-mbedtls mt7981-wo-firmware eip197-mini-firmware \
                     airoha-en8811h-firmware kmod-phy-airoha-en8811h kmod-rtc-pcf8563; do
            if grep -qE "^CONFIG_PACKAGE_${bad}=(y|m)$" .config; then
              echo "ERROR: 检测到污染包 ${bad}（默认 target 的包残留），检查 Configure 步骤的 .config 初始化顺序" >&2
              exit 1
            fi
          done
          echo "  OK   无 mediatek/openwrt_one 残留包"
          for good in kmod-fs-ext4 kmod-fs-vfat kmod-nls-utf8 kmod-usb-storage \
                      kmod-usb-storage-uas wpad-mbedtls; do
            grep -q "^CONFIG_PACKAGE_${good}=y$" .config \
              || { echo "ERROR: 设备包 ${good} 未启用（被显式 n 压住）" >&2; exit 1; }
            echo "  OK   ${good}"
          done

          if [ "${DTS_STATUS:-experimental}" = "verified" ]; then
            ! grep -q 'UNVERIFIED' "target/linux/rtl9617c/dts/${DTS}.dts" \
              || { echo "ERROR: dts_status=verified 但 DTS 仍带 UNVERIFIED 标记" >&2; exit 1; }
            echo "  OK   DTS marked verified"
          else
            echo "  WARN DTS=experimental，产物禁止刷机 / 禁止发布 Release"
          fi

          echo "===== key config ====="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)=' .config || true
          echo "  =m packages: $(grep -c '^CONFIG_PACKAGE_.*=m$' .config || true)"
          echo "--- files/etc/apk/repositories.d/distfeeds.list ---"
          cat files/etc/apk/repositories.d/distfeeds.list
          cp .config "$GITHUB_WORKSPACE/Config-final.txt"

      - name: Run static preflight
        if: ${{ inputs.test_only }}
        env:
          PT1570_BOARD: ${{ matrix.board }}
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/preflight.sh"

      - name: Upload config (test_only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1570-R10-4GE-CU-sysupgrade-config-${{ github.run_number }}
          path: Config-final.txt
          retention-days: 14

      - name: Download sources
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          make package/base-files/clean >/dev/null 2>&1 || true
          make download -j"$(nproc)"

      - name: Compile
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          if make -j"$(nproc)" 2>&1 | tee -a "$LOG"; then
            echo "PARALLEL_BUILD_OK=True"
          else
            echo "::warning::并行编译失败，改用 -j1 V=s 重试并显示详细日志"
            if make -j1 V=s 2>&1 | tee -a "$LOG"; then
              echo "SERIAL_BUILD_OK=True"
            else
              echo "::group::BUILD FAILED - last 120 lines"
              tail -n 120 "$LOG"
              echo "::endgroup::"
              # 把关键错误行写成 annotation：匿名也能通过 check-runs annotations 读到，
              # 不必依赖需要管理员权限的日志下载接口。每个 step 最多 10 条，取最后 8 条。
              grep -E 'Error [0-9]|^make(\[[0-9]+\])?: \*\*\*|error:|No such file|not found|No space left|Killed|undefined reference|FATAL|FAIL' "$LOG" \
                | tail -n 8 | tr -d '\r' | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "BUILD_FAILED=True" >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Verify image payload (wifi firmware + patched factory)
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        env:
          ASSETS: ${{ github.workspace }}
          FEM_PROFILE: ${{ inputs.fem_profile }}
          WIFI_PORT: ${{ inputs.wifi_port }}
        run: |
          set -e
          ROOT=$(ls -d build_dir/target-*/root-rtl9617c* 2>/dev/null | head -1)
          [ -n "$ROOT" ] || { echo "::error::找不到 rootfs 目录 build_dir/target-*/root-rtl9617c*"; exit 1; }
          echo "rootfs dir: $ROOT"

          # 上游没有任何包安装 WiFi AP 固件，必须由 files/ overlay 带进镜像
          missing=0
          for f in "$ASSETS"/files/lib/firmware/realtek/tyfza1/*.bin; do
            base=${f##*/}
            tgt="$ROOT/lib/firmware/realtek/tyfza1/$base"
            if [ ! -f "$tgt" ]; then
              echo "::error::镜像缺少 WiFi 固件 $base"; missing=1; continue
            fi
            if ! cmp -s "$f" "$tgt"; then
              echo "::error::镜像内 $base 与资产不一致"; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          n=$(ls -1 "$ROOT"/lib/firmware/realtek/tyfza1/*.bin 2>/dev/null | wc -l)
          [ "$n" = 7 ] || { echo "::error::镜像内 WiFi 固件数量 $n != 7"; exit 1; }
          echo "WIFI_FIRMWARE_OK=True files=$n"

          # ---- apk 源与索引公钥（2026-11-13 真机：缺公钥会 UNTRUSTED signature） ----
          KEY_SRC="$ASSETS/files/etc/apk/keys/immortalwrt-25.12.pem"
          KEY_DST="$ROOT/etc/apk/keys/immortalwrt-25.12.pem"
          [ -f "$KEY_DST" ] || { echo "::error::镜像缺少 apk 索引公钥 immortalwrt-25.12.pem"; exit 1; }
          cmp -s "$KEY_SRC" "$KEY_DST" || { echo "::error::镜像内 apk 公钥与资产不一致"; exit 1; }
          echo "  OK   apk key: immortalwrt-25.12.pem ($(stat -c %s "$KEY_DST") B)"

          DF="$ROOT/etc/apk/repositories.d/distfeeds.list"
          [ -f "$DF" ] || { echo "::error::镜像缺少 distfeeds.list"; exit 1; }
          nfeed=$(grep -c 'mirrors\.pku\.edu\.cn/immortalwrt/releases/25\.12-SNAPSHOT/packages/aarch64_cortex-a53/' "$DF" || true)
          [ "$nfeed" = 5 ] || { echo "::error::distfeeds 里北大 25.12 源 $nfeed 条 != 5（base/luci/packages/routing/telephony）"; exit 1; }
          grep -v '^[[:space:]]*#' "$DF" | grep -q 'aarch64_cortex-a55' \
            && { echo "::error::distfeeds 有效源指向了镜像不存在的 aarch64_cortex-a55 目录（注释行不算）"; exit 1; }
          echo "  OK   distfeeds: 北大镜像 25.12-SNAPSHOT ×$nfeed（aarch64_cortex-a53）"

          # /etc/apk/arch 在 ROM 里只有 a55，首启由 91-pt1570-apk-arch 补 a53，
          # 否则镜像的 a53 包会被 apk 以 unsupported architecture 拒装。
          if [ -f "$ROOT/etc/apk/arch" ]; then
            grep -q 'aarch64_cortex-a55' "$ROOT/etc/apk/arch" \
              || { echo "::error::/etc/apk/arch 缺本机架构 aarch64_cortex-a55"; exit 1; }
            echo "  OK   /etc/apk/arch 本机架构 a55（a53 由首启脚本追加）"
          else
            echo "::error::镜像缺少 /etc/apk/arch"; exit 1
          fi
          [ -f "$ROOT/etc/uci-defaults/91-pt1570-apk-arch" ] \
            || { echo "::error::镜像缺少 91-pt1570-apk-arch（a53 不会被允许安装）"; exit 1; }
          grep -q 'aarch64_cortex-a53' "$ROOT/etc/uci-defaults/91-pt1570-apk-arch" \
            || { echo "::error::91-pt1570-apk-arch 没写 aarch64_cortex-a53"; exit 1; }
          echo "APK_SOURCE_OK=True feeds=$nfeed"

          # --- 网口接线兜底（2026-11-13 真机实证） ---
          # rtl9617c-xram 原生驱动注册 lan0/lan2/lan3/lan4（无 lan1），02_network
          # 默认分支写死 lan1..lan4 会把 lan0 漏在 br-lan 外（口不通、灯不亮），
          # 99-pt1570-fit 负责修正 br-lan ports 与 LED_EPHY0 绑定，缺一不可。
          U99="$ROOT/etc/uci-defaults/99-pt1570-fit"
          [ -f "$U99" ] \
            || { echo "::error::镜像缺少 99-pt1570-fit"; exit 1; }
          grep -q "for p in lan0 lan2 lan3 lan4" "$U99" \
            || { echo "::error::99-pt1570-fit 缺 R10 网口兜底（br-lan ports lan0/lan2/lan3/lan4）"; exit 1; }
          grep -q "LED_EPHY0" "$U99" && grep -q "dev='lan0'" "$U99" \
            || { echo "::error::99-pt1570-fit 缺 LED_EPHY0 改绑 lan0"; exit 1; }
          echo "  OK   99-pt1570-fit 网口兜底：br-lan=lan0/lan2/lan3/4，LED_EPHY0→lan0"

          # --- sysupgrade 机型校验（2026-11-14 真机实证） ---
          # 上游 base-files 带 lib/upgrade/pt1500-fip.sh，/sbin/sysupgrade 的
          # `include /lib/upgrade` 按字母序 source，它排在 platform.sh 之后，
          # 会覆盖 R10 的 platform_check_image，报
          #   "this image is for youhua,pt1500-h10, not youhua,pt1570-r10"
          # 且 platform_do_upgrade 会写不存在的 fip 卷。编译期已移除，这里复核产物。
          UPG="$ROOT/lib/upgrade"
          [ -d "$UPG" ] || { echo "::error::镜像缺少 /lib/upgrade"; exit 1; }
          [ ! -e "$UPG/pt1500-fip.sh" ] \
            || { echo "::error::镜像仍含 pt1500-fip.sh（sysupgrade 机型校验会被覆盖）"; exit 1; }
          ! grep -rl 'this image is for youhua,pt1500-h10' "$UPG" 2>/dev/null | grep -q . \
            || { echo "::error::镜像 /lib/upgrade 残留 PT1500-H10 机型检查"; exit 1; }
          grep -q 'youhua,pt1570-r10' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 白名单缺少 youhua,pt1570-r10"; exit 1; }
          grep -q 'CI_KERNPART=fit' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 升级目标卷不是 fit"; exit 1; }
          echo "SYSUPGRADE_BOARD_OK=True"

          # --- rpcd exec 插件 / argon 主题设置（2026-11-14 真机实证） ---
          # LuCI「系统 → 主题设置」报 luci.argon/avail -32000 Object not found，
          # 根因是 /usr/libexec/rpcd/luci.argon* 为 CRLF（#!/bin/sh\r）+ 0644，
          # rpcd 的 exec 插件一个都加载不了。assets 注入 LF+0755 版本覆盖包内文件，
          # 这里逐文件复核产物，避免 feed 升级悄悄把坏文件带回来。
          RPCD="$ROOT/usr/libexec/rpcd"
          [ -d "$RPCD" ] || { echo "::error::镜像缺少 /usr/libexec/rpcd"; exit 1; }
          n=0
          for f in "$ASSETS"/files/usr/libexec/rpcd/luci.argon*; do
            base=${f##*/}
            tgt="$RPCD/$base"
            [ -f "$tgt" ] || { echo "::error::镜像缺少 rpcd 插件 $base"; exit 1; }
            [ -x "$tgt" ] || { echo "::error::rpcd 插件 $base 不可执行（rpcd 不会加载）"; exit 1; }
            if grep -q "$(printf '\r')" "$tgt"; then
              echo "::error::rpcd 插件 $base 仍是 CRLF（shebang 会变成 /bin/sh\r）"; exit 1
            fi
            cmp -s "$f" "$tgt" || { echo "::error::镜像内 $base 与 assets 的 LF 版本不一致"; exit 1; }
            n=$((n+1))
          done
          [ "$n" = 5 ] || { echo "::error::argon rpcd 插件数量 $n != 5"; exit 1; }
          [ -f "$ROOT/etc/uci-defaults/92-pt1570-rpcd-eol" ] \
            || { echo "::error::镜像缺少 92-pt1570-rpcd-eol 兜底脚本"; exit 1; }
          echo "RPCD_ARGON_OK=True plugins=$n"

          # --- sysupgrade 不保留配置 + br-lan MAC 固定（2026-11-14 真机） ---
          # 现象：系统内更新无论是否勾选「保留配置」，配置都会保留；
          # 只有 U-Boot 刷入（ubiformat 整盘重建卷表）才清空。
          # 原因（run31 真机实证）：R10 靠 FIT 子镜像块设备挂根，
          # /sys/devices/platform/fitblk/lower_dev -> .../ubi0_1/ubiblock0_1，
          # 即 /dev/fit0 持有 ubiblock0_1。platform.sh 直接 nand_do_upgrade()
          # 绕过上游 fit.sh 的 fit_do_upgrade()（它先 fitblk /dev/fit0 释放），
          # 于是 nand_remove_ubiblock() 失败或 ubirmvol EBUSY 被 || : 吞掉、
          # ubimkvol 同名卷冲突 -> return 1 -> nand_do_upgrade_failed() 只
          # reboot -f，FIT 卷与 rootfs_data 原封不动。
          # 另外 nand_do_restore_config() 只看 /tmp/sysupgrade.tgz，不看
          # UPGRADE_BACKUP，也必须在 zz- 脚本里限制。
          ZZ="$ROOT/lib/upgrade/zz-pt1570-sysupgrade.sh"
          [ -f "$ZZ" ] || { echo "::error::镜像缺少 zz-pt1570-sysupgrade.sh"; exit 1; }
          grep -q 'UPGRADE_BACKUP' "$ZZ" \
            || { echo "::error::zz-pt1570-sysupgrade.sh 未按 UPGRADE_BACKUP 限制配置恢复"; exit 1; }
          grep -q 'umount -l /overlay' "$ZZ" \
            || { echo "::error::zz-pt1570-sysupgrade.sh 未卸载 overlay（ubirmvol 会失败）"; exit 1; }
          grep -q 'CI_KERNPART=fit' "$ZZ" \
            || { echo "::error::zz-pt1570-sysupgrade.sh 升级目标卷不是 fit"; exit 1; }
          LAST_SH=$(ls -1 "$ROOT"/lib/upgrade/*.sh 2>/dev/null | sed 's|.*/||' | sort | tail -1)
          [ "$LAST_SH" = "zz-pt1570-sysupgrade.sh" ] \
            || { echo "::error::zz-pt1570-sysupgrade.sh 不是 /lib/upgrade 里最后的 .sh（覆盖不生效）"; exit 1; }
          echo "SYSUPGRADE_KEEP_OK=True order=$LAST_SH"

          # fitblk 释放 FIT 子镜像：二进制必须在镜像里、必须进 ramfs、
          # 且必须在 nand_do_upgrade 之前调用。
          [ -f "$ROOT/usr/sbin/fitblk" ] && [ -s "$ROOT/usr/sbin/fitblk" ] \
            || { echo "::error::镜像缺少 /usr/sbin/fitblk（无法释放 /dev/fit0）"; exit 1; }
          grep -q 'RAMFS_COPY_BIN=.*fitblk' "$ZZ" \
            || { echo "::error::zz-pt1570-sysupgrade.sh 未把 fitblk 加进 RAMFS_COPY_BIN（stage2 找不到工具）"; exit 1; }
          grep -q '/usr/sbin/fitblk /dev/fit0' "$ZZ" \
            || { echo "::error::zz-pt1570-sysupgrade.sh 未释放 /dev/fit0"; exit 1; }
          grep -q '/usr/sbin/fitblk /dev/fitrw' "$ZZ" \
            || { echo "::error::zz-pt1570-sysupgrade.sh 未释放 /dev/fitrw"; exit 1; }
          F_LINE=$(grep -n '/usr/sbin/fitblk /dev/fit0' "$ZZ" | head -1 | cut -d: -f1)
          U_LINE=$(grep -n 'nand_do_upgrade "\$1"' "$ZZ" | head -1 | cut -d: -f1)
          [ -n "$F_LINE" ] && [ -n "$U_LINE" ] && [ "$F_LINE" -lt "$U_LINE" ] \
            || { echo "::error::fitblk 释放顺序不在 nand_do_upgrade 之前"; exit 1; }
          echo "FITBLK_RELEASE_OK=True fitblk_line=$F_LINE nand_line=$U_LINE"

          # br-lan 默认从第一个桥成员 lan0 继承内核随机 MAC（Windows 每次
          # 重启报「新网络」）。99-pt1570-fit 必须显式给 @device[0] 写 factory MAC。
          grep -q 'network.@device\[0\].macaddr' "$U99" \
            || { echo "::error::99-pt1570-fit 未固定 br-lan MAC（Windows 每次重启报新网络）"; exit 1; }
          grep -q '/tmp/tyfza1-factory/lan_mac' "$U99" \
            || { echo "::error::99-pt1570-fit 的 MAC 未取自 factory lan_mac"; exit 1; }
          echo "LAN_MAC_OK=True"

          # --- RFE54 射频参数表 + TSSI 热补偿曲线 + 单板校准 ---
          # 这四类输入缺任何一个，rtl_ax_ap 都会在 phy/fem/cal 阶段失败退出：
          #   realtek/tyfza1/<chip>/RFE54/*.txt        PHY/Radio/功率限值
          #   realtek/tyfza1/<chip>/RFE54/<FEM>/*.txt  FEM 二级表（8852CE=RTK66587_BPF，
          #                                            8192XBE=RTK66287）
          #   realtek/tyfza1/<chip>/tssi-thermal-*.bin 由 TXPWR_TrackTSSI 曲线导出
          #   realtek/tyfza1/<chip>/flash-calibration.bin 开机由 tyfza1-factory 从
          #                                            ubi_Config 导出（镜像内是软链接）
          # 路径必须与驱动 request_firmware() 拼出的字符串完全一致。
          rfe_expected=$(find "$ASSETS"/files/lib/firmware/realtek/tyfza1 \
                           -path '*RFE54*' -name '*.txt' | wc -l)
          rfe_got=$(find "$ROOT/lib/firmware/realtek/tyfza1" \
                      -path '*RFE54*' -name '*.txt' 2>/dev/null | wc -l)
          [ "$rfe_expected" -ge 40 ] \
            || { echo "::error::仓库里 RFE54 参数表只有 $rfe_expected 个，资产不完整"; exit 1; }
          [ "$rfe_got" = "$rfe_expected" ] \
            || { echo "::error::镜像内 RFE54 参数表 $rfe_got != $rfe_expected"; exit 1; }
          for f in \
            rtl8852ce/RFE54/PHY_REG.txt rtl8852ce/RFE54/RadioA.txt \
            rtl8852ce/RFE54/RTK66587_BPF/PHY_REG.txt \
            rtl8192xbe/RFE54/PHY_REG.txt \
            rtl8192xbe/RFE54/RTK66287/PHY_REG.txt \
            rtl8852ce/tssi-thermal-5g.bin rtl8192xbe/tssi-thermal-2g.bin; do
            [ -f "$ROOT/lib/firmware/realtek/tyfza1/$f" ] \
              || { echo "::error::镜像缺少 WiFi 参数文件 $f"; exit 1; }
          done
          # 曲线长度是驱动结构体尺寸：8852C 3组×2路×2符号×30 = 360；XB 2×2×30 = 120
          [ "$(wc -c < "$ROOT/lib/firmware/realtek/tyfza1/rtl8852ce/tssi-thermal-5g.bin")" = 360 ] \
            || { echo "::error::5G TSSI 热补偿曲线不是 360 字节"; exit 1; }
          [ "$(wc -c < "$ROOT/lib/firmware/realtek/tyfza1/rtl8192xbe/tssi-thermal-2g.bin")" = 120 ] \
            || { echo "::error::2.4G TSSI 热补偿曲线不是 120 字节"; exit 1; }
          echo "WIFI_RF54_OK=True tables=$rfe_got"

          # 默认无线配置：两颗射频都要在而且默认启用，否则刷完看不到 WiFi
          [ -f "$ROOT/etc/config/wireless" ] \
            || { echo "::error::镜像缺少默认 /etc/config/wireless"; exit 1; }
          [ "$(grep -c "option disabled '0'" "$ROOT/etc/config/wireless")" = 2 ] \
            || { echo "::error::默认 wireless 配置的 radio 数不是 2 或未启用"; exit 1; }
          echo "WIFI_DEFAULT_CFG_OK=True"

          # ---- SSID 按型号+频段区分，禁用双频合一（2026-11-16）----
          grep -q "^[[:space:]]*option ssid 'PT1570-R10-5G'$" "$ROOT/etc/config/wireless" \
            || { echo "::error::镜像缺 5G SSID PT1570-R10-5G"; exit 1; }
          grep -q "^[[:space:]]*option ssid 'PT1570-R10-2.4G'$" "$ROOT/etc/config/wireless" \
            || { echo "::error::镜像缺 2.4G SSID PT1570-R10-2.4G"; exit 1; }
          [ "$(grep -c "option ssid 'PT1570-R10'" "$ROOT/etc/config/wireless")" = 0 ] \
            || { echo "::error::镜像仍有双频合一 SSID PT1570-R10"; exit 1; }
          ssn=$(grep -c "option ssid" "$ROOT/etc/config/wireless")
          [ "$ssn" = 2 ] || { echo "::error::镜像 SSID 数 $ssn != 2"; exit 1; }
          echo "SSID_PER_BAND_OK=True (PT1570-R10-5G / PT1570-R10-2.4G, no dual-band unify)"

          # ---- hostapd 断流缓解参数（2026-11-17，移植自 lu-1991 CI）----
          [ "$(grep -c "option skip_inactivity_poll '1'" "$ROOT/etc/config/wireless")" = 2 ] \
            || { echo "::error::镜像两个 VAP 缺 skip_inactivity_poll=1"; exit 1; }
          [ "$(grep -c "option disassoc_low_ack '0'" "$ROOT/etc/config/wireless")" = 2 ] \
            || { echo "::error::镜像两个 VAP 缺 disassoc_low_ack=0"; exit 1; }
          [ -x "$ROOT/etc/uci-defaults/96-pt1570-wifi-tuning" ] \
            || { echo "::error::96-pt1570-wifi-tuning 未进镜像或丢了可执行位"; exit 1; }
          grep -q 'skip_inactivity_poll' "$ROOT/etc/uci-defaults/96-pt1570-wifi-tuning" \
            || { echo "::error::96 tuning 缺 skip_inactivity_poll(sysupgrade 保留配置不会补)"; exit 1; }
          grep -q 'disassoc_low_ack' "$ROOT/etc/uci-defaults/96-pt1570-wifi-tuning" \
            || { echo "::error::96 tuning 缺 disassoc_low_ack(sysupgrade 保留配置不会补)"; exit 1; }
          echo "HOSTAPD_STABILITY_OK=True (skip_inactivity_poll=1 / disassoc_low_ack=0 on 2 VAPs)"

          # ---- 上游单 PE WiFi 移植：镜像内符号/统计名断言（仅 wifi_port != off）----
          if [ "${WIFI_PORT:-off}" != "off" ]; then
            KO=$(find "$ROOT/lib/modules" -name "rtl_ax_ap.ko" 2>/dev/null | head -1)
            [ -n "$KO" ] || { echo "::error::镜像缺 rtl_ax_ap.ko"; exit 1; }
            grep -aq "scan_RSSI_matched" "$KO" \
              || { echo "::error::rtl_ax_ap.ko 缺 scan RSSI 统计符号（B1 未编入）"; exit 1; }
            echo "WIFI_PORT_IMAGE_OK=True (port=${WIFI_PORT}, rtl_ax_ap.ko has scan stats)"
          fi

          # ---- 原厂 PT1570 专用 FEM 表 + hostapd 高级参数（2026-11-14）----
          # 资产层：sha256 / 版本注释 / 回滚目录 / 溯源目录 / uci-defaults 全查
          python3 "$ASSETS/scripts/verify-stock-wifi-assets.py"
          # ---- PonWRT 0.8.5 功率限制位修复 + 射频表 profile（2026-11-15）----
          python3 "$ASSETS/scripts/verify-ponwrt085-wifi.py"
          WFW="$ROOT/lib/firmware/realtek/tyfza1"
          # 0.8.5 驱动修复必须真的进了编译树（源码不进 rootfs，只能查 build tree）
          PT="target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/power-tables.c"
          grep -q "TYFZA1's original power_limit MIB defaults to 0" "$PT" \
            || { echo "::error::编译树驱动缺 0.8.5 功率限制修复（信号会被厂商表压低）"; exit 1; }
          grep -q 'rtl_ax_update32(io, 0xd208, 0x00300000, 0);' "$PT" \
            || { echo "::error::编译树驱动 0xd208 限制位未清零"; exit 1; }
          ! grep -q '0x00300000, 0x00300000' "$PT" \
            || { echo "::error::编译树驱动仍有旧置位逻辑"; exit 1; }
          echo "PONWRT085_POWER_FIX_OK=True"
          # 0.8.5 完整射频表随镜像带上，供实机 / 后续 profile 切换 A/B 对照
          [ "$(find "$WFW/rtl8852ce/RFE54_PONWRT085" -name '*.txt' 2>/dev/null | wc -l)" = 26 ] \
            || { echo "::error::镜像缺 PonWRT 0.8.5 RFE54 profile（26 表）"; exit 1; }
          grep -q 'version = 51' "$WFW/rtl8852ce/RFE54_PONWRT085/RTK66587_BPF/PHY_REG_GAIN.txt" \
            || { echo "::error::0.8.5 profile 不是 v51 通用标定"; exit 1; }
          echo "PONWRT085_PROFILE_OK=True (26 tables)"
          # 按 dispatch 的 fem_profile 校验镜像内生效的那套默认表
          A5="$ASSETS/files/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54"
          case "$FEM_PROFILE" in
            yh1570)
              grep -q 'version = 52-for 17C' \
                "$WFW/rtl8852ce/RFE54/RTK66587_BPF/PHY_REG_GAIN.txt" \
                || { echo "::error::yh1570: 镜像内 5G FEM 表不是原厂 17C v52"; exit 1; }
              for f in PHY_REG.txt PHY_REG_GAIN.txt TXPWR_ByRate.txt; do
                cmp -s "$A5/RTK66587_BPF/$f" "$WFW/rtl8852ce/RFE54/RTK66587_BPF/$f" \
                  || { echo "::error::yh1570: 镜像内 5G FEM 表 $f 与原厂资产不一致"; exit 1; }
              done
              ;;
            ponwrt085)
              grep -q 'version = 51' \
                "$WFW/rtl8852ce/RFE54/RTK66587_BPF/PHY_REG_GAIN.txt" \
                || { echo "::error::ponwrt085: 镜像内默认 FEM 表未切到 v51"; exit 1; }
              for f in PHY_REG.txt PHY_REG_GAIN.txt TXPWR_ByRate.txt; do
                cmp -s "$A5/RFE54_PONWRT085/RTK66587_BPF/$f" \
                      "$WFW/rtl8852ce/RFE54/RTK66587_BPF/$f" \
                  || { echo "::error::ponwrt085: 镜像内 5G FEM 表 $f 与 0.8.5 资产不一致"; exit 1; }
              done
              ;;
            generic)
              for f in PHY_REG.txt PHY_REG_GAIN.txt TXPWR_ByRate.txt; do
                cmp -s "$A5/RTK66587_BPF_GENERIC/$f" \
                      "$WFW/rtl8852ce/RFE54/RTK66587_BPF/$f" \
                  || { echo "::error::generic: 镜像内 5G FEM 表 $f 与通用回滚版不一致"; exit 1; }
              done
              ;;
          esac
          for d in RTK66587_BPF_YH1570 RTK66587_BPF_GENERIC; do
            [ "$(find "$WFW/rtl8852ce/RFE54/$d" -name '*.txt' 2>/dev/null | wc -l)" = 12 ] \
              || { echo "::error::镜像缺少原厂 FEM 溯源/回滚目录 $d"; exit 1; }
          done
          [ "$(find "$WFW/rtl8192xbe/RFE54/RTC7646" -name '*.txt' 2>/dev/null | wc -l)" = 8 ] \
            || { echo "::error::镜像缺少 2.4G 备选 FEM 表 RTC7646"; exit 1; }
          echo "STOCK_WIFI_FEM_OK=True (profile=$FEM_PROFILE; YH1570/GENERIC/PONWRT085 all shipped)"

          [ -x "$ROOT/etc/uci-defaults/96-pt1570-wifi-tuning" ] \
            || { echo "::error::96-pt1570-wifi-tuning 未进镜像或丢了可执行位"; exit 1; }
          [ "$(grep -c "option he_su_beamformer '1'" "$ROOT/etc/config/wireless")" = 2 ] \
            || { echo "::error::/etc/config/wireless 未带原厂 HE beamforming 参数"; exit 1; }
          echo "STOCK_WIFI_CFG_OK=True (LDPC/STBC/beamforming on both radios, country=CN)"

          # 校验打包的是修补后的 factory 提取脚本，且校准软链接存在（目标在 /tmp，属于正常）
          grep -q 'mv "\$tmp" "\$3"' "$ROOT/etc/init.d/tyfza1-factory" \
            || { echo "::error::镜像里的 tyfza1-factory 未应用 factory_blob 修补"; exit 1; }
          echo "FACTORY_PATCH_OK=True"

          # 默认 WAN=pon0：uci-defaults 必须进镜像并带可执行位
          [ -f "$ROOT/etc/uci-defaults/95-pt1570-wan-default" ] \
            || { echo "::error::镜像缺少 95-pt1570-wan-default（默认 WAN 仍是 pon0.3961）"; exit 1; }
          [ -x "$ROOT/etc/uci-defaults/95-pt1570-wan-default" ] \
            || { echo "::error::95-pt1570-wan-default 丢了可执行位，rc 不会执行它"; exit 1; }
          echo "WAN_DEFAULT_OK=True"
          for l in \
            lib/firmware/realtek/tyfza1/rtl8852ce/flash-calibration.bin \
            lib/firmware/realtek/tyfza1/rtl8192xbe/flash-calibration.bin \
            lib/firmware/realtek/rtl9617c/bosa-calibration.bin \
            lib/firmware/realtek/rtl9617c/a2h.bin; do
            [ -L "$ROOT/$l" ] || echo "::warning::缺少校准软链接 $l"
          done

          # ---- FIT rootfs 自洽性 ----
          # 挂根完全靠内核侧：CONFIG_MTD_ROOTFS_ROOT_DEV 为 chosen.rootdisk 指向的
          # fit 卷建 ubiblock，CONFIG_UIMAGE_FIT_BLK 的 fitblk 驱动解析 FIT 并自设
          # ROOT_DEV。bootargs 里不写 root=（run15 回归，见板级 DTS 注释）。
          KCFG=$(ls -d build_dir/target-*/linux-rtl9617c/linux-*/.config 2>/dev/null | head -1)
          [ -n "$KCFG" ] || KCFG=$(find build_dir -maxdepth 6 -path '*linux-rtl9617c*' \
              -name auto.conf 2>/dev/null | head -1)
          if [ -n "$KCFG" ]; then
            for sym in CONFIG_UIMAGE_FIT_BLK CONFIG_MTD_ROOTFS_ROOT_DEV CONFIG_SQUASHFS; do
              grep -q "^${sym}=y$" "$KCFG" \
                || { echo "::error::内核 $KCFG 里 ${sym} 不是 y，FIT rootfs 挂不上"; exit 1; }
            done
            echo "KERNEL_FIT_ROOTFS_OK=True ($KCFG)"
          else
            echo "::warning::找不到内核编译后的 .config，跳过 KERNEL_FIT_ROOTFS_OK"
          fi

          # 直接解析产出的 sysupgrade.itb。差分实证（fw12/fw14 能启动、
          # fw15..fw22 起不来）显示 run15 起往 DTS 加的 /chosen 覆盖块就是回归点，
          # 所以校验重点是：bootargs 不含 root=/rootwait/ubi.*、rootdisk 指向
          # volname=fit 的卷、分区带 linux,ubi、model 不再是 ABI。
          # 用户已在 U-Boot 清空 env 恢复默认，fdt_chosen() 不会覆盖 DTB bootargs。
          ITB=$(ls bin/targets/rtl9617c/generic/*sysupgrade.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "::error::找不到 sysupgrade.itb"; exit 1; }
          python3 "$ASSETS/scripts/verify-fit-boot.py" "$ITB"

          echo "IMAGE_PAYLOAD_OK=True"

      - name: Upload build log (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1570-R10-4GE-CU-sysupgrade-build-log-${{ github.run_number }}
          path: |
            build.log
            step-feeds.log
          if-no-files-found: warn
          retention-days: 30

      - name: Refresh package index
        if: ${{ !inputs.test_only && inputs.publish_packages }}
        working-directory: wrt
        run: |
          make package/index
          find bin/targets/rtl9617c/generic/packages bin/packages \
            -name packages.adb -printf '%p %s bytes\n' 2>/dev/null | sort || true

      - name: Collect firmware + matching packages
        if: ${{ !inputs.test_only }}
        env:
          PUBLISH_PACKAGES: ${{ inputs.publish_packages }}
          DTS_STATUS: ${{ inputs.dts_status }}
          FEM_PROFILE: ${{ inputs.fem_profile }}
          WIFI_PORT: ${{ inputs.wifi_port }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/wrt"
          echo "===== bin/targets/rtl9617c/generic ====="
          ls -lh bin/targets/rtl9617c/generic/ | head -40

          find bin/targets/rtl9617c/generic -maxdepth 1 -type f \
            -name "*${PROFILE}*" ! -name "*.json" \
            -exec cp -v {} "$OUT/" \;

          ls "$OUT/"*sysupgrade.itb >/dev/null 2>&1 || {
            echo "ERROR: 没有产出 ${PROFILE} 的 sysupgrade.itb" >&2; exit 1; }

          cp .config "$OUT/Config-final.txt"
          echo "$SOURCE_HASH" > "$OUT/source-commit.txt"
          {
            echo "board=$MODEL ($BOARD_NAME)"
            echo "release_id=PT1570-R10-4GE-CU-sysupgrade"
            echo "artifact_type=sysupgrade"
            echo "profile=$PROFILE"
            echo "dts=$DTS"
            echo "dts_status=${DTS_STATUS:-experimental}"
            echo "source_ref=$SOURCE_REF"
            echo "source_commit=$SOURCE_HASH"
            echo "abi=ubi_device / factory(8MiB,static) / fit / rootfs_data"
            echo "firmware=sysupgrade.itb (FIT external-static-with-rootfs)"
            echo "bootloader=lyq1996/rtl9617c-uboot@refactor 2026.07-g9abafc0572b2 (pt1500-h10-2p5g_defconfig)"
            echo "bootloader_fit_abi=yes (firmware_volume=fit, overlay_volume=rootfs_data, factory=8MiB static)"
            echo "bootcmd_default=bootmenu -> menu_0 rtk_boot / menu_1 rtk_recovery"
            echo "stock_wifi_fem=RTK66587_BPF_YH1570 (RTL9617C v52, replaces upstream generic v51)"
            echo "stock_wifi_rollback=RTK66587_BPF_GENERIC/ (12 tables) + YH1570/ + 2.4G RTC7646/"
            echo "stock_wifi_cfg=LDPC/STBC/VHT+HE beamforming (hostapd.uc capability-gated), country=CN"
            echo "stock_wifi_cal=TYFC0003 per-board calibration from factory 0x2000/0x3000 via S09 tyfza1-factory"
            echo "fem_profile=$FEM_PROFILE (yh1570=oem v52 / ponwrt085=v0.8.5 v51 / generic=upstream v51)"
            echo "ponwrt085_power_fix=power_limit MIB=0; 0xd208/0xd21c vendor limit bits cleared (was capping TX below by-rate)"
            echo "ponwrt085_txpower_ucode=wifi-scripts mac80211.sh txpower!=null + setup_failed on iw failure"
            echo "ponwrt085_profile=RFE54_PONWRT085/ (26 v51 tables from v0.8.5-beta sysupgrade.bin, dispatch fem_profile to switch)"
            echo "wifi_port=${WIFI_PORT:-off} (off=stock / scan-rssi / scan-rssi+ra)"
            if [ "${WIFI_PORT:-off}" != "off" ]; then
              echo "wifi_port_source=LeoooChen/PonWRT-TYFZA1@6077a9a+{f74af178} (single-PE subset)"
              echo "wifi_port_pe_engine=PE1/4076words/md5=7eb49893 (unchanged)"
              echo "wifi_port_skipped=pe-tx-code.h / rx-geometry WD-retain / pe-core.c (dual-PE incompatible)"
            fi
          } > "$OUT/BUILD_INFO.txt"

          if [ "${DTS_STATUS:-experimental}" != "verified" ]; then
            {
              echo "EXPERIMENTAL BUILD - dts_status=${DTS_STATUS:-experimental}"
              echo "The R10 DTS has been booted on a real PT1570-R10 (PPPoE up,"
              echo "4xGE LAN all registered, both PCIe WiFi6 radios AP-ENABLED,"
              echo "Web Failsafe reachable on 4xGE). It was switched to VERIFIED"
              echo "on 2026-11-16, so this image was explicitly built in"
              echo "experimental mode. Use it only for side-by-side comparison;"
              echo "the verified build is the one to flash normally."
              echo "Still to confirm on site: panel LED and 3-button behaviour."
            } > "$OUT/EXPERIMENTAL-NOT-FOR-FLASH.txt"
          fi

          case "$PUBLISH_PACKAGES" in
            false) DO_PACKAGES=0 ;;
            *)     DO_PACKAGES=1 ;;
          esac
          if [ "$DO_PACKAGES" = "1" ]; then
            ROOT="$GITHUB_WORKSPACE/pkgroot"
            rm -rf "$ROOT"
            mkdir -p "$ROOT/targets/rtl9617c/generic/packages" "$ROOT/packages"
            cp -a bin/targets/rtl9617c/generic/packages/. \
                  "$ROOT/targets/rtl9617c/generic/packages/" 2>/dev/null || true
            if [ -d bin/packages ]; then cp -a bin/packages/. "$ROOT/packages/"; fi

            KMOD_N=$(find "$ROOT" -type f -name 'kmod-*.apk' | wc -l)
            APK_N=$(find "$ROOT" -type f -name '*.apk' | wc -l)
            IDX_N=$(find "$ROOT" -type f -name 'packages.adb' | wc -l)
            echo "===== matching packages: kmod=$KMOD_N apk=$APK_N index=$IDX_N ====="
            test "$KMOD_N" -gt 0 || { echo "ERROR: 没有 kmod-*.apk" >&2; exit 1; }
            test "$APK_N"  -gt 0 || { echo "ERROR: 没有 .apk" >&2; exit 1; }
            test "$IDX_N"  -gt 0 || { echo "ERROR: 没有 packages.adb" >&2; exit 1; }

            if [ -f public-key.pem ]; then
              cp public-key.pem "$ROOT/public-key.pem"
            else
              echo "WARN: public-key.pem 缺失，跨批次装包需自行导公钥" >&2
            fi
            {
              echo "# 同批 packages（源码 $SOURCE_REF @ $SOURCE_HASH，架构 aarch64_cortex-a55）"
              echo "# 解包到静态站点根 BASE 后按需写入 /etc/apk/repositories.d/customfeeds.list"
              echo "BASE/targets/rtl9617c/generic/packages/packages.adb"
              find "$ROOT/packages" -name packages.adb -printf '%P\n' 2>/dev/null \
                | sort | sed 's|^|BASE/packages/|' || true
            } > "$ROOT/apk-repos.txt"
            {
              echo "source_ref=$SOURCE_REF"
              echo "source_commit=$SOURCE_HASH"
              echo "target=rtl9617c/generic"
              echo "profile=$PROFILE"
              echo "arch_packages=aarch64_cortex-a55"
              echo "linux=$(grep -m1 '^CONFIG_LINUX_VERSION=' .config || echo unknown)"
              echo "kmods=$KMOD_N apks=$APK_N indexes=$IDX_N"
            } > "$ROOT/BUILD_INFO.txt"

            cd "$GITHUB_WORKSPACE"
            tar --zstd -cf "artifact/PT1570-R10-4GE-CU-sysupgrade-packages-${{ github.run_number }}.tar.zst" \
                -C "$ROOT" .
            ls -lh "artifact/PT1570-R10-4GE-CU-sysupgrade-packages-${{ github.run_number }}.tar.zst"
          fi

          cd "$OUT"
          find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%f\n' \
            | sort | xargs sha256sum > sha256sums.txt
          echo "===== artifact ====="
          ls -lh

      - name: Upload firmware
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1570-R10-4GE-CU-sysupgrade-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ !inputs.test_only && inputs.create_release && inputs.dts_status == 'verified' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: PT1570-R10-4GE-CU-sysupgrade-${{ github.run_number }}
          name: PT1570-R10-4GE-CU-sysupgrade (${{ github.run_number }})
          files: artifact/*
          body: |
            Release ID `PT1570-R10-4GE-CU-sysupgrade`
            源码 lyq1996/rtl9617c-openwrt `${{ env.SOURCE_REF }}` @ `${{ env.SOURCE_HASH }}`
            机型 ${{ env.MODEL }} / profile `${{ env.PROFILE }}` / DTS `${{ env.DTS }}`
            布局：factory(8 MiB static) + fit + rootfs_data（统一 UBI 方案），产物 sysupgrade.itb
            配置见 Config-final.txt；校验见 sha256sums.txt
            本版 WiFi 整合：5G FEM 表换成原厂 PT1570 专用 `RTK66587_BPF_YH1570`（RTL9617C v52 标定，通用 v51 另存 `RTK66587_BPF_GENERIC/` 可回滚）；补上原厂 hostapd/MIB 的 LDPC、STBC、VHT/HE beamforming 配置（hostapd 按驱动能力自动回退），country 保持 CN；2.4G 默认表未动，另带原厂 `RTC7646/` 备选。
            本版 PonWRT 0.8.5 信号修复（对齐原厂）：开源驱动旧版把 SCC MAC0 的 `0xd208`/`0xd21c` 置位，额外启用厂商 `TXPWR_LMT`/`TXPWR_LMT_RU` 限制表，把发射功率压到单板 by-rate 标定值以下 —— 这是「WiFi 信号明显弱于原厂」的总闸。现按 0.8.5 与原厂 `power_limit MIB=0` 把这些位清零；by-rate 值本身已含 Linux/regdb 上限，不放宽合规。同时移植 0.8.5 的 wifi-scripts `txpower!=null` / 设置失败上报修复。0.8.5 是独立双 PE 驱动 + 36 个内核补丁，与本机单 PE1 驱动不兼容，未整套替换；其 26 张实机 v51 射频表随镜像放在 `RFE54_PONWRT085/`，编译时用 `fem_profile` 选 `yh1570`（默认）/ `ponwrt085` / `generic` 做 A/B 对照。
            本轮 `publish_packages=false`，未产出同批 packages；如需配套 kmod / packages.adb，请置 true 重编（kmod 与固件 vermagic 绑定，须成对使用）。
            ⚠️ 刷机前必须已完成新 U-Boot（rtk_boot / 读 fit 卷）确认、factory 导入与卷表重建，详见方案文档。
            ⚠️ 刷机前 U-Boot env 应保持编译默认（pt1570.env 无 bootargs）；清空动作执行一次即可。
            ⚠️ 本固件 bootargs 不含 root=，挂根由内核 MTD_ROOTFS_ROOT_DEV + fitblk 驱动自设 ROOT_DEV 完成。
            ⚠️ 本仓库当前为 R10-only 范围，产物仅适用于 PT1570-R10。
            上游单 PE WiFi 移植：本产物 wifi_port 设置见 BUILD_INFO.txt（off / scan-rssi / scan-rssi+ra）。
            scan-rssi/scan-rssi+ra 在已验证的单 PE1 参考驱动上定向移植上游 6077a9a 的扫描/站点 RSSI 解码（iwinfo/station dump 上报真实负 dBm、sw_scan 回调）与 6077a9a/f74af178 的 RA 信号解析结构；严格跳过双 PE 微码、pe-core.c 与 WD 保留位（与本平台不兼容）。迁移仅取可验证子集，上游公开资料中 WiFi 吞吐根因尚未闭环，本版不承诺追平原厂私有驱动速率。
