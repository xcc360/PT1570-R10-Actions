# SPDX-License-Identifier: MIT
# PonWRT / PT1570-R10 单机型 / 统一 FIT ABI 云编译
#
# 这套资产对应《PT1570-R10_H10-FIT统一ABI-云编译补齐方案.md》的方案③。
# ABI：factory(8 MiB static) + fit + rootfs_data，产物 sysupgrade.itb。
#
# ⚠️ 2026-11-09 起按用户决定收窄为 **R10-only**：
#    PT1570-H10 暂缓（设备未上线、无 factory、DTS 无可验证硬件事实）。
#    H10 的 Device/DTS 资产保留在 board/ 下但标记为 DORMANT，不参与任何构建；
#    apply-board.sh 需要显式 PT1570_ALLOW_H10=1 才会处理 h10，默认直接拒绝。
#    恢复双机型的方法见方案文档「R10-only 范围与恢复 H10」一节。
#
# ⚠️ R10 DTS 状态：已按真机 FDT（2026-11-09 导出 447 个属性）完成静态移植，
#    修正了 include 2.5G 板的错误，但**尚未在新固件上真机启动验证**，
#    仍带 UNVERIFIED 标记。默认 dts_status=experimental，产物带 DO-NOT-FLASH
#    警告且禁止发布 Release；只有真机验证 LAN/WiFi/PON/LED 全部正常、
#    去掉 UNVERIFIED 并显式选 verified 才允许正式发布。
#
# Actions 运行时：checkout@v5 / upload-artifact@v6 / action-gh-release@v3（Node 24）。
# 同批 packages：kmod 绑定本次内核 vermagic，必须与固件成对产出、成对使用。

name: Build PonWRT PT1570 FIT

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'lyq1996/rtl9617c-openwrt 的 commit / 分支（默认锁定已核实 commit 的完整 SHA，来自 pt1500-h10-fixes 分支）'
        required: false
        default: '20b4cf4490ca55cc406d07e391691efa8cd8a087'
        type: string
      dts_status:
        description: 'DTS 验证状态；experimental 只出验证产物，verified 才允许发布 Release'
        required: false
        default: 'experimental'
        type: choice
        options: [experimental, verified]
      test_only:
        description: '只生成并上传 .config / 校验报告，不编译'
        required: false
        default: false
        type: boolean
      create_release:
        description: '发布到 GitHub Release（仅 dts_status=verified 时生效）'
        required: false
        default: false
        type: boolean
      publish_packages:
        description: '同期收集并发布配套 packages（kmod + packages.adb + 公钥）'
        required: false
        default: true
        type: boolean
      packages_repo_url:
        description: '可选：自建 packages 静态源根 URL，随固件写入 customfeeds.list'
        required: false
        default: ''
        type: string
      apk_mirror_base:
        description: '可选：外部 apk 镜像根 URL。注意本 target 架构是 aarch64_cortex-a55，多数国内镜像没有该目录，留空最安全'
        required: false
        default: ''
        type: string
      apk_repo_key_url:
        description: '可选：外部 apk 源公钥 URL'
        required: false
        default: ''
        type: string
      wifi_diag:
        description: 'WiFi 诊断模式：给 rtl_ax_ap 驱动注入只读寄存器打点，并打开 CONFIG_DEVMEM + busybox devmem。定位完请关掉'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: pt1570-fit-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: FIT / rtl9617c / PT1570-R10
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        # R10-only。H10 暂缓，禁止在此加入（见文件头与方案文档）。
        board: [r10]

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v5

      # 防呆：任何把第二个机型加回 matrix 的改动都会在这里失败。
      # 只检查 matrix 的 board 行，不搜全文（文件头注释里本来就有 H10 说明）。
      - name: Guard R10-only
        env:
          BOARD: ${{ matrix.board }}
        run: |
          [ "$BOARD" = "r10" ] || {
            echo "ERROR: 当前范围是 R10-only，收到 board=$BOARD" >&2; exit 1; }
          WF="$GITHUB_WORKSPACE/.github/workflows/build-pt1570-fit.yml"
          LINE=$(grep -E '^[[:space:]]*board: \[' "$WF" | tr -d '[:space:]')
          [ "$LINE" = "board:[r10]" ] || {
            echo "ERROR: matrix board 行不是 [r10]：'$LINE'" >&2; exit 1; }
          echo "R10_ONLY_GUARD_OK=True board=$BOARD matrix=$LINE"

      - name: Resolve board parameters
        env:
          BOARD: ${{ matrix.board }}
          DTS_STATUS: ${{ inputs.dts_status }}
        run: |
          case "$BOARD" in
            r10)
              echo "PROFILE=youhua_pt1570_r10"          >> "$GITHUB_ENV"
              echo "BOARD_NAME=youhua,pt1570-r10"       >> "$GITHUB_ENV"
              echo "DTS=rtl9617c-pt1570-r10"            >> "$GITHUB_ENV"
              echo "MODEL=PT1570-R10"                   >> "$GITHUB_ENV"
              ;;
            *) echo "ERROR: R10-only 构建不接受 board=$BOARD（H10 暂缓）" >&2; exit 1 ;;
          esac
          echo "DTS_STATUS=${DTS_STATUS:-experimental}" >> "$GITHUB_ENV"
          echo "board=$BOARD profile=youhua_pt1570_r10 dts=rtl9617c-pt1570-r10 status=${DTS_STATUS:-experimental}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"
          df -h /mnt

      - name: Install build dependencies
        # 沿用已在 ubuntu-24.04 上跑通的 OpenWrt 依赖清单（与 HG5585F-CT 路线 B 相同）。
        # 额外显式装 LLVM 18 三件套：target/linux/rtl9617c/pe/Makefile 硬编码
        # clang-18 / ld.lld-18 / llvm-objcopy-18 来编译 MIPS32 裸机 PE 程序，
        # 不能只依赖通用的 clang / lld / llvm 元包（见下一步 PE 构建）。
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clang-18 cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld lld-18 llvm llvm-18 ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          # tyfza1-pon-control（PON 管控，Rust）由其 Makefile 调 host PATH 上的
          # cargo，交叉编译 --target aarch64-unknown-linux-musl；run #9 报
          # E0463 can't find crate for `core`（the aarch64-unknown-linux-musl
          # target may not be installed）。runner 预装 rustup，为其默认工具链
          # 补齐该目标 std 即可；缺失时给出可读报错而不是让 1 小时后的编译才爆。
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-unknown-linux-musl
            rustup target list --installed
          else
            echo "::error::runner 缺 rustup，无法补 aarch64-unknown-linux-musl std" >&2
            exit 1
          fi

      - name: Clone rtl9617c-openwrt source
        run: |
          set -e
          REF="${{ inputs.source_ref || '20b4cf4490ca55cc406d07e391691efa8cd8a087' }}"
          cd /mnt/build_wrt
          git init -q
          git remote add origin https://github.com/lyq1996/rtl9617c-openwrt.git
          if ! git fetch -q --depth=1 origin "$REF"; then
            echo "WARN: 按 commit 拉取失败，回退到 h10 分支" >&2
            git fetch -q --depth=1 origin feature/pt1500-h10-openwrt-fixes
          fi
          git checkout -q FETCH_HEAD
          echo "SOURCE_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$REF"                   >> "$GITHUB_ENV"
          echo "--- target ---"
          test -f target/linux/rtl9617c/image/Makefile
          test -f target/linux/rtl9617c/dts/rtl9617c-tyfza1.dtsi
          test -f package/utils/fitblk/files/fit.sh
          grep -n 'rootdisk' target/linux/rtl9617c/dts/rtl9617c-tyfza1.dtsi | head -3
          echo "source: $(git rev-parse HEAD)"

      - name: Build PE firmware (pe-tx-code.h)
        working-directory: wrt
        run: |
          set -eo pipefail
          # run #7 (2026-11-10) Compile 失败根因：
          #   drivers/net/wireless/realtek/rtl_ax_ap/Makefile:10:
          #   *** pe-tx-code.h is missing; run "make -C target/linux/rtl9617c/pe". Stop.
          # 该头文件被上游 .gitignore 排除，由 target/linux/rtl9617c/pe/Makefile
          # 用 clang-18 / ld.lld-18 / llvm-objcopy-18 现场编译 MIPS32 裸机 PE
          # 程序后生成，OpenWrt 构建系统不会自动调用。必须在任何 make 之前生成，
          # 这样内核首次展开 files-6.18 时就能带上它（否则 target/linux/compile 必挂）。
          echo "=== PE toolchain ==="
          for t in clang-18 ld.lld-18 llvm-objcopy-18 python3; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::PE 构建缺少工具 $t，请检查 Install build dependencies" >&2
              exit 1
            fi
            printf '  OK   %-20s %s\n' "$t" "$(command -v "$t")"
          done

          if ! make -C target/linux/rtl9617c/pe 2>&1 | tee /tmp/pe-build.log; then
            echo "::group::PE BUILD FAILED - last 60 lines"
            tail -n 60 /tmp/pe-build.log
            echo "::endgroup::"
            echo "::error::make -C target/linux/rtl9617c/pe 失败，pe-tx-code.h 未生成"
            exit 1
          fi
          HDR=target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pe-tx-code.h
          test -s "$HDR" || { echo "::error::pe-tx-code.h 未生成或为空"; exit 1; }
          grep -q 'static const u32 pe_tx_program\[\]' "$HDR" \
            || { echo "::error::pe-tx-code.h 内容不符（缺 pe_tx_program 数组）"; exit 1; }
          echo "PE_HEADER_OK=True bytes=$(wc -c < "$HDR") words=$(grep -c '0x[0-9a-fA-F]' "$HDR")"

      - name: Pin APK signing key (optional)
        working-directory: wrt
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -n "$APK_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
            echo "APK build key pinned:"; sha256sum public-key.pem
          else
            echo "no APK_SIGNING_KEY: ephemeral key; firmware + packages of THIS run trust each other only"
          fi

      - name: Update and install feeds
        working-directory: wrt
        run: |
          LOG="$GITHUB_WORKSPACE/step-feeds.log"
          : > "$LOG"
          # 全量输出同时落盘；失败时 trap 打印尾部并把关键错误写成 annotation，
          # 无需仓库管理员权限即可从 check-runs annotations 读到具体原因。
          exec > >(tee -a "$LOG") 2>&1
          trap '
            rc=$?
            if [ "$rc" -ne 0 ]; then
              sleep 1
              echo "::group::FEEDS STEP FAILED (exit $rc) - last 80 lines"
              tail -n 80 "$LOG"
              echo "::endgroup::"
              last_step=$(grep "^STEP:" "$LOG" | tail -n 1)
              echo "::error::失败前最后进度: ${last_step:-未知}"
              grep -E "fatal:|error:|Error [0-9]|ERROR|No such file|not found|Failed|failed|denied|timed out|refusing" "$LOG" \
                | grep -v "::error::" | tail -n 6 | tr -d "\r" | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "::error::Update and install feeds 失败 (exit $rc)，见上方日志与 build-log artifact"
            fi
          ' EXIT

          echo "STEP: feeds update -a"
          ./scripts/feeds update -a

          # vlmcsd / luci-app-vlmcsd 已于 2026-11-10 从 R10 基线移除（用户确认非必需）。
          # 原因：这两个包只在 immortalwrt feeds，而本源码树 feeds.conf.default 指向
          # 官方 git.openwrt.org。此前用 sparse clone 把包目录注入官方 feed，但
          # `feeds update -a` 生成的 feeds/*.index 在注入之前，`feeds install -a`
          # 依据索引工作，导致 run #4 报 "feeds install 未识别 vlmcsd" 并失败。
          # 现在彻底移除整段注入：少两次大仓库 clone，消除索引时序依赖。
          # 若以后确实要加回：注入后必须先 ./scripts/feeds update -i -a 重建索引，
          # 再 ./scripts/feeds install -a，并重新验证 Configure 的包硬断言。

          echo "STEP: feeds install -a"
          ./scripts/feeds install -a
          echo "STEP: fix feed file permissions"
          # rpcd 会拒绝 world-writable 的 ucode handler；Windows/9p 同步过的 feed 必须收敛权限
          chmod -R go-w feeds/luci feeds/packages 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/ucode/*' -type f -exec chmod 0755 {} + 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/acl.d/*.json' -type f -exec chmod 0644 {} + 2>/dev/null || true

      - name: Apply board support (DTS + Device + sysupgrade whitelist)
        env:
          PT1570_BOARD: ${{ matrix.board }}
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
          DTS_STATUS: ${{ inputs.dts_status }}
        run: bash "$GITHUB_WORKSPACE/scripts/apply-board.sh"

      - name: Apply custom rootfs files
        env:
          PACKAGES_REPO_URL: ${{ inputs.packages_repo_url }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/wrt/files"
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            cp -a "$GITHUB_WORKSPACE/files/." "$GITHUB_WORKSPACE/wrt/files/"
            chmod +x "$GITHUB_WORKSPACE/wrt/files/etc/uci-defaults/"* 2>/dev/null || true
            echo "custom rootfs files injected:"
            find "$GITHUB_WORKSPACE/files" -type f -printf '  %P\n'
          fi
          if [ -n "$PACKAGES_REPO_URL" ]; then
            URL="${PACKAGES_REPO_URL%/}"
            mkdir -p "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d"
            {
              echo '# 本次固件同批编译的 packages 源（由 workflow 注入）'
              echo "$URL/targets/rtl9617c/generic/packages/packages.adb"
            } > "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d/customfeeds.list"
            echo "custom packages repo: $URL/targets/rtl9617c/generic/packages/packages.adb"
          fi

      - name: Patch upstream packages (factory extraction)
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/patch-upstream.sh"

      - name: Patch WiFi driver diagnostics
        if: ${{ inputs.wifi_diag }}
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/patch-wifi-diag.sh"

      - name: Configure
        working-directory: wrt
        env:
          PT1570_BOARD: ${{ matrix.board }}
          ASSETS: ${{ github.workspace }}
          APK_MIRROR_BASE: ${{ inputs.apk_mirror_base }}
          APK_REPO_KEY_URL: ${{ inputs.apk_repo_key_url }}
          WIFI_DIAG: ${{ inputs.wifi_diag }}
        run: |
          set -e
          # ⚠️ 顺序敏感（run #10 根因，2026-11-10）：
          #   绝不能在空 .config 上先跑 make defconfig。上游 target-metadata.pl
          #   把 Target System choice 硬编码为 default TARGET_mediatek，空配置
          #   defconfig 会选中 mediatek/filogic 的默认机型 openwrt_one，把它的
          #   包集合（kmod-mt7915e → 官方 kmod-mac80211/kmod-cfg80211、
          #   wpad-basic-mbedtls、mt7981-wo-firmware、eip197-mini-firmware、
          #   kmod-rtc-pcf8563 等）以及其它所有包的 "# not set" 写成显式用户
          #   选择。切到 rtl9617c 后这些值原样保留：残留的 kmod-mac80211 与
          #   kmod-rtl-ax-ap 自带的 cfg80211.ko/mac80211.ko 安装时互相覆盖
          #   （package/install Error 1），而设备包默认值也救不回显式 n 的包。
          #   正确顺序：先写最小配置（target + 机型 + 包断言），再 defconfig。
          rm -f .config
          cat "$GITHUB_WORKSPACE/Config-PT1570-FIT.txt" >> .config
          # 诊断产物（wifi_diag=true）：CONFIG_DEVMEM + busybox devmem。
          # WiFi 定位完把 wifi_diag 关掉，正式产物不带 /dev/mem。
          if [ "${WIFI_DIAG:-false}" = "true" ]; then
            cat "$GITHUB_WORKSPACE/Config-DIAG.txt" >> .config
            echo "  diag: CONFIG_DEVMEM + busybox devmem"
          fi
          bash "$GITHUB_WORKSPACE/customize.sh"

          # uboot-envtools 的 host fw_printenv 在此 target 会挂，必须保持关闭
          sed -i 's|^CONFIG_PACKAGE_uboot-envtools=y|# CONFIG_PACKAGE_uboot-envtools is not set|' .config

          make defconfig
          cat "$GITHUB_WORKSPACE/Config-PT1570-FIT.txt" >> .config

          # defconfig 会静默丢掉未被 profile 点名的包，照 pt1500-build.sh 跑两次并断言
          make defconfig
          for sym in tyfza1-pon-control luci-ssl uhttpd fitblk; do
            if ! grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${sym} is not set$/d; /^CONFIG_PACKAGE_${sym}=/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
              echo "  re-asserted $sym"
            fi
          done
          make defconfig

          # 用户软件包基线（Config-EXTRA.txt，tailscale 三件套；vlmcsd 已按用户
          # 要求从 R10 移除）：customize.sh 已在前面追加，但两次 make defconfig
          # 可能把未被 profile 点名的包降级/丢弃；这里统一重新断言一次再检查。
          echo "===== user-requested packages (tailscale baseline) ====="
          USER_PKGS="tailscale luci-app-tailscale-community \
                     luci-i18n-tailscale-community-zh-cn"
          for p in $USER_PKGS; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${p} is not set$/d; /^CONFIG_PACKAGE_${p}=/d" .config
              echo "CONFIG_PACKAGE_${p}=y" >> .config
              echo "  re-asserted $p"
            fi
          done
          make defconfig
          for p in $USER_PKGS; do
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config \
              || { echo "ERROR: $p 未启用（feed 里找不到该包，或依赖不满足被降级）" >&2; exit 1; }
            echo "  OK   $p"
          done

          echo "===== hard assertions ====="
          grep -q "^CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y$" .config \
            || { echo "ERROR: profile $PROFILE 未启用" >&2; exit 1; }
          for sym in tyfza1-pon-control luci-ssl uhttpd fitblk; do
            grep -q "^CONFIG_PACKAGE_${sym}=y$" .config \
              || { echo "ERROR: $sym 二次 defconfig 后仍被丢弃" >&2; exit 1; }
            echo "  OK   $sym"
          done
          grep -q '^# CONFIG_PACKAGE_uboot-envtools is not set$' .config \
            || { echo "ERROR: uboot-envtools 必须关闭" >&2; exit 1; }
          echo "  OK   uboot-envtools disabled"

          # 诊断产物 vs 正式产物：/dev/mem 只能出现在 wifi_diag=true 的镜像里
          if [ "${WIFI_DIAG:-false}" = "true" ]; then
            grep -q '^CONFIG_DEVMEM=y$' .config \
              || { echo "ERROR: wifi_diag=true 但 CONFIG_DEVMEM 未启用" >&2; exit 1; }
            grep -q 'rtl_ax_diag_dump' \
              target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pci.c \
              || { echo "ERROR: wifi_diag=true 但驱动打点未注入" >&2; exit 1; }
            echo "  OK   wifi diag (CONFIG_DEVMEM + diag dump)"
          else
            ! grep -q '^CONFIG_DEVMEM=y$' .config \
              || { echo "ERROR: 正式产物不允许 CONFIG_DEVMEM" >&2; exit 1; }
            echo "  OK   CONFIG_DEVMEM off"
          fi

          # 默认 WAN = pon0（上游 90-tyfza1-pon-wan 会绑到 pon0.<wan_vlan>）
          test -x files/etc/uci-defaults/95-pt1570-wan-default \
            || { echo "ERROR: 缺少默认 WAN(pon0) 的 uci-defaults 脚本或其可执行位丢失" >&2; exit 1; }
          grep -q "network.wan.device='pon0'" files/etc/uci-defaults/95-pt1570-wan-default \
            || { echo "ERROR: 95-pt1570-wan-default 未把 wan.device 写回 pon0" >&2; exit 1; }
          echo "  OK   default WAN -> pon0"
          grep -q "SUPPORTED_DEVICES += ${BOARD_NAME}" target/linux/rtl9617c/image/Makefile \
            || { echo "ERROR: image/Makefile 缺少 SUPPORTED_DEVICES" >&2; exit 1; }
          grep -q "$BOARD_NAME" target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: platform.sh 白名单缺少 $BOARD_NAME" >&2; exit 1; }
          test -f "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: DTS 缺失" >&2; exit 1; }
          echo "  OK   DTS=$DTS board_name=$BOARD_NAME"

          echo "===== R10 config sanity（run #10 修复的防回归断言）====="
          # 空配置 defconfig 会把 mediatek/filogic/openwrt_one 的包集写成显式
          # =y（污染源），并把设备包写成显式 n（压死 DEVICE_PACKAGES 默认值）。
          # 这里正反双向断言，任何一条失败都说明 Configure 的顺序被改坏了。
          for bad in kmod-mac80211 kmod-cfg80211 kmod-mt7915e kmod-mt76-core \
                     wpad-basic-mbedtls mt7981-wo-firmware eip197-mini-firmware \
                     airoha-en8811h-firmware kmod-phy-airoha-en8811h kmod-rtc-pcf8563; do
            if grep -qE "^CONFIG_PACKAGE_${bad}=(y|m)$" .config; then
              echo "ERROR: 检测到污染包 ${bad}（默认 target 的包残留），检查 Configure 步骤的 .config 初始化顺序" >&2
              exit 1
            fi
          done
          echo "  OK   无 mediatek/openwrt_one 残留包"
          for good in kmod-fs-ext4 kmod-fs-vfat kmod-nls-utf8 kmod-usb-storage \
                      kmod-usb-storage-uas wpad-mbedtls; do
            grep -q "^CONFIG_PACKAGE_${good}=y$" .config \
              || { echo "ERROR: 设备包 ${good} 未启用（被显式 n 压住）" >&2; exit 1; }
            echo "  OK   ${good}"
          done

          if [ "${DTS_STATUS:-experimental}" = "verified" ]; then
            ! grep -q 'UNVERIFIED' "target/linux/rtl9617c/dts/${DTS}.dts" \
              || { echo "ERROR: dts_status=verified 但 DTS 仍带 UNVERIFIED 标记" >&2; exit 1; }
            echo "  OK   DTS marked verified"
          else
            echo "  WARN DTS=experimental，产物禁止刷机 / 禁止发布 Release"
          fi

          echo "===== key config ====="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)=' .config || true
          echo "  =m packages: $(grep -c '^CONFIG_PACKAGE_.*=m$' .config || true)"
          echo "--- files/etc/apk/repositories.d/distfeeds.list ---"
          cat files/etc/apk/repositories.d/distfeeds.list
          cp .config "$GITHUB_WORKSPACE/Config-final.txt"

      - name: Run static preflight
        if: ${{ inputs.test_only }}
        env:
          PT1570_BOARD: ${{ matrix.board }}
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/preflight.sh"

      - name: Upload config (test_only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: pt1570-${{ matrix.board }}-config-${{ github.run_number }}
          path: Config-final.txt
          retention-days: 14

      - name: Download sources
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          make package/base-files/clean >/dev/null 2>&1 || true
          make download -j"$(nproc)"

      - name: Compile
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          if make -j"$(nproc)" 2>&1 | tee -a "$LOG"; then
            echo "PARALLEL_BUILD_OK=True"
          else
            echo "::warning::并行编译失败，改用 -j1 V=s 重试并显示详细日志"
            if make -j1 V=s 2>&1 | tee -a "$LOG"; then
              echo "SERIAL_BUILD_OK=True"
            else
              echo "::group::BUILD FAILED - last 120 lines"
              tail -n 120 "$LOG"
              echo "::endgroup::"
              # 把关键错误行写成 annotation：匿名也能通过 check-runs annotations 读到，
              # 不必依赖需要管理员权限的日志下载接口。每个 step 最多 10 条，取最后 8 条。
              grep -E 'Error [0-9]|^make(\[[0-9]+\])?: \*\*\*|error:|No such file|not found|No space left|Killed|undefined reference|FATAL|FAIL' "$LOG" \
                | tail -n 8 | tr -d '\r' | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "BUILD_FAILED=True" >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Verify image payload (wifi firmware + patched factory)
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        env:
          ASSETS: ${{ github.workspace }}
        run: |
          set -e
          ROOT=$(ls -d build_dir/target-*/root-rtl9617c* 2>/dev/null | head -1)
          [ -n "$ROOT" ] || { echo "::error::找不到 rootfs 目录 build_dir/target-*/root-rtl9617c*"; exit 1; }
          echo "rootfs dir: $ROOT"

          # 上游没有任何包安装 WiFi AP 固件，必须由 files/ overlay 带进镜像
          missing=0
          for f in "$ASSETS"/files/lib/firmware/realtek/tyfza1/*.bin; do
            base=${f##*/}
            tgt="$ROOT/lib/firmware/realtek/tyfza1/$base"
            if [ ! -f "$tgt" ]; then
              echo "::error::镜像缺少 WiFi 固件 $base"; missing=1; continue
            fi
            if ! cmp -s "$f" "$tgt"; then
              echo "::error::镜像内 $base 与资产不一致"; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          n=$(ls -1 "$ROOT"/lib/firmware/realtek/tyfza1/*.bin 2>/dev/null | wc -l)
          [ "$n" = 7 ] || { echo "::error::镜像内 WiFi 固件数量 $n != 7"; exit 1; }
          echo "WIFI_FIRMWARE_OK=True files=$n"

          # 校验打包的是修补后的 factory 提取脚本，且校准软链接存在（目标在 /tmp，属于正常）
          grep -q 'mv "\$tmp" "\$3"' "$ROOT/etc/init.d/tyfza1-factory" \
            || { echo "::error::镜像里的 tyfza1-factory 未应用 factory_blob 修补"; exit 1; }
          echo "FACTORY_PATCH_OK=True"

          # 默认 WAN=pon0：uci-defaults 必须进镜像并带可执行位
          [ -f "$ROOT/etc/uci-defaults/95-pt1570-wan-default" ] \
            || { echo "::error::镜像缺少 95-pt1570-wan-default（默认 WAN 仍是 pon0.3961）"; exit 1; }
          [ -x "$ROOT/etc/uci-defaults/95-pt1570-wan-default" ] \
            || { echo "::error::95-pt1570-wan-default 丢了可执行位，rc 不会执行它"; exit 1; }
          echo "WAN_DEFAULT_OK=True"
          for l in \
            lib/firmware/realtek/tyfza1/rtl8852ce/flash-calibration.bin \
            lib/firmware/realtek/tyfza1/rtl8192xbe/flash-calibration.bin \
            lib/firmware/realtek/rtl9617c/bosa-calibration.bin \
            lib/firmware/realtek/rtl9617c/a2h.bin; do
            [ -L "$ROOT/$l" ] || echo "::warning::缺少校准软链接 $l"
          done
          echo "IMAGE_PAYLOAD_OK=True"

      - name: Upload build log (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: pt1570-${{ matrix.board }}-build-log-${{ github.run_number }}
          path: |
            build.log
            step-feeds.log
          if-no-files-found: warn
          retention-days: 30

      - name: Refresh package index
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          make package/index
          find bin/targets/rtl9617c/generic/packages bin/packages \
            -name packages.adb -printf '%p %s bytes\n' 2>/dev/null | sort || true

      - name: Collect firmware + matching packages
        if: ${{ !inputs.test_only }}
        env:
          PUBLISH_PACKAGES: ${{ inputs.publish_packages }}
          DTS_STATUS: ${{ inputs.dts_status }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/wrt"
          echo "===== bin/targets/rtl9617c/generic ====="
          ls -lh bin/targets/rtl9617c/generic/ | head -40

          find bin/targets/rtl9617c/generic -maxdepth 1 -type f \
            -name "*${PROFILE}*" ! -name "*.json" \
            -exec cp -v {} "$OUT/" \;

          ls "$OUT/"*sysupgrade.itb >/dev/null 2>&1 || {
            echo "ERROR: 没有产出 ${PROFILE} 的 sysupgrade.itb" >&2; exit 1; }

          cp .config "$OUT/Config-final.txt"
          echo "$SOURCE_HASH" > "$OUT/source-commit.txt"
          {
            echo "board=$MODEL ($BOARD_NAME)"
            echo "profile=$PROFILE"
            echo "dts=$DTS"
            echo "dts_status=${DTS_STATUS:-experimental}"
            echo "source_ref=$SOURCE_REF"
            echo "source_commit=$SOURCE_HASH"
            echo "abi=ubi_device / factory(8MiB,static) / fit / rootfs_data"
            echo "firmware=sysupgrade.itb (FIT external-static-with-rootfs)"
            echo "bootloader=lyq1996/rtl9617c-uboot@refactor 2026.07-g9abafc0572b2 (pt1500-h10-2p5g_defconfig)"
            echo "bootloader_fit_abi=yes (firmware_volume=fit, overlay_volume=rootfs_data, factory=8MiB static)"
            echo "bootcmd_default=bootmenu -> menu_0 rtk_boot / menu_1 rtk_recovery"
          } > "$OUT/BUILD_INFO.txt"

          if [ "${DTS_STATUS:-experimental}" != "verified" ]; then
            {
              echo "DO NOT FLASH THIS IMAGE."
              echo "The R10 DTS was statically ported from the real device FDT"
              echo "(4xGE LAN, 12 LEDs, 3 buttons verified), but the resulting"
              echo "firmware has NEVER been booted on a PT1570-R10. Web Failsafe"
              echo "network reachability on this 4xGE board is also untested."
              echo "Use it only to validate the build pipeline. Complete the"
              echo "hardware checklist in the migration guide, remove the"
              echo "UNVERIFIED marker, then rerun with dts_status=verified."
            } > "$OUT/DO-NOT-FLASH-EXPERIMENTAL.txt"
          fi

          case "$PUBLISH_PACKAGES" in
            false) DO_PACKAGES=0 ;;
            *)     DO_PACKAGES=1 ;;
          esac
          if [ "$DO_PACKAGES" = "1" ]; then
            ROOT="$GITHUB_WORKSPACE/pkgroot"
            rm -rf "$ROOT"
            mkdir -p "$ROOT/targets/rtl9617c/generic/packages" "$ROOT/packages"
            cp -a bin/targets/rtl9617c/generic/packages/. \
                  "$ROOT/targets/rtl9617c/generic/packages/" 2>/dev/null || true
            if [ -d bin/packages ]; then cp -a bin/packages/. "$ROOT/packages/"; fi

            KMOD_N=$(find "$ROOT" -type f -name 'kmod-*.apk' | wc -l)
            APK_N=$(find "$ROOT" -type f -name '*.apk' | wc -l)
            IDX_N=$(find "$ROOT" -type f -name 'packages.adb' | wc -l)
            echo "===== matching packages: kmod=$KMOD_N apk=$APK_N index=$IDX_N ====="
            test "$KMOD_N" -gt 0 || { echo "ERROR: 没有 kmod-*.apk" >&2; exit 1; }
            test "$APK_N"  -gt 0 || { echo "ERROR: 没有 .apk" >&2; exit 1; }
            test "$IDX_N"  -gt 0 || { echo "ERROR: 没有 packages.adb" >&2; exit 1; }

            if [ -f public-key.pem ]; then
              cp public-key.pem "$ROOT/public-key.pem"
            else
              echo "WARN: public-key.pem 缺失，跨批次装包需自行导公钥" >&2
            fi
            {
              echo "# 同批 packages（源码 $SOURCE_REF @ $SOURCE_HASH，架构 aarch64_cortex-a55）"
              echo "# 解包到静态站点根 BASE 后按需写入 /etc/apk/repositories.d/customfeeds.list"
              echo "BASE/targets/rtl9617c/generic/packages/packages.adb"
              find "$ROOT/packages" -name packages.adb -printf '%P\n' 2>/dev/null \
                | sort | sed 's|^|BASE/packages/|' || true
            } > "$ROOT/apk-repos.txt"
            {
              echo "source_ref=$SOURCE_REF"
              echo "source_commit=$SOURCE_HASH"
              echo "target=rtl9617c/generic"
              echo "profile=$PROFILE"
              echo "arch_packages=aarch64_cortex-a55"
              echo "linux=$(grep -m1 '^CONFIG_LINUX_VERSION=' .config || echo unknown)"
              echo "kmods=$KMOD_N apks=$APK_N indexes=$IDX_N"
            } > "$ROOT/BUILD_INFO.txt"

            cd "$GITHUB_WORKSPACE"
            tar --zstd -cf "artifact/packages-${{ matrix.board }}-${{ github.run_number }}.tar.zst" \
                -C "$ROOT" .
            ls -lh "artifact/packages-${{ matrix.board }}-${{ github.run_number }}.tar.zst"
          fi

          cd "$OUT"
          find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%f\n' \
            | sort | xargs sha256sum > sha256sums.txt
          echo "===== artifact ====="
          ls -lh

      - name: Upload firmware
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: pt1570-${{ matrix.board }}-fit-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ !inputs.test_only && inputs.create_release && inputs.dts_status == 'verified' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pt1570-${{ matrix.board }}-fit-${{ github.run_number }}
          name: PonWRT PT1570-${{ matrix.board }} FIT (${{ github.run_number }})
          files: artifact/*
          body: |
            源码 lyq1996/rtl9617c-openwrt `${{ env.SOURCE_REF }}` @ `${{ env.SOURCE_HASH }}`
            机型 ${{ env.MODEL }} / profile `${{ env.PROFILE }}` / DTS `${{ env.DTS }}`
            ABI：factory(8 MiB static) + fit + rootfs_data，产物 sysupgrade.itb
            配置见 Config-final.txt；校验见 sha256sums.txt
            同批 packages 见 `packages-*.tar.zst`，用法见包内 apk-repos.txt / BUILD_INFO.txt。
            ⚠️ 刷机前必须已完成 U-Boot FIT ABI 确认、factory 导入与卷表重建，详见方案文档。
            ⚠️ 本仓库当前为 R10-only 范围，产物仅适用于 PT1570-R10。
