# ============================================================================
# 统一 Youhua U-Boot 编译 workflow（PT1570-H10-CU-2P5G / PT1570-R10-CU-4GE）
# ============================================================================
# 对齐上游 lyq1996/rtl9617c-uboot@ad056996（2026-11-22 命名对齐）：
#   * 板级源码（board/ + dts + defconfig + board json）全部来自上游，本地不再
#     保存任何重复的板级源码；stock 摘要直接读上游 board json 的 stock_sha256。
#   * 本地 uboot/ 只保留设备专用原厂 stock 与两份灯表静态护栏：
#       uboot/stocks/<board>/stock-mtd0.bin.b64
#       uboot/tools/{verify_cu_leds,verify_r10_leds}.py
#   * board=both 时一次 dispatch 并行构建两块板（二选二），每板独立
#     artifact / release tag；旧板名 youhua-pt1570-r10 自动映射到新名。
#
# 关键不变量：
#   * stock 为每机唯一的 2 MiB 原厂 mtd0 备份（GPT/BL2/BL31），不可共享。
#   * 上游 pack_boot.py 原样保留 GPT/BL2/BL31，只替换 BL33；本 workflow
#     在 pack 后独立复核 payload provenance。
#   * factory 分区 64 KiB（上游 defconfig），与当前 OpenWrt 布局一致。
# ============================================================================
name: Youhua U-Boot (CU / R10)

on:
  workflow_dispatch:
    inputs:
      board:
        description: '目标板级；both = 两块板同时构建（二选二）'
        required: true
        type: choice
        options:
          - both
          - youhua-pt1570-h10-cu-2p5g
          - youhua-pt1570-r10-cu-4ge
        default: both
      uboot_ref:
        description: 'lyq1996/rtl9617c-uboot ref（默认锁定命名对齐后的 HEAD）'
        required: false
        default: 'ad056996854cfd7ea009f6a0d05a0f86f045b800'
      test_only:
        description: '只做注入与静态校验，不编译 BL33'
        required: false
        type: boolean
        default: false
      create_release:
        description: '编译成功后创建 Release 附上 boot 镜像'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  select:
    name: Select boards
    runs-on: ubuntu-22.04
    outputs:
      boards: ${{ steps.pick.outputs.boards }}
    steps:
      - name: Resolve board list
        id: pick
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
        run: |
          set -euo pipefail
          case "$BOARD" in
            both)
              BOARDS='["youhua-pt1570-h10-cu-2p5g","youhua-pt1570-r10-cu-4ge"]'
              ;;
            youhua-pt1570-r10)
              BOARDS='["youhua-pt1570-r10-cu-4ge"]'
              ;;
            youhua-pt1570-h10-cu-2p5g|youhua-pt1570-r10-cu-4ge)
              BOARDS=$(printf '["%s"]' "$BOARD")
              ;;
            *)
              echo "::error::未知板级 $BOARD"; exit 1
              ;;
          esac
          echo "boards=$BOARDS" >> "$GITHUB_OUTPUT"
          echo "  selected: $BOARDS"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.select.outputs.boards) }}
    name: ${{ matrix.board }} / build
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BOARD: ${{ matrix.board }}
    concurrency:
      group: youhua-uboot-${{ matrix.board }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout assets
        uses: actions/checkout@v4

      # ---- 上游源码：只 clone 固定 SHA，不覆盖任何板级文件 ----
      - name: Clone upstream U-Boot (pinned SHA)
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.uboot_ref || 'ad056996854cfd7ea009f6a0d05a0f86f045b800' }}"
          U="$RUNNER_TEMP/uboot"
          git init -q "$U"
          git -C "$U" remote add origin https://github.com/lyq1996/rtl9617c-uboot.git
          if ! git -C "$U" fetch -q --depth=1 origin "$REF"; then
            echo "ERROR: 按 uboot_ref 拉取失败（不接受漂移的 main）" >&2
            exit 1
          fi
          git -C "$U" checkout -q FETCH_HEAD
          echo "UBOOT_DIR=$U" >> "$GITHUB_ENV"
          echo "  HEAD = $(git -C "$U" rev-parse HEAD)"

      # ---- 板级 profile：stock 摘要来自上游 board json，灯表/标签按板映射 ----
      - name: Resolve board profile
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          J="$U/tools/release/boards/$BOARD.json"
          [ -f "$J" ] || { echo "::error::上游缺 $J（ref 不兼容？）"; exit 1; }
          STOCK_SHA256=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["stock_sha256"])' "$J")
          STOCK_B64="uboot/stocks/$BOARD/stock-mtd0.bin.b64"
          case "$BOARD" in
            youhua-pt1570-h10-cu-2p5g)
              LAMP_DESC=board/youhua/pt1570-h10-cu/desc-2p5g.c
              LAMP_GUARD=uboot/tools/verify_cu_leds.py
              TAG_BASE=PT1570-H10-2P5G-CU-uboot
              ;;
            youhua-pt1570-r10-cu-4ge)
              LAMP_DESC=board/youhua/pt1570-r10-cu/desc-4ge.c
              LAMP_GUARD=uboot/tools/verify_r10_leds.py
              TAG_BASE=PT1570-R10-4GE-CU-uboot
              ;;
            *)
              echo "::error::未知板级 $BOARD"; exit 1
              ;;
          esac
          [ -f "$GITHUB_WORKSPACE/$STOCK_B64" ] \
            || { echo "::error::缺 stock 资产 $STOCK_B64"; exit 1; }
          [ -f "$GITHUB_WORKSPACE/$LAMP_GUARD" ] \
            || { echo "::error::缺灯表护栏 $LAMP_GUARD"; exit 1; }
          echo "STOCK_SHA256=$STOCK_SHA256" >> "$GITHUB_ENV"
          echo "STOCK_B64=$STOCK_B64" >> "$GITHUB_ENV"
          echo "LAMP_DESC=$LAMP_DESC" >> "$GITHUB_ENV"
          echo "LAMP_GUARD=$LAMP_GUARD" >> "$GITHUB_ENV"
          echo "TAG_BASE=$TAG_BASE" >> "$GITHUB_ENV"
          echo "  BOARD=$BOARD  STOCK=$STOCK_B64  SHA=$STOCK_SHA256  TAG=$TAG_BASE"

      # ---- stock 资产：base64 解码 + 尺寸/摘要/GPT/FIP 结构校验 ----
      - name: Decode and verify device stock
        shell: bash
        run: |
          set -euo pipefail
          B64="$GITHUB_WORKSPACE/$STOCK_B64"
          mkdir -p "$RUNNER_TEMP/stock"
          base64 -d "$B64" > "$RUNNER_TEMP/stock/stock-mtd0.bin"
          STK="$RUNNER_TEMP/stock/stock-mtd0.bin"
          SZ=$(stat -c%s "$STK")
          [ "$SZ" = 2097152 ] || { echo "::error::stock 不是 2 MiB，实为 $SZ"; exit 1; }
          SHA=$(sha256sum "$STK" | cut -d' ' -f1)
          [ "$SHA" = "$STOCK_SHA256" ] \
            || { echo "::error::stock sha256 不符：$SHA != $STOCK_SHA256"; exit 1; }
          python3 - "$STK" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          assert d[0x200:0x208] == b'EFI PART', 'GPT 头不对'
          assert d[0x40000:0x40008].hex() == '010064aa78563412', '主 FIP ToC magic 不对'
          assert d[0x100000:0x100008].hex() == '010064aa78563412', '备 FIP ToC magic 不对'
          print('  OK   stock: 2 MiB + GPT + 双 FIP 槽')
          PY
          echo "  OK   $BOARD stock sha256=$SHA（与上游 board json 一致）"

      - name: Install build dependencies
        if: ${{ !inputs.test_only }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc make bc bison flex swig device-tree-compiler \
            xz-utils gzip openssl libssl-dev \
            python3 python3-pip python3-yaml cpio file
          # Ubuntu 22.04 自带 cryptography 3.4.8 缺
          # x509.Certificate.signature_algorithm_parameters，上游 pack_boot.py
          # 的 check_sig() verify 阶段会抛 AttributeError；升到 >=42 让上游
          # verify 完整跑通（不改上游代码）。
          python3 -m pip install --user --upgrade 'cryptography>=42'
          python3 -c 'import cryptography; from cryptography import x509; assert int(cryptography.__version__.split(".")[0])>=42; assert hasattr(x509.Certificate,"signature_algorithm_parameters"); print("  OK   cryptography",cryptography.__version__)'
          echo "  OK   toolchain: $(aarch64-linux-gnu-gcc --version | head -1)"

      # ---- 上游板级完整性 + 灯表护栏（只读校验，不覆盖）----
      - name: Verify upstream board and lamp guard
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          for f in build.sh tools/release/pack_boot.py tools/release/build_bl33.sh \
                   tools/release/boards/$BOARD.json \
                   configs/${BOARD}_defconfig \
                   rtl9617c-$BOARD.dts \
                   "$LAMP_DESC" \
                   tools/release/tf-a/tools/fiptool/Makefile \
                   tools/release/tf-a/tools/cert_create/Makefile; do
            case "$f" in
              rtl9617c-*) P="$U/arch/arm/dts/$f" ;;
              *) P="$U/$f" ;;
            esac
            [ -f "$P" ] || { echo "::error::上游缺 $P（ref 不兼容？）"; exit 1; }
          done
          grep -q 'CONFIG_RTK_FACTORY_SIZE=0x10000' "$U/configs/${BOARD}_defconfig" \
            || { echo "::error::$BOARD defconfig 的 factory 卷不是 64 KiB"; exit 1; }
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["board"]==sys.argv[2]; assert "nt_fw" in d["fip_uuids"]; print("  OK   board json:",d["board_id"])' \
            "$U/tools/release/boards/$BOARD.json" "$BOARD"
          python3 "$GITHUB_WORKSPACE/$LAMP_GUARD" "$U/$LAMP_DESC"
          echo "  OK   上游板级齐全 + 灯表护栏通过（$LAMP_GUARD）"

      - name: Inject device stock
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          mkdir -p "$U/tools/release/stocks/$BOARD"
          cp "$RUNNER_TEMP/stock/stock-mtd0.bin" \
             "$U/tools/release/stocks/$BOARD/stock-mtd0.bin"
          echo "  OK   stock 注入 $U/tools/release/stocks/$BOARD/"

      - name: Static dry-run (test_only)
        if: ${{ inputs.test_only }}
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          bash -n "$U/build.sh"
          bash -n "$U/tools/release/build_bl33.sh"
          python3 -m py_compile "$U/tools/release/pack_boot.py" \
                                "$GITHUB_WORKSPACE/$LAMP_GUARD"
          echo "  TEST_ONLY_OK=True（未编译 BL33，board=$BOARD）"

      # ---- 通用构建：BL33 + pack + 上游 verify ----
      - name: Build BL33 and signed boot image
        if: ${{ !inputs.test_only }}
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          cd "$U"
          ./build.sh "$BOARD" bl33
          BL33="$U/output/$BOARD/bl33.bin"
          [ -s "$BL33" ] || { echo "::error::bl33.bin 未生成"; exit 1; }
          BUDGET=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bl33_budget"])' \
            "$U/tools/release/boards/$BOARD.json")
          SZ=$(stat -c%s "$BL33")
          [ "$SZ" -le "$BUDGET" ] \
            || { echo "::error::bl33.bin $SZ B 超过预算 $BUDGET B"; exit 1; }
          echo "  OK   bl33.bin $SZ B <= budget $BUDGET B"
          ./build.sh "$BOARD" pack
          # 上游 verify 的 layout/GPT/BL2/BL31/双 FIP ToC 检查都要跑；
          # ROTPK 未部署时的证书自签名检查依赖 cryptography>=42（已装）。
          ./build.sh "$BOARD" verify
          echo "  OK   上游 pack/verify 通过"

      # ---- 通用 provenance：GPT/BL2/BL31 与 stock 逐字节一致，只换 BL33 ----
      - name: Verify stock provenance
        if: ${{ !inputs.test_only }}
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          BOARD_NAME="$BOARD"
          python3 - "$U" "$BOARD_NAME" <<'PY'
          import pathlib, sys
          U = pathlib.Path(sys.argv[1]); board_name = sys.argv[2]
          sys.path.insert(0, str(U / 'tools/release'))
          import pack_boot as pb
          cfg = pb.load_board(U / 'tools/release/boards', board_name)
          board = pb.Board(cfg)
          stock = (U / f'tools/release/stocks/{board_name}/stock-mtd0.bin').read_bytes()
          image = (U / f'output/{board_name}/{board_name}.boot.bin').read_bytes()
          si, im = pb.Image(board, stock), pb.Image(board, image)
          for role in ('tb_fw', 'soc_fw'):
              assert im.payload(board, role) == si.payload(board, role), role + ' changed'
              print(f'  PINNED {role}: {len(im.payload(board, role))} B')
          assert im.data[:board.fip_offsets[0]] == si.data[:board.fip_offsets[0]], 'GPT changed'
          assert len(image) == len(stock) == board.boot_size, 'boot size changed'
          assert im.entries == board.parse_fip(
              im.data[board.fip_offsets[1]:board.fip_offsets[1] + board.fip_size]), \
              'backup FIP slot mismatch'
          print('  OK   GPT/BL2/BL31 pinned, BL33 replaced, dual FIP slots consistent')
          print('  image sha256', pb.sha256(image))
          PY

      - name: Collect artifacts
        if: ${{ !inputs.test_only }}
        shell: bash
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/uboot"
          O="$GITHUB_WORKSPACE/output-youhua-uboot"
          mkdir -p "$O"
          cp "$U/output/$BOARD/$BOARD.boot.bin"        "$O/${BOARD}-boot.bin"
          cp "$U/output/$BOARD/$BOARD.fip.bin"         "$O/${BOARD}-fip.bin"
          cp "$U/output/$BOARD/$BOARD.manifest.json"   "$O/${BOARD}-manifest.json"
          cp "$U/output/$BOARD/build.log"              "$O/${BOARD}-build.log" 2>/dev/null || true
          ( cd "$O" && sha256sum ./* > SHA256SUMS )
          cat "$O/SHA256SUMS"
          echo "  1) boot.bin = 2 MiB，写 mtd0（boot 分区）"
          echo "  2) fip.bin  = 0xC0000，BL2 Xmodem 'F' 串口救砖用"
          echo "  3) 首次启动按住 RESET 进 Web 恢复页（192.168.0.1 / DHCP）"

      - name: Upload artifacts
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-uboot-${{ github.run_number }}
          path: output-youhua-uboot/
          if-no-files-found: error
          retention-days: 90

      - name: Create release
        if: ${{ !inputs.test_only && inputs.create_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$TAG_BASE-${{ github.run_number }}"
          gh release create "$TAG" output-youhua-uboot/* \
            --title "$TAG" \
            --notes 'PT1570-R10/H10 无 FPGA 负担，factory 分区按上游调整为 64K，需要重建 UBI；如无必要请勿更新。stock 为设备专用备份，请确认型号后再刷。'
