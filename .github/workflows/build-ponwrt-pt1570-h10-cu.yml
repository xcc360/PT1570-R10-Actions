# PonWRT / PT1570-H10-CU 联通版（youhua,pt1570-h10-cu）/ 统一 UBI 方案云编译
#
# 与 PT1500-H10 电信版 2.5G 的关键差异（2026-11-14 联通机实机只读采集）：
#   * 1x2.5GE + 3xGE LAN + 双 PCIe WiFi6（10ec:c852 / 10ec:0192，
#     rtk_wifi6 + cfg80211；外置 RTL8221B，XGE_PORT_BIT_MAP=0x40），
#     必须带 R10 那套 AP 驱动 / 固件 / RFE54 参数表 / 无线配置；
#     DORMANT 资产里「H10 无 WiFi」的判断只对 PT1500-H10 2.5G 成立，已推翻。
#   * DTS 基于上游 rtl9617c-tyfza1-2p5g.dts：它才有 &ni0/&mdio 的
#     外置 2.5G PHY 覆盖；4ge 是空壳，用了 2.5G 口不 link。但 2p5g 是
#     电信板定义，LED GPIO 与 2.5G PHY 地址都与联通机不符，CU DTS 里逐项覆盖。
#   * 上游没有 CU profile / DTS / sysupgrade 白名单，由
#     cu-h10/fw/scripts/apply-board-h10-cu.sh 编译期注入。
#   * 默认 LAN 192.168.1.1/24（三机型统一；显式带掩码，避免命令行改地址
#     丢掩码后 dnsmasq 不分配 IPv4 的坑。旧 192.168.18.1 / 192.168.2.1
#     由首启脚本自动迁移过来）。
#
# 一次性修掉 PT1570-H10-CU / PT1570-R10 实践里踩过的全部坑：
#   1. PON FE offload=0 → PPPoE PADS 后单播上行被静默丢弃、LCP 无回应
#      （95-pt1570-h10-cu-wan-default 打开 offload + flow_offloading_hw）；
#   2. wan_vlan=3961 / pon0.3961 残留 → 对齐 XGPON 线路 VLAN 1101；
#   3. 底层 VLAN 口 MTU 1492 → 强制 1500；
#   4. LAN 掩码丢失 /32 → DHCPv4 完全不响应 → 显式 /24；
#   5. 上游 pt1500-fip.sh 覆盖 platform.sh 并写不存在的 fip 卷 → 编译期删除；
#   6. tyfza1-factory 的 factory_blob 目标参数 $2/$3 → 修好校准软链接；
#   7. uboot-envtools 在此 target 的 host fw_printenv 会挂 → 强制关闭；
#   8. apk 源 aarch64_cortex-a55 不存在 → 用 a53 目录 + 公钥 + 91 首启脚本；
#   9. argon rpcd 插件 / 中文 LuCI / fitblk sysupgrade 修复（zz 脚本）；
#  10. DTS 不加 /chosen 的 root= 覆盖块（R10 run15~run22 刷入态起不来的根因）；
#  11. 2p5g 基线而非 4GE 空壳（联通机 1x2.5GE + 3xGE 实机确认）；
#  12. 2.5G 口补齐进 LAN 桥：board.d/02_network 默认只加 lan1..lan4，
#      且 97-pt1500-lan5 只认 youhua,pt1500-h10 compatible，对 CU 不生效。
#  13. 刷入态黑砖（2026-11-14 真机定位）：上游 dtsi 给 ubi_device 标了
#      read-only，110-spinand-readonly.patch 据此清掉 MTD_WRITEABLE，内核
#      "ubi0: MTD device 4 is write-protected, attach in read-only mode"；
#      rootfs_data 整卷 0xFF 无法格式化成 ubifs，mount_root 建不出 overlay。
#      initramfs 的 rootfs 在内存里、不依赖 overlay，所以「内存启动能拨号、
#      刷入就黑砖」。CU DTS 用 &qspi 覆盖块只放开这一个分区（R10 run20 同款）。
#  14. 无 WiFi（2026-11-14 真机 initramfs 复现）：上游 20b4cf4 的 rtl_ax_ap
#      PE 引擎是 PT1570 实测坏掉并 revert 的 IRAM/物理 CP3 方案，两张 WiFi6
#      卡都等不到 PEWD mailbox -> -ETIMEDOUT -> probe -110。编译期用
#      cu-h10/fw/scripts/overlay-wifi-driver.sh 整套替换成已验证的单 PE1
#      引擎版（60 文件，含 pe-tx-code.h 4076 words）。首版只带了 PE 固件构建
#      和 51 个 WiFi 固件/RFE54 参数表，漏了驱动 overlay。
#  15. 固件态面板灯（2026-11-15 第二版 sysupgrade 实机反馈）：上游 2p5g 用
#      电信板高号 GPIO 70/71/139/140，联通机电源灯是 gpio0 11 高有效、
#      网口灯是 gpio0 0/1/3/4 低有效 —— 不覆盖则「电源灯始终不亮、网口灯
#      错位」。CU DTS 按原厂 mtd4 内嵌 DTB 的 rtk_gpio_led 逐脚覆盖回低号表，
#      与实机确认的 U-Boot run#5 灯表同源；98-pt1570-h10-cu-leds 负责校正
#      sysupgrade 保留旧 /etc/config/system 时的 netdev 绑定 + 电源灯兜底。
#  16. 2.5G 口 / 网口4 不可用（同上）：上游 2p5g 在 MDIO addr7 挂 C45
#      HSGMII PHY，本机 addr7 空（"MDIO device at address 7 is missing"），
#      真实 RTL8221B 在 addr6 且是 C22；旧 lan-phys 的 port3 为空导致
#      lan4 不注册、port4 指向不存在的 phy4 报 -19，实测只剩 lan2/lan3。
#      CU DTS 改为 phy@6 C22 + realtek,p6-phy +
#      lan-phys=<&phy0 &phy1 &phy2 &phy3>，netdev 为
#      lan1(2.5G) + lan2/lan3/lan4(GE)；96-pt1570-h10-cu-lan5 按真实形态
#      校正 br-lan（剔除 phantom lan0/lan5）。
#  17. run3 2.5G 口不 link / run4 整机起不来（2026-11-15 实机 + 源码核对）：
#      上游 rtl9617c-xram.c 的 rtl_p6_bringup() 开头判断
#      !priv->p6_serdes 直接 return；p6_serdes 只在 ni0 的 reg-names 含
#      "p6-serdes" 时才被 ioremap。run3 的 2p5g 基线缺这一项 -> QX
#      SerDes 不离开复位 -> 2.5G 口不 link（但能启动）。run4 补上该资源
#      后，bringup 真的跑起来：phy_power_on -> QXGMII block reset(BIT31)
#      -> 写 0xf550d000 -> 加载 2g5 表 -> 1501x10ms 约 15s 忙等 ->
#      phy_set_speed(2500) -> MAC 重配。CU 是 XGPON + 双 PCIe WiFi6，
#      PON MAC 窗口 4f5500000~4f550bfff 与 QX SerDes 相邻，这套 QX 复位
#      只在 PT1500-H10 验证过，在 CU 上把启动链打死 —— run4 刷入起不来。
#      本版：保留 7 项 reg / reg-names 资产，但打开驱动原生的
#      realtek,p6-bringup-off 逃生开关（rtl_p6_bringup / rtl_p6_set_speed
#      开头都检查），回到 run3 已验证能启动的行为，先保证机器可用。
#      2.5G 单独尝试：dispatch 选 p6_mode=attempt1g，由
#      cu-h10/fw/scripts/apply-p6-mode.py 在编译期删除 bringup-off、
#      把 15s 忙等降到 300ms、并回移植上游 f74dc1e59646 的 1G lane
#      编程（按 link 速度重载 p6_serdes_sgmii_1g.txt）。默认 bootsafe，
#      实验版单独编译、单独刷，不拿启动冒险。
#      上游 lyq1996/rtl9617c-openwrt HEAD 13ebc89b 与本锁定 ref 20b4cf4
#      已分叉（ahead 31 / behind 104），HEAD 重写为 rtl9617c.dtsi +
#      ni/ni_p6.c + 内建 RTL8221B patch + fit_do_upgrade，删除了
#      tyfza1-*.dtsi，三机型 workflow 全基于旧树，不能直接切 source_ref，
#      只逐项回移植（详见 apply-p6-mode.py 头部注释）。
#      ⚠️ 全程纯 DTS / 内核驱动侧，不需要改 U-Boot。
#  18. WiFi 整合 PonWRT-TYFZA1 v0.8.5（与 R10 run35 同一套）：驱动
#      power-tables.c 清掉厂商额外功率限制位（0xd208/0xd21c）、
#      wifi-scripts txpower ucode 修复、0.8.5 实机 26 张 v51 射频表作为
#      fem_profile=ponwrt085 可切换 profile；并加开机诊断快照，用于定位
#      run3「完全无无线」到底卡在 PCIe 枚举 / phy 注册 / PE 启动哪一段。
#  19. 三机型默认 LAN 统一 192.168.1.1/24（R10 / H10-CU / PT1500-H10）。
#  以上 15/16/17/18/19 由 cu-h10/fw/scripts/verify-h10-cu-board.py 与
#  cu-h10/fw/scripts/verify-cu-wifi-085.py 统一静态护栏，
#  apply-board-h10-cu.sh 与 workflow preflight 都会调用。
#
# factory 卷 8 MiB（与 DTS 的 fpga-image@10000 / 0x800000 对齐），
# 由配套 build-uboot-pt1570-h10-cu.yml 编译的 U-Boot 定义，两者必须成对使用。
#
# Actions 运行时：checkout@v5 / upload-artifact@v6 / action-gh-release@v3。

# 统一命名 ID: PT1570-H10-2P5G-CU-sysupgrade
#   规则 <型号>-<网口>-<运营商>-<产物类型>（uboot / sysupgrade）。
#   仅作用于展示层：workflow / job / artifact / release / packages / BUILD_INFO。
#   机器层 PROFILE / BOARD_NAME / DTS / SUPPORTED_DEVICES / Config target 符号
#   一律不动（uci-defaults 门控与 sysupgrade 白名单依赖它们），workflow 文件名
#   也保留，避免 GitHub 按路径重建 workflow、丢失 run 历史。
name: PT1570-H10-2P5G-CU-sysupgrade

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'lyq1996/rtl9617c-openwrt 的 commit / 分支（默认锁定已实机核对的完整 SHA）'
        required: false
        default: '20b4cf4490ca55cc406d07e391691efa8cd8a087'
        type: string
      test_only:
        description: '只生成并上传 .config / 校验报告，不编译'
        required: false
        default: false
        type: boolean
      create_release:
        description: '发布到 GitHub Release'
        required: false
        default: false
        type: boolean
      publish_packages:
        description: '同期收集并发布配套 packages（kmod + packages.adb + 公钥）；固件/WiFi 稳定前默认关闭，只出固件，需要时手动置 true'
        required: false
        default: false
        type: boolean
      packages_repo_url:
        description: '可选：自建 packages 静态源根 URL，随固件写入 customfeeds.list'
        required: false
        default: ''
        type: string
      apk_mirror_base:
        description: '可选：覆盖内置 apk 源（默认北大镜像 immortalwrt 25.12-SNAPSHOT 的 aarch64_cortex-a53 目录，公钥随镜像）。留空即用内置地址'
        required: false
        default: ''
        type: string
      apk_repo_key_url:
        description: '可选：外部 apk 源公钥 URL'
        required: false
        default: ''
        type: string
      fem_profile:
        description: '射频参数表 profile：yh1570=CU 现有默认表（默认）；ponwrt085=0.8.5 实机 v51 全套；generic=上游通用 v51 回滚；h10_2026_stock=本机 2026.6 原厂备份逆向全套（2.4G RFE50/iFEM + 5G RTC7676D）'
        required: false
        default: 'yh1570'
        type: choice
        options: [yh1570, ponwrt085, generic, h10_2026_stock]
      p6_mode:
        description: 'P6 / 2.5G 模式：bootsafe=关闭 QX bringup 保证能启动（默认，2.5G 暂不 link）；attempt1g=回移植上游 1G lane 编程单独尝试 2.5G（实验版，单独刷，可能仍起不来）'
        required: false
        default: 'bootsafe'
        type: choice
        options: [bootsafe, attempt1g]

permissions:
  contents: write

concurrency:
  group: pt1570-h10-2p5g-cu-sysupgrade-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: PT1570-H10-2P5G-CU-sysupgrade / build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # 独立 workflow：只编 H10。R10 在另一个 workflow 里，互不干扰。
        board: [h10cu]

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 防呆：任何把 R10 或第二个机型加回 matrix 的改动都会在这里失败。
      - name: Guard H10-CU-only
        env:
          BOARD: ${{ matrix.board }}
        run: |
          [ "$BOARD" = "h10cu" ] || {
            echo "ERROR: 本 workflow 只编 H10，收到 board=$BOARD" >&2; exit 1; }
          WF="$GITHUB_WORKSPACE/.github/workflows/build-ponwrt-pt1570-h10-cu.yml"
          LINE=$(grep -E '^[[:space:]]*board: \[' "$WF" | tr -d '[:space:]')
          [ "$LINE" = "board:[h10cu]" ] || {
            echo "ERROR: matrix board 行不是 [h10]：'$LINE'" >&2; exit 1; }
          echo "H10CU_ONLY_GUARD_OK=True board=$BOARD matrix=$LINE"

      - name: Resolve board parameters
        env:
          BOARD: ${{ matrix.board }}
        run: |
          case "$BOARD" in
            h10cu)
              echo "PROFILE=youhua_pt1570_h10_cu"      >> "$GITHUB_ENV"
              echo "BOARD_NAME=youhua,pt1570-h10-cu"  >> "$GITHUB_ENV"
              echo "DTS=rtl9617c-pt1570-h10-cu"       >> "$GITHUB_ENV"
              echo "MODEL=PT1570-H10-CU"              >> "$GITHUB_ENV"
              ;;
            *) echo "ERROR: H10 workflow 不接受 board=$BOARD" >&2; exit 1 ;;
          esac
          echo "board=$BOARD profile=youhua_pt1570_h10_cu dts=rtl9617c-pt1570-h10-cu"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"
          df -h /mnt

      - name: Install build dependencies
        # 与 R10 相同：包含 clang-18 / ld.lld-18 / llvm-objcopy-18，
        # target/linux/rtl9617c/pe/Makefile 硬编码它们编译 MIPS32 裸机 PE 程序。
        # tyfza1-pon-control（Rust）需要 host rustup 补 aarch64-unknown-linux-musl std。
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clang-18 cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld lld-18 llvm llvm-18 ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-unknown-linux-musl
            rustup target list --installed
          else
            echo "::error::runner 缺 rustup，无法补 aarch64-unknown-linux-musl std" >&2
            exit 1
          fi

      - name: Clone rtl9617c-openwrt source
        run: |
          set -e
          REF="${{ inputs.source_ref || '20b4cf4490ca55cc406d07e391691efa8cd8a087' }}"
          cd /mnt/build_wrt
          git init -q
          git remote add origin https://github.com/lyq1996/rtl9617c-openwrt.git
          [ "${#REF}" -eq 40 ] || { echo "::error::source_ref must be a 40-char commit SHA, got: $REF" >&2; exit 1; }
          git fetch -q --depth=1 origin "$REF" || { echo "::error::failed to fetch source ref: $REF" >&2; exit 1; }
          git checkout -q FETCH_HEAD
          echo "SOURCE_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          _SH=$(git rev-parse HEAD)
          [ "${#_SH}" -eq 40 ] || { echo "::error::SOURCE_HASH invalid: $_SH" >&2; exit 1; }
          echo "SOURCE_REF=$REF"                   >> "$GITHUB_ENV"
          echo "--- target ---"
          test -f target/linux/rtl9617c/image/Makefile
          test -f target/linux/rtl9617c/dts/rtl9617c-tyfza1-2p5g.dts
          test -f target/linux/rtl9617c/dts/rtl9617c-tyfza1.dtsi
          test -f package/utils/fitblk/files/fit.sh
          echo "source: $(git rev-parse HEAD)"


      - name: Compute build cache keys
        id: cachekeys
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_HASH: ${{ env.SOURCE_HASH }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" key /mnt/build_wrt pt1570-h10cu-ponwrt
          bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" dlkey /mnt/build_wrt pt1570-h10cu-ponwrt

      - name: Restore toolchain cache
        if: ${{ !inputs.test_only }}
        uses: actions/cache@v4
        with:
          path: |
            /mnt/build_wrt/staging_dir/host
            /mnt/build_wrt/staging_dir/hostpkg
            /mnt/build_wrt/staging_dir/toolchain
            /mnt/build_wrt/.ccache
          key: ${{ steps.cachekeys.outputs.KEY }}
          restore-keys: ${{ steps.cachekeys.outputs.PREFIX }}

      - name: Restore dl cache
        if: ${{ !inputs.test_only }}
        uses: actions/cache@v4
        with:
          path: /mnt/build_wrt/dl
          key: ${{ steps.cachekeys.outputs.DL_KEY }}
          restore-keys: ${{ steps.cachekeys.outputs.DL_PREFIX }}

      - name: Prepare restored cache
        if: ${{ !inputs.test_only }}
        run: bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" prepare /mnt/build_wrt
      - name: Build PE firmware (pe-tx-code.h)
        # 本机有双 PCIe WiFi6，内核 files-6.18 里 rtl_ax_ap 目录随源码树展开，
        # 且该头文件被上游 .gitignore 排除、OpenWrt 不会自动生成。缺它会在
        # target/linux/compile 阶段报 "pe-tx-code.h is missing" 而整树编译失败
        # （R10 run #7 的根因）。生成它避免整树编译失败；AP 驱动由 Config 显式点名带入。
        working-directory: wrt
        run: |
          set -eo pipefail
          echo "=== PE toolchain ==="
          for t in clang-18 ld.lld-18 llvm-objcopy-18 python3; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::PE 构建缺少工具 $t" >&2
              exit 1
            fi
            printf '  OK   %-20s %s\n' "$t" "$(command -v "$t")"
          done
          if ! make -C target/linux/rtl9617c/pe 2>&1 | tee /tmp/pe-build.log; then
            echo "::group::PE BUILD FAILED - last 60 lines"
            tail -n 60 /tmp/pe-build.log
            echo "::endgroup::"
            echo "::error::make -C target/linux/rtl9617c/pe 失败，pe-tx-code.h 未生成"
            exit 1
          fi
          HDR=target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pe-tx-code.h
          test -s "$HDR" || { echo "::error::pe-tx-code.h 未生成或为空"; exit 1; }
          grep -q 'static const u32 pe_tx_program\[\]' "$HDR" \
            || { echo "::error::pe-tx-code.h 内容不符"; exit 1; }
          echo "PE_HEADER_OK=True bytes=$(wc -c < "$HDR")"

      - name: Overlay known-good PT1570 WiFi driver (PE IRAM revert)
        # 上游 20b4cf4 的 rtl_ax_ap PE 引擎正是 PT1570 实测坏掉并 revert 的
        # IRAM/物理 CP3 方案：两张卡 probe 都等不到 PEWD mailbox -> -ETIMEDOUT
        # -> error -110 -> 完全没有 WiFi。2026-11-14 CU 真机 initramfs 复现：
        #   rtl_ax_ap: AP startup: powered=1 prepared=1 firmware=0 ...
        #   rtl_ax_ap: error -ETIMEDOUT: AP identity or firmware startup failed
        # 两张卡 PCIe 都 link up、驱动也绑定，就是 PE 程序跳不对地址。
        # 用 R10 已实机验证的整套 PT1570 驱动（60 文件，含配套 pe-tx-code.h）
        # 覆盖上面 PE 步骤现场编出的坏版。必须在 Build PE 之后、Configure 之前。
        # CU 首版固件只带了 PE 固件构建 + 51 个 WiFi 固件/RFE54 文件，漏了本步骤，
        # 这就是「内存启动能拨号、却没有 WiFi」的根因。
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/cu-h10/fw/scripts/overlay-wifi-driver.sh"

      - name: Pin APK signing key (optional)
        working-directory: wrt
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -n "$APK_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
            echo "APK build key pinned:"; sha256sum public-key.pem
          else
            echo "no APK_SIGNING_KEY: ephemeral key; firmware + packages of THIS run trust each other only"
          fi

      - name: Update and install feeds
        working-directory: wrt
        run: |
          LOG="$GITHUB_WORKSPACE/step-feeds.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          trap '
            rc=$?
            if [ "$rc" -ne 0 ]; then
              sleep 1
              echo "::group::FEEDS STEP FAILED (exit $rc) - last 80 lines"
              tail -n 80 "$LOG"
              echo "::endgroup::"
              last_step=$(grep "^STEP:" "$LOG" | tail -n 1)
              echo "::error::失败前最后进度: ${last_step:-未知}"
              grep -E "fatal:|error:|Error [0-9]|ERROR|No such file|not found|Failed|failed|denied|timed out|refusing" "$LOG" \
                | grep -v "::error::" | tail -n 6 | tr -d "\r" | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "::error::Update and install feeds 失败 (exit $rc)"
            fi
          ' EXIT

          echo "STEP: feeds update -a"
          ./scripts/feeds update -a
          echo "STEP: feeds install -a"
          ./scripts/feeds install -a
          echo "STEP: fix feed file permissions"
          # rpcd 会拒绝 world-writable 的 ucode handler
          chmod -R go-w feeds/luci feeds/packages 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/ucode/*' -type f -exec chmod 0755 {} + 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/acl.d/*.json' -type f -exec chmod 0644 {} + 2>/dev/null || true
          # luci-app-argon-config / luci-theme-argon 带的是 CRLF（#!/bin/sh\r）+ 0644，
          # rpcd exec 插件一个都加载不了 → 主题设置页 luci.argon/avail -32000。
          # feed 源码先归一化一次，最终由 cu-h10/fw/files-cu overlay + 产物断言兜底。
          find feeds -path '*/root/usr/libexec/rpcd/*' -type f -print 2>/dev/null | while IFS= read -r f; do
            [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ] || continue
            tr -d '\r' < "$f" > "$f.lf" && cat "$f.lf" > "$f" && rm -f "$f.lf"
            chmod 0755 "$f"
          done || true
          echo "  OK   rpcd exec 插件：CRLF 归一化 + 0755"

      - name: Apply H10-CU board injection + platform fixes
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/cu-h10/fw/scripts/apply-board-h10-cu.sh"

      # 2026-11-15 run4 砖版回退：默认 bootsafe（DTS 带
      # realtek,p6-bringup-off），attempt1g 才在编译期打开 QX bringup +
      # 回移植上游 1G lane 编程。脚本只改编译树里注入后的 DTS/驱动，
      # 不动 assets 原件，因此 verify-h10-cu-board.py 的 boot-safe 断言
      # 在两种模式下都成立。
      - name: Select P6 / 2.5G mode (boot-safe default)
        env:
          P6_MODE: ${{ inputs.p6_mode }}
          DTS: ${{ env.DTS }}
          WRT: ${{ github.workspace }}/wrt
          ASSETS: ${{ github.workspace }}
        run: python3 "$ASSETS/cu-h10/fw/scripts/apply-p6-mode.py"

      - name: Apply custom rootfs files (cu-h10/fw/files-cu)
        env:
          PACKAGES_REPO_URL: ${{ inputs.packages_repo_url }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/wrt/files"
          cp -a "$GITHUB_WORKSPACE/files-common/." "$GITHUB_WORKSPACE/wrt/files/"
          if [ -d "$GITHUB_WORKSPACE/cu-h10/fw/files-cu" ]; then
            cp -a "$GITHUB_WORKSPACE/cu-h10/fw/files-cu/." "$GITHUB_WORKSPACE/wrt/files/"
            chmod +x "$GITHUB_WORKSPACE/wrt/files/etc/uci-defaults/"* 2>/dev/null || true
            # rpcd exec 插件必须可执行，否则 rpcd 不加载，luci.argon* 对象不注册
            chmod +x "$GITHUB_WORKSPACE/wrt/files/usr/libexec/rpcd/"* 2>/dev/null || true
            echo "H10 custom rootfs files injected:"
            find "$GITHUB_WORKSPACE/cu-h10/fw/files-cu" -type f -printf '  %P\n'
          fi
          if [ -n "$PACKAGES_REPO_URL" ]; then
            URL="${PACKAGES_REPO_URL%/}"
            mkdir -p "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d"
            {
              echo '# 本次固件同批编译的 packages 源（由 workflow 注入）'
              echo "$URL/targets/rtl9617c/generic/packages/packages.adb"
            } > "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d/customfeeds.list"
            echo "custom packages repo: $URL/targets/rtl9617c/generic/packages/packages.adb"
          fi

      # 2026-11-16：SSID 按「型号 + 频段」区分，禁用双频合一。
      # radio0=5G / radio1=2.4G 改为 PT1570-H10-CU-5G / PT1570-H10-CU-2.4G。
      # 在注入后的 files overlay 上执行（幂等），确保镜像内 conffile 就是分频 SSID。
      - name: Set band-specific SSIDs (no dual-band unify)
        run: |
          set -e
          WF="$GITHUB_WORKSPACE/wrt/files/etc/config/wireless"
          [ -f "$WF" ] || { echo "::error::缺少注入后的 $WF"; exit 1; }
          python3 "$GITHUB_WORKSPACE/scripts/set-band-ssids.py" "$WF" "PT1570-H10-CU"
          echo "--- SSID in image overlay ---"
          grep -n "option ssid" "$WF"

      # 2026-11-15：把 PonWRT-TYFZA1 v0.8.5 的 WiFi 修复整合进 CU，与 R10
      # run35 同一套。驱动副本 board/wifi/rtl_ax_ap/power-tables.c
      # 已同步 0xd208/0xd21c 厂商限制位清零（信号弱的总闸）；这里再补
      # wifi-scripts 的 txpower ucode 修复，并对编译树做源码级断言。
      - name: Apply PonWRT 0.8.5 TX power fix (CU driver + wifi-scripts)
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: |
          set -e
          bash "$ASSETS/scripts/apply-ponwrt-txpower-fixes.sh"
          D="$WRT/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap"
          for kw in "TYFZA1's original power_limit MIB defaults to 0" \
                    'rtl_ax_update32(io, 0xd208, 0x00300000, 0);' \
                    'rtl_ax_update32(io, 0xd21c, 0x00040000, 0);'; do
            grep -qF "$kw" "$D/power-tables.c" \
              || { echo "::error::CU 驱动缺 0.8.5 功率修复: $kw"; exit 1; }
          done
          ! grep -q '0x00300000, 0x00300000' "$D/power-tables.c" \
            || { echo "::error::旧的 0xd208 置位逻辑残留"; exit 1; }
          echo "CU_PONWRT085_POWER_FIX_OK=True"

      # 2.4G 速率控制回归护栏。此处必须始终执行：原先这些断言只挂在
      # "Run static preflight" 步骤下，而该步骤带 if: inputs.test_only，
      # 正常固件编译时被整体跳过，等于从不生效。
      - name: Guard 2.4G rate-control patches (always runs)
        env:
          WRT: ${{ github.workspace }}/wrt
        run: |
          set -e
          D="$WRT/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap"
          for f in rate.h monitor.h pci.c; do
            [ -f "$D/$f" ] || { echo "::error::CU 驱动缺文件: $f"; exit 1; }
          done
          grep -q 'static inline void rtl_ax_ra_legacy' "$D/rate.h" \
            || { echo "::error::2.4G legacy RA 补丁缺失 (rate.h)"; exit 1; }
          grep -q 'rtl_ax_ra_legacy(command, id, legacy, band5g)' "$D/monitor.h" \
            || { echo "::error::2.4G legacy RA 未接入 rtl_ax_ra_peer (monitor.h)"; exit 1; }
          grep -q 'static inline u8 rtl_ax_ra_rssi_mask' "$D/rate.h" \
            || { echo "::error::RA RSSI 掩码回退缺失 (rate.h)"; exit 1; }
          grep -q 'static inline void rtl_ax_ra_environment' "$D/rate.h" \
            || { echo "::error::RA 环境噪声标记缺失 (rate.h)"; exit 1; }
          grep -q 'level = rtl_ax_ra_rssi_mask(mask_command, rssi, previous);' "$D/monitor.h" \
            || { echo "::error::RSSI 掩码回退未接入 watchdog (monitor.h)"; exit 1; }
          grep -q 'u8 ra_rssi_level\[128\];' "$D/pci.c" \
            || { echo "::error::ra_rssi_level 状态缺失 (pci.c)"; exit 1; }
          echo "CU_2G_RATE_CONTROL_GUARD_OK=True"

      # 0.8.5 实机解出的 26 张 v51 射频表随镜像附带，按 dispatch 一键切换；
      # 默认保持 CU 现有表，便于 A/B 对比原厂备份 / 0.8.5 / 自有固件三套参数。
      - name: Select WiFi RFE54 profile (CU)
        env:
          FEM_PROFILE: ${{ inputs.fem_profile }}
          WRT: ${{ github.workspace }}/wrt
          ASSETS: ${{ github.workspace }}
        run: |
          set -e
          DST="$WRT/files/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54"
          [ -d "$DST" ] || { echo "::error::CU rootfs overlay 缺 RFE54 目录"; exit 1; }
          # 驱动硬编码按 RFE54/RTK66587_BPF 读 5G、RFE54/RTK66287 读 2.4G。
          # rootfs overlay 本来就带这两个子目录；这里 mkdir -p 兜底，防止
          # 将来 assets 漏文件时 cp -f 把表写成同名普通文件而不是覆盖进目录。
          D2="$WRT/files/lib/firmware/realtek/tyfza1/rtl8192xbe/RFE54"
          mkdir -p "$DST/RTK66587_BPF" "$D2/RTK66287"
          [ -d "$DST/RTK66587_BPF" ] && [ -d "$D2/RTK66287" ] \
            || { echo "::error::FEM 表子目录创建失败"; exit 1; }
          case "${FEM_PROFILE:-yh1570}" in
            yh1570)
              # 表已内联进 rootfs overlay：驱动硬编码读 RFE54/RTK66587_BPF（5G）和
              # RFE54/RTK66287（2.4G），而 H10 专用表原先放在 RTK66587_BPF_YH1570/、
              # RFE50_STOCK_2026H10/ 等目录，从未被读到 —— 这是 5G 不可用、2.4G
              # 极弱的根因。
              # 2026-11-15 实机：换表前 5G IQK failures=24/40、OFDM CRC_error=25368、
              # handed_to_mac80211=0（客户端扫不到 SSID、连不上）；换 YH1570 表后
              # failures=0、VHT/HE 帧正常解出、已能正常关联。
              cmp -s "$DST/RTK66587_BPF/PHY_REG.txt" \
                     "$DST/RTK66587_BPF_GENERIC/PHY_REG.txt" \
                && { echo "::error::5G FEM 表退回通用 RTK66587_BPF（非 H10 专用）"; exit 1; }
              # 2026-11-15 run#43701802259 事故：PHY_REG 换成 YH1570 但 RadioA/RadioB
              # 漏换（仍是通用 1472897b），导致 5G 接收 CRC 全错、搜得到连不上。
              # 逐字节校验 RadioA/RadioB 必须与 _YH1570 源一致；缺任一即编译失败。
              for RF in RadioA.txt RadioB.txt; do
                cmp -s "$DST/RTK66587_BPF/$RF" \
                       "$DST/RTK66587_BPF_YH1570/$RF" \
                  || { echo "::error::5G $RF 不是 YH1570 专用（漏替换/退回通用），客户端将连不上"; exit 1; }
              done
              grep -q '0x02.*0x0000D.*iFEM' "$D2/RadioA.txt" \
                || { echo "::error::2.4G BASE 表不是 RFE50 iFEM 标定"; exit 1; }
              grep -q '0xFD.*0x15027' "$D2/RTK66287/RadioA.txt" \
                || { echo "::error::2.4G FEM 表不是 RFE50 PON_2G（缺 0xFD=0x15027）"; exit 1; }
              echo "FEM_PROFILE=yh1570 (5G YH1570 BPF 表 + 2.4G RFE50 iFEM 表，内联并断言)"
              ;;
            ponwrt085)
              SRC="$ASSETS/cu-h10/fw/files-cu/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54_PONWRT085"
              [ "$(find "$SRC" -name '*.txt' | wc -l)" = 26 ] \
                || { echo "::error::CU RFE54_PONWRT085 profile 不完整"; exit 1; }
              cp -a "$SRC"/. "$DST/"
              grep -q 'version = 51' "$DST/RTK66587_BPF/PHY_REG_GAIN.txt" \
                || { echo "::error::ponwrt085 profile 不是 v51 标定"; exit 1; }
              echo "FEM_PROFILE=ponwrt085 (PonWRT 0.8.5 v51 full set, 26 tables)"
              ;;
            generic)
              SRC="$ASSETS/cu-h10/fw/files-cu/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54/RTK66587_BPF_GENERIC"
              [ "$(find "$SRC" -name '*.txt' | wc -l)" = 12 ] \
                || { echo "::error::RTK66587_BPF_GENERIC 回滚目录不完整"; exit 1; }
              cp -a "$SRC"/. "$DST/RTK66587_BPF/"
              echo "FEM_PROFILE=generic (upstream v51 rollback)"
              ;;
            h10_2026_stock)
              # 本机 2026.6 新批次原厂 mtd4 备份逆向（不照抄网上拆机图）：
              #   2.4G = rtl8192xbe/RFE50，RadioA 0x02=0x0000D //iFEM，
              #          PON_2G/RadioA 0xFD=0x15027 —— 无外置 PA/LNA；
              #   5G   = rtl8852ce/RFE54，FEM 型号是 RTC7676D 系列
              #          （RTC7676D / RTC7676D1 / RTC7676D1_2L /
              #           RTC7676D_08U / RTK66587_DPX），不是天翼 TYFZA1
              #          的 RTK66587_BPF。
              # 路径映射与 R10 实机热验证一致：顶层 8 表 -> RFE54/(BASE)，
              # PON_2G 8 表 -> RFE54/RTK66287/(FEM stage)；驱动硬编码按
              # RFE54/RTK66287 读 2.4G、RFE54/RTK66587_BPF 读 5G。
              S2="$ASSETS/cu-h10/fw/files-cu/lib/firmware/realtek/tyfza1/rtl8192xbe/RFE50_STOCK_2026H10"
              S5="$ASSETS/cu-h10/fw/files-cu/lib/firmware/realtek/tyfza1/rtl8852ce/RFE54_RTC7676D_2026H10"
              [ "$(find "$S2" -name '*.txt' | wc -l)" = 38 ] \
                || { echo "::error::本机原厂 2.4G RFE50 表不完整"; exit 1; }
              [ "$(find "$S5" -name '*.txt' | wc -l)" = 74 ] \
                || { echo "::error::本机原厂 5G RTC7676D 表不完整"; exit 1; }
              for n in PHY_REG.txt PHY_REG_GAIN.txt RadioA.txt RadioB.txt \
                       TXPWR_ByRate.txt TXPWR_LMT.txt TXPWR_LMT_RU.txt TXPWR_TrackTSSI.txt; do
                cp -f "$S2/$n" "$D2/$n"
                cp -f "$S2/PON_2G/$n" "$D2/RTK66287/$n"
              done
              # 5G：RTC7676D 作为主 FEM 表装进驱动硬编码的 RTK66587_BPF 路径
              for f in "$S5/RTC7676D"/*.txt; do
                cp -f "$f" "$DST/RTK66587_BPF/$(basename "$f")"
              done
              for f in "$S5"/*.txt; do
                cp -f "$f" "$DST/$(basename "$f")"
              done
              grep -q '0x02.*0x0000D.*iFEM' "$D2/RadioA.txt" \
                || { echo "::error::本机原厂 2.4G 表不是 iFEM 标定"; exit 1; }
              grep -q '0xFD.*0x15027' "$D2/RTK66287/RadioA.txt" \
                || { echo "::error::本机原厂 2.4G PON_2G FEM ID 不对"; exit 1; }
              echo "FEM_PROFILE=h10_2026_stock (本机 2026.6 原厂 RFE50 iFEM 2.4G + RTC7676D 5G；注意：前端拓扑由驱动硬编码，换表不改 TRSW/RFM，2.4G 前端补丁仍在逆向)"
              ;;
            *) echo "::error::未知 fem_profile=$FEM_PROFILE"; exit 1 ;;
          esac
          echo "FEM_PROFILE_SELECTED=${FEM_PROFILE:-yh1570}"

      - name: Guard 2.4G RFE50 front-end fix (always runs)
        if: ${{ inputs.wifi_diag != true }}
        env:
          WRT: ${{ github.workspace }}/wrt
        run: |
          set -e
          D="$WRT/target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap"
          # 8192XB must select RFE50 params (no external FEM), 8852C keeps RFE54.
          grep -q 'const char \*rfe = chip == RTL_AX_8852C ? "RFE54" : "RFE50";' "$D/phy.c" \
            || { echo "::error::2.4G RFE50 路径选择缺失 (phy.c)"; exit 1; }
          grep -q 'const char \*rfe = chip == RTL_AX_8852C ? "RFE54" : "RFE50";' "$D/limits.c" \
            || { echo "::error::2.4G RFE50 路径选择缺失 (limits.c)"; exit 1; }
          grep -q 'const char \*rfe = chip == RTL_AX_8852C ? "RFE54" : "RFE50";' "$D/power-tables.c" \
            || { echo "::error::2.4G RFE50 路径选择缺失 (power-tables.c)"; exit 1; }
          # No external FEM for 8192XB (fem=""), and FEM GPIO only for 8852C.
          grep -q 'const char \*fem = chip == RTL_AX_8852C ? "RTK66587_BPF" : "";' "$D/phy.c" \
            || { echo "::error::8192XB 仍被当作有外置 FEM (phy.c)"; exit 1; }
          grep -q 'if (chip == RTL_AX_8852C) {' "$D/bb-dm.h" \
            || { echo "::error::FEM GPIO 未按芯片限制为 8852C (bb-dm.h)"; exit 1; }
          grep -q 'rtl_ax_xb_gain2g(io, &phy->gain\[RTL_AX_PHY_FEM\]);' "$D/xb-channel.h" \
            || { echo "::error::2.4G FEM 增益补偿未应用 (xb-channel.h)"; exit 1; }
          # RPQ 8192XB stock agg=121 (0x00ff0079)
          grep -q '0x00ff0079' "$D/mac-runtime.h" \
            || { echo "::error::8192XB RPQ agg=121 缺失 (mac-runtime.h)"; exit 1; }
          # Old rfe50_8192xb module-param approach must be gone.
          ! grep -rq 'rfe50_8192xb' "$D" \
            || { echo "::error::旧的 rfe50_8192xb 开关残留"; exit 1; }
          # Complete RFE50 tables must ship in rootfs.
          R="$WRT/files/lib/firmware/realtek/tyfza1/rtl8192xbe/RFE50"
          for f in PHY_REG.txt PHY_REG_GAIN.txt RadioA.txt RadioB.txt \
                   TXPWR_ByRate.txt TXPWR_LMT.txt TXPWR_LMT_RU.txt TXPWR_TrackTSSI.txt; do
            [ -f "$R/$f" ] || { echo "::error::缺 2.4G RFE50 表: $f"; exit 1; }
          done
          [ "$(wc -c < "$R/PHY_REG.txt")" -gt 20000 ] \
            || { echo "::error::RFE50/PHY_REG.txt 不是完整表（<20KB）"; exit 1; }
          echo "PT1570_2G_RFE50_GUARD_OK=True"

      - name: Configure
        working-directory: wrt
        env:
          ASSETS: ${{ github.workspace }}
          P6_MODE: ${{ inputs.p6_mode }}
          APK_MIRROR_BASE: ${{ inputs.apk_mirror_base }}
          APK_REPO_KEY_URL: ${{ inputs.apk_repo_key_url }}
        run: |
          set -e
          # ⚠️ 顺序敏感（R10 run #10 根因，同样适用于本 target）：
          #   绝不能在空 .config 上先跑 make defconfig。上游 target-metadata.pl
          #   把 Target System choice 硬编码为 default TARGET_mediatek，空配置
          #   defconfig 会选中 mediatek/filogic 默认机型 openwrt_one，把它的包集
          #   写成显式用户选择；切到 rtl9617c 后残留的 kmod-mac80211/cfg80211
          #   会与平台自带的 cfg80211.ko 互相覆盖（package/install Error 1）。
          #   正确顺序：先写最小配置（target + 机型 + 包断言），再 defconfig。
          rm -f .config
          cat "$GITHUB_WORKSPACE/cu-h10/fw/Config-PT1570-H10-CU.txt" >> .config
          bash "$GITHUB_WORKSPACE/cu-h10/fw/customize-pt1570-h10-cu.sh"

          # uboot-envtools 的 host fw_printenv 在此 target 会挂，必须保持关闭
          sed -i 's|^CONFIG_PACKAGE_uboot-envtools=y|# CONFIG_PACKAGE_uboot-envtools is not set|' .config

          make defconfig
          cat "$GITHUB_WORKSPACE/cu-h10/fw/Config-PT1570-H10-CU.txt" >> .config
          make defconfig

          # defconfig 会静默丢掉未被 profile 点名的包，重新断言后再次 defconfig
          for sym in tyfza1-pon-control luci-app-tyfza1-pon luci-ssl uhttpd fitblk \
                     luci-theme-argon; do
            if ! grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${sym} is not set$/d; /^CONFIG_PACKAGE_${sym}=/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
              echo "  re-asserted $sym"
            fi
          done
          make defconfig

          # 用户软件包基线（沿用 R10：tailscale 三件套），由 cu-h10/fw/Config-PT1570-H10-CU.txt
          # 直接写入；两次 defconfig 可能降级，这里统一重新断言再检查。
          echo "===== user-requested packages (tailscale baseline) ====="
          USER_PKGS="tailscale luci-app-tailscale-community \
                     luci-i18n-tailscale-community-zh-cn"
          for p in $USER_PKGS; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${p} is not set$/d; /^CONFIG_PACKAGE_${p}=/d" .config
              echo "CONFIG_PACKAGE_${p}=y" >> .config
              echo "  re-asserted $p"
            fi
          done
          make defconfig
          for p in $USER_PKGS; do
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config \
              || { echo "ERROR: $p 未启用（feed 里找不到该包，或依赖不满足被降级）" >&2; exit 1; }
            echo "  OK   $p"
          done

          echo "===== hard assertions ====="
          grep -q "^CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y$" .config \
            || { echo "ERROR: profile $PROFILE 未启用" >&2; exit 1; }
          for sym in tyfza1-pon-control luci-app-tyfza1-pon luci-ssl uhttpd fitblk \
                     luci-theme-argon; do
            grep -q "^CONFIG_PACKAGE_${sym}=y$" .config \
              || { echo "ERROR: $sym 二次 defconfig 后仍被丢弃" >&2; exit 1; }
            echo "  OK   $sym"
          done
          grep -q '^# CONFIG_PACKAGE_uboot-envtools is not set$' .config \
            || { echo "ERROR: uboot-envtools 必须关闭" >&2; exit 1; }
          echo "  OK   uboot-envtools disabled"

          # FIT rootfs 挂根依赖两个内核符号（不能写顶层 .config，会被 defconfig 丢弃）
          grep -q '^CONFIG_UIMAGE_FIT_BLK=y$' target/linux/rtl9617c/config-6.18 \
            || { echo "ERROR: target config-6.18 缺少 CONFIG_UIMAGE_FIT_BLK=y" >&2; exit 1; }
          echo "  OK   CONFIG_UIMAGE_FIT_BLK (target config)"
          grep -q '^CONFIG_MTD_ROOTFS_ROOT_DEV=y$' target/linux/generic/config-6.18 \
            || { echo "ERROR: generic config-6.18 缺少 CONFIG_MTD_ROOTFS_ROOT_DEV=y" >&2; exit 1; }
          echo "  OK   CONFIG_MTD_ROOTFS_ROOT_DEV (generic config)"

          # 上游 90-tyfza1-pon-wan 的 EPON 默认（pon0.3961 + offload=0）在本机
          # XGPON/1101 线路上拨不上号；确认它存在且仍是 3961，由 cu-h10/fw/files-cu 的
          # 95-pt1570-h10-cu-wan-default（90/91 之后执行）覆盖为正确默认值。
          UCI_SRC=target/linux/rtl9617c/base-files/etc/uci-defaults
          test -f "$UCI_SRC/90-tyfza1-pon-wan" \
            || { echo "ERROR: 上游默认 WAN 脚本 90-tyfza1-pon-wan 缺失" >&2; exit 1; }
          grep -q 'wan_vlan=3961' "$UCI_SRC/90-tyfza1-pon-wan" \
            || { echo "ERROR: 上游默认 WAN VLAN 不是 3961（上游改版？）" >&2; exit 1; }
          H10WAN="$GITHUB_WORKSPACE/cu-h10/fw/files-cu/etc/uci-defaults/95-pt1570-h10-cu-wan-default"
          test -f "$H10WAN" || { echo "ERROR: 缺 H10 WAN/FE 修复脚本 95-pt1570-h10-cu-wan-default" >&2; exit 1; }
          bash -n "$H10WAN" || { echo "ERROR: 95-pt1570-h10-cu-wan-default 语法错误" >&2; exit 1; }
          for kw in 'wan_vlan=1101' 'mtu=1500' "offload='1'" 'flow_offloading_hw' 'type=8021q'; do
            grep -qF "$kw" "$H10WAN" || { echo "ERROR: H10 WAN 脚本缺关键项 $kw" >&2; exit 1; }
          done
          echo "  OK   upstream 90 -> pon0.3961，H10 95 覆盖 -> pon0.1101 + PON FE on"

          grep -q "SUPPORTED_DEVICES += ${BOARD_NAME}" target/linux/rtl9617c/image/Makefile \
            || { echo "ERROR: image/Makefile 缺少 SUPPORTED_DEVICES" >&2; exit 1; }
          grep -q "$BOARD_NAME" target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: platform.sh 白名单缺少 $BOARD_NAME" >&2; exit 1; }
          grep -q 'CI_KERNPART=fit' target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: platform.sh 升级目标卷不是 fit" >&2; exit 1; }
          test -f "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: DTS 缺失" >&2; exit 1; }
          # factory 卷 8 MiB 与 fpga-image@10000 (0x10000+0x7e0000=0x800000) 对齐
          grep -q 'fpga-image@10000' target/linux/rtl9617c/dts/rtl9617c-tyfza1.dtsi \
            || { echo "ERROR: dtsi 缺少 fpga-image@10000（factory 8 MiB 布局基线）" >&2; exit 1; }
          echo "  OK   DTS=$DTS board_name=$BOARD_NAME factory=8MiB"

          # 黑砖回归护栏：ubi_device 必须可写，否则 UBI 只读 attach、
          # rootfs_data 建不出 overlay，sysupgrade 刷入后灯全灭。
          grep -q '/delete-property/ read-only' "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: 注入的 CU DTS 缺 &qspi /delete-property/ read-only" >&2; exit 1; }
          grep -q 'partition@340000' "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: CU DTS 的覆盖块没有指向 ubi_device(partition@340000)" >&2; exit 1; }
          echo "  OK   ubi_device 可写（刷入态 overlay 可建）"

          # 固件态 有线网口 + 面板灯回归护栏（本地与 CI 同一个脚本）
          python3 "$ASSETS/cu-h10/fw/scripts/verify-h10-cu-board.py" \
            || { echo "ERROR: H10-CU 板级护栏未通过（LED / 有线 / 首启脚本）" >&2; exit 1; }
          INJ="target/linux/rtl9617c/dts/${DTS}.dts"
          grep -q 'realtek,p6-phy = <&phy_2p5g>' "$INJ" \
            || { echo "ERROR: 注入的 DTS 缺 realtek,p6-phy（2.5G 口不会注册）" >&2; exit 1; }
          grep -q 'phy_2p5g: ethernet-phy@6' "$INJ" \
            || { echo "ERROR: 注入的 DTS 缺 phy@6 C22 RTL8221B" >&2; exit 1; }
          grep -q 'gpios = <&gpio0 11 GPIO_ACTIVE_HIGH>' "$INJ" \
            || { echo "ERROR: 注入的 DTS 电源灯 GPIO 不是 gpio0 11 高有效" >&2; exit 1; }
          echo "  OK   注入 DTS：OEM 低号 LED GPIO + phy@6/P6 + lan-phys 四项"
          # P6 资源完整性（2.5G 后续尝试要用，不能回退）；注意这 4 项
          # 不再等价于「2.5G 一定 link」—— run4 补齐后反而让 CU 起不来。
          for kw in '"p6-serdes"' '0xf550d000' 'realtek,dma-tx' 'realtek,qm-rx'; do
            grep -qF "$kw" "$INJ" \
              || { echo "ERROR: 注入的 CU DTS 缺 $kw（P6 资产回退）" >&2; exit 1; }
          done
          # bootsafe 模式必须带驱动原生逃生开关（run4 砖版根因的修复）。
          case "${P6_MODE:-bootsafe}" in
            bootsafe)
              grep -q 'realtek,p6-bringup-off' "$INJ" \
                || { echo "ERROR: bootsafe 版注入 DTS 缺 realtek,p6-bringup-off（run4 起不来的根因未修）" >&2; exit 1; }
              echo "  OK   P6 bootsafe：QX bringup 已关闭，保证能启动"
              ;;
            attempt1g)
              ! grep -q '^[[:space:]]*realtek,p6-bringup-off' "$INJ" \
                || { echo "ERROR: attempt1g 版仍带 bringup-off（编译期脚本未生效）" >&2; exit 1; }
              echo "  OK   P6 attempt1g：QX bringup 已打开（实验版，单独刷）"
              ;;
            *) echo "ERROR: 未知 p6_mode=${P6_MODE:-bootsafe}" >&2; exit 1 ;;
          esac

          # 上游首启脚本必须齐全（LED / LAN / br-lan MAC），
          # 且绝不能混入 R10 的 99-pt1570-fit / 95-pt1570-wan-default
          #（H10 自有 95-pt1570-h10-cu-wan-default，同名不同前缀，不冲突）。
          for s in 95-pt1500-storage 96-pt1500-leds 96-tyfza1-lan-mac 97-pt1500-lan5; do
            test -f "$UCI_SRC/$s" \
              || { echo "ERROR: 上游首启脚本缺失：$s" >&2; exit 1; }
          done
          [ ! -e "$UCI_SRC/99-pt1570-fit" ] \
            || { echo "ERROR: 上游树混入 R10 的 99-pt1570-fit" >&2; exit 1; }
          [ ! -e "$UCI_SRC/95-pt1570-wan-default" ] \
            || { echo "ERROR: 上游树混入 R10 的 95-pt1570-wan-default" >&2; exit 1; }
          echo "  OK   上游首启脚本齐全，无 R10 资产串入"

          echo "===== config sanity（防回归 / 机型隔离）====="
          # 反向：空配置 defconfig 会把 mediatek/filogic/openwrt_one 的包集写成显式 =y
          for bad in kmod-mac80211 kmod-cfg80211 kmod-mt7915e kmod-mt76-core \
                     wpad-basic-mbedtls mt7981-wo-firmware eip197-mini-firmware \
                     airoha-en8811h-firmware kmod-phy-airoha-en8811h kmod-rtc-pcf8563; do
            if grep -qE "^CONFIG_PACKAGE_${bad}=(y|m)$" .config; then
              echo "ERROR: 检测到污染包 ${bad}（默认 target 包残留），检查 .config 初始化顺序" >&2
              exit 1
            fi
          done
          echo "  OK   无 mediatek/openwrt_one 残留包"
          # 联通 H10-CU 有双 PCIe WiFi6（实机 10ec:c852 / 10ec:0192），这些包必须带
          for good in kmod-rtl-ax-ap wpad-mbedtls wireless-regdb wifi-scripts iw; do
            grep -q "^CONFIG_PACKAGE_${good}=y$" .config \
              || { echo "ERROR: 缺 WiFi 包 ${good}（本机有 WiFi6，漏了就没无线）" >&2; exit 1; }
            echo "  OK   ${good}"
          done
          # 正向：H10 上游 profile 自带、且 Config 里显式点名的中文 LuCI / argon
          for good in luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn; do
            grep -q "^CONFIG_PACKAGE_${good}=y$" .config \
              || { echo "ERROR: 中文 LuCI 包 ${good} 未启用" >&2; exit 1; }
            echo "  OK   ${good}"
          done

          # 三机型统一默认 LAN 192.168.1.1/24（显式掩码，DHCPv4 才不会被 /32 掐死）
          grep -qF "uci -q set network.lan.ipaddr='192.168.1.1/24'" \
            "$GITHUB_WORKSPACE/cu-h10/fw/files-cu/etc/uci-defaults/95-pt1570-h10-cu-wan-default" \
            || { echo "ERROR: 首启脚本未把默认 LAN 统一到 192.168.1.1/24" >&2; exit 1; }
          grep -qF 'WRT_IP="${WRT_IP:-192.168.1.1}"' \
            "$GITHUB_WORKSPACE/cu-h10/fw/customize-pt1570-h10-cu.sh" \
            || { echo "ERROR: customize-pt1570-h10-cu.sh 默认 IP 不是 192.168.1.1" >&2; exit 1; }
          echo "  OK   LAN 192.168.1.1/24（三机型统一）"

          # 0.8.5 WiFi 整合护栏（驱动功率修复 / 26 张 v51 profile / 诊断脚本）
          python3 "$ASSETS/cu-h10/fw/scripts/verify-cu-wifi-085.py" \
            || { echo "ERROR: CU 0.8.5 WiFi 整合护栏未通过" >&2; exit 1; }
          echo "  OK   CU 0.8.5 WiFi 整合护栏"

          # 跨板 WiFi 资产一致性护栏（R10 <-> CU 单 PE1 参考驱动逐字节相同）
          python3 "$ASSETS/scripts/verify-wifi-parity.py" "$ASSETS" \
            || { echo "ERROR: 两板 WiFi 资产漂移（驱动/overlay 不一致）" >&2; exit 1; }

          echo "===== key config ====="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)=' .config || true
          echo "  =m packages: $(grep -c '^CONFIG_PACKAGE_.*=m$' .config || true)"
          echo "--- files/etc/apk/repositories.d/distfeeds.list ---"
          cat files/etc/apk/repositories.d/distfeeds.list
          cp .config "$GITHUB_WORKSPACE/Config-final.txt"


      - name: Verify device package closure
        working-directory: wrt
        run: |
          PROFILE="${{ env.PROFILE }}"
          [ -n "$PROFILE" ] || { echo "::error::PROFILE is empty (Resolve board parameters did not run)"; exit 1; }
          bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" check-packages /mnt/build_wrt "$PROFILE"
      - name: Run static preflight (H10-CU)
        if: ${{ inputs.test_only }}
        run: |
          set -e
          WF="$GITHUB_WORKSPACE/.github/workflows/build-ponwrt-pt1570-h10-cu.yml"
          echo "=== 1. H10 资产齐全 ==="
          for f in "$WF" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/Config-PT1570-H10-CU.txt" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/customize-pt1570-h10-cu.sh" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/scripts/apply-board-h10-cu.sh" \
                   "$GITHUB_WORKSPACE/scripts/verify-fit-boot.py" \
                   "$GITHUB_WORKSPACE/files-common/etc/apk/keys/immortalwrt-25.12.pem" \
                   "$GITHUB_WORKSPACE/files-common/lib/upgrade/zz-pt1570-sysupgrade.sh" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/files-cu/etc/uci-defaults/95-pt1570-h10-cu-wan-default" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/files-cu/etc/uci-defaults/96-pt1570-h10-cu-lan5" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/files-cu/etc/uci-defaults/98-pt1570-h10-cu-leds" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/board/dts/rtl9617c-pt1570-h10-cu.dts" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/scripts/overlay-wifi-driver.sh" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/scripts/verify-h10-cu-board.py" \
                   "$GITHUB_WORKSPACE/cu-h10/fw/scripts/apply-p6-mode.py" \
                   "$GITHUB_WORKSPACE/board/wifi/rtl_ax_ap/pe-tx-code.h"; do
            [ -f "$f" ] || { echo "ERROR: 缺资产 $f" >&2; exit 1; }
          done
          echo "  OK   H10-CU 资产齐全"
          echo "=== 2. H10-CU-only 结构 ==="
          LINE=$(grep -E '^[[:space:]]*board: \[' "$WF" | tr -d '[:space:]')
          [ "$LINE" = "board:[h10cu]" ] || { echo "ERROR: matrix 不是 [h10cu]: '$LINE'" >&2; exit 1; }
          grep -q 'Guard H10-CU-only' "$WF" || { echo "ERROR: 缺 H10-only 防呆步骤" >&2; exit 1; }
          echo "  OK   matrix=[h10cu] + guard"
          echo "=== 3. 与 R10 资产隔离 ==="
          # 注意：CU 现在必须自带 WiFi 驱动 overlay（cu-h10/fw/scripts/），
          # 与 R10 的 scripts/ 资产隔离是「不引用 R10 专属脚本」，不是「不许有 WiFi 修复」。
          ! grep -qE 'scripts/(patch-upstream|patch-wifi-diag|apply-board)\.sh|[^ ]customize-pt1570-r10\.sh|Config-PT1570-R10\.txt|Config-PT1570-R10-extra\.txt|Config-PT1570-R10-diag\.txt' "$WF" \
            || { echo "ERROR: H10 workflow 仍引用 R10 专属脚本 / 配置" >&2; exit 1; }
          echo "  OK   无 R10 板级注入脚本引用"
          echo "=== 3b. WiFi 驱动 overlay 必须存在（否则刷入后无 WiFi）==="
          grep -q 'Overlay known-good PT1570 WiFi driver' "$WF" \
            || { echo "ERROR: 缺 WiFi 驱动 overlay 步骤（双 PCIe WiFi6 会 probe -110）" >&2; exit 1; }
          grep -q 'cu-h10/fw/scripts/overlay-wifi-driver.sh' "$WF" \
            || { echo "ERROR: overlay 步骤未调用 CU 自己的驱动脚本" >&2; exit 1; }
          echo "  OK   WiFi 驱动 overlay 已接线"
          echo "=== 3c. 黑砖 / 无 WiFi 回归护栏 ==="
          CUDTS="$GITHUB_WORKSPACE/cu-h10/fw/board/dts/rtl9617c-pt1570-h10-cu.dts"
          grep -q '/delete-property/ read-only' "$CUDTS" \
            || { echo "ERROR: CU DTS 缺 ubi_device 可写覆盖块（刷入态会黑砖）" >&2; exit 1; }
          DRV="$GITHUB_WORKSPACE/board/wifi/rtl_ax_ap"
          [ "$(find "$DRV" -maxdepth 1 -type f | wc -l)" -ge 60 ] \
            || { echo "ERROR: PT1570 参考驱动文件不足 60" >&2; exit 1; }
          [ "$(md5sum "$DRV/pe-tx-code.h" | cut -d' ' -f1)" = "7eb49893f43b897bf03fa82ae2323984" ] \
            || { echo "ERROR: pe-tx-code.h 不是已验证的单 PE1 参考版" >&2; exit 1; }
          grep -q 'static inline void rtl_ax_ra_legacy' "$DRV/rate.h" \
            || { echo "ERROR: 2.4G legacy RA 补丁缺失 (rate.h)" >&2; exit 1; }
          grep -q 'rtl_ax_ra_legacy(command, id, legacy, band5g)' "$DRV/monitor.h" \
            || { echo "ERROR: 2.4G legacy RA 未接入 rtl_ax_ra_peer (monitor.h)" >&2; exit 1; }
          echo "  OK   ubi_device 可写 + 单 PE1 参考驱动 60 文件 + 2.4G legacy RA 补丁"
          echo "  (2.4G 速率控制断言由 always-run 的 Guard 步骤负责，见上)"
          echo "=== 3d. 固件态 有线 + 面板灯回归护栏 ==="
          python3 "$GITHUB_WORKSPACE/cu-h10/fw/scripts/verify-h10-cu-board.py" \
            || { echo "ERROR: H10-CU 板级护栏未通过" >&2; exit 1; }
          echo "  OK   OEM 低号 LED GPIO + phy@6/P6 + lan-phys + CU 首启脚本"
          echo "=== 4. Config 基线关键符号 ==="
          C="$GITHUB_WORKSPACE/cu-h10/fw/Config-PT1570-H10-CU.txt"
          for sym in CONFIG_PACKAGE_fitblk CONFIG_PACKAGE_tyfza1-pon-control \
                     CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_tailscale; do
            grep -q "^${sym}=y$" "$C" || { echo "ERROR: $sym 缺失" >&2; exit 1; }
          done
          echo "  OK   Config 关键符号"
          echo "H10CU_PREFLIGHT_OK=True"

      - name: Upload config (test_only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1570-H10-2P5G-CU-sysupgrade-config-${{ github.run_number }}
          path: Config-final.txt
          retention-days: 14

      - name: Download sources
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          make package/base-files/clean >/dev/null 2>&1 || true
          JOBS=$(bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" jobs /mnt/build_wrt)
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          make download -j"$JOBS"


      - name: Build toolchain (cacheable)
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          set -e
          JOBS=$(bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" jobs /mnt/build_wrt)
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "building toolchain with -j$JOBS"
          make -j"$JOBS" toolchain/compile

      - name: Save toolchain cache (early)
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/build_wrt/staging_dir/host
            /mnt/build_wrt/staging_dir/hostpkg
            /mnt/build_wrt/staging_dir/toolchain
            /mnt/build_wrt/.ccache
          key: ${{ steps.cachekeys.outputs.KEY }}-${{ github.run_id }}
      - name: Compile
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          JOBS="${JOBS:-$(bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" jobs /mnt/build_wrt)}"
          echo "parallel jobs=$JOBS"
          if make -j"$JOBS" 2>&1 | tee -a "$LOG"; then
            echo "PARALLEL_BUILD_OK=True"
          else
            bash "$GITHUB_WORKSPACE/scripts/wb-build-common.sh" diagnose "$LOG" || true
            FAILED_SUB=$(grep -oE 'ERROR: [^ ]+ failed to build' "$LOG" | tail -1 | sed 's/^ERROR: //; s/ failed to build$//' || true)
            if [ -n "$FAILED_SUB" ]; then
              case "$FAILED_SUB" in package/*|target/*) RETRY="$FAILED_SUB/compile" ;; *) RETRY="$FAILED_SUB" ;; esac
              echo "::warning::targeted verbose retry: $RETRY"
              make -j1 V=s "$RETRY" 2>&1 | tee -a "$LOG" && { echo "TARGETED_RETRY_OK=True"; echo "" >> "$LOG"; } || true
            fi
            echo "::warning::并行编译失败，改用 -j1 V=s 重试并显示详细日志"
            if make -j1 V=s 2>&1 | tee -a "$LOG"; then
              echo "SERIAL_BUILD_OK=True"
            else
              echo "::group::BUILD FAILED - last 120 lines"
              tail -n 120 "$LOG"
              echo "::endgroup::"
              grep -E 'Error [0-9]|^make(\[[0-9]+\])?: \*\*\*|error:|No such file|not found|No space left|Killed|undefined reference|FATAL|FAIL' "$LOG" \
                | tail -n 8 | tr -d '\r' | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "BUILD_FAILED=True" >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Verify image payload (H10-CU)
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        env:
          ASSETS: ${{ github.workspace }}
          APK_MIRROR_BASE: ${{ inputs.apk_mirror_base }}
        run: |
          set -e
          ROOT=$(ls -d build_dir/target-*/root-rtl9617c* 2>/dev/null | head -1)
          [ -n "$ROOT" ] || { echo "::error::找不到 rootfs 目录 build_dir/target-*/root-rtl9617c*"; exit 1; }
          echo "rootfs dir: $ROOT"

          # ---- apk 源与索引公钥（缺公钥会 UNTRUSTED signature）----
          KEY_SRC="$ASSETS/files-common/etc/apk/keys/immortalwrt-25.12.pem"
          KEY_DST="$ROOT/etc/apk/keys/immortalwrt-25.12.pem"
          [ -f "$KEY_DST" ] || { echo "::error::镜像缺少 apk 索引公钥 immortalwrt-25.12.pem"; exit 1; }
          cmp -s "$KEY_SRC" "$KEY_DST" || { echo "::error::镜像内 apk 公钥与资产不一致"; exit 1; }
          echo "  OK   apk key: immortalwrt-25.12.pem ($(stat -c %s "$KEY_DST") B)"

          DF="$ROOT/etc/apk/repositories.d/distfeeds.list"
          [ -f "$DF" ] || { echo "::error::镜像缺少 distfeeds.list"; exit 1; }
          nfeed=$(grep -vc '^[[:space:]]*#' "$DF" || true)
          [ "$nfeed" -ge 1 ] || { echo "::error::distfeeds.list 无有效源行"; exit 1; }
          if [ -n "${APK_MIRROR_BASE:-}" ]; then
            # 自定义 apk 源：只要求有有效源行，不校验北大镜像条数 / a53 目录
            echo "  OK   distfeeds: 自定义 apk 源，有效行 $nfeed（跳过北大镜像计数）"
          else
            npku=$(grep -c 'mirrors\.pku\.edu\.cn/immortalwrt/releases/25\.12-SNAPSHOT/packages/aarch64_cortex-a53/' "$DF" || true)
            [ "$npku" = 5 ] || { echo "::error::distfeeds 里北大 25.12 源 $npku 条 != 5（base/luci/packages/routing/telephony）"; exit 1; }
            grep -v '^[[:space:]]*#' "$DF" | grep -q 'aarch64_cortex-a55' \
              && { echo "::error::distfeeds 有效源指向了镜像不存在的 aarch64_cortex-a55 目录"; exit 1; }
            echo "  OK   distfeeds: 北大镜像 25.12-SNAPSHOT ×$npku（aarch64_cortex-a53）"
          fi

          # /etc/apk/arch 在 ROM 里只有 a55，首启由 91-pt1570-apk-arch 补 a53
          if [ -f "$ROOT/etc/apk/arch" ]; then
            grep -q 'aarch64_cortex-a55' "$ROOT/etc/apk/arch" \
              || { echo "::error::/etc/apk/arch 缺本机架构 aarch64_cortex-a55"; exit 1; }
            echo "  OK   /etc/apk/arch 本机架构 a55（a53 由首启脚本追加）"
          else
            echo "::error::镜像缺少 /etc/apk/arch"; exit 1
          fi
          [ -f "$ROOT/etc/uci-defaults/91-pt1570-apk-arch" ] \
            || { echo "::error::镜像缺少 91-pt1570-apk-arch（a53 不会被允许安装）"; exit 1; }
          grep -q 'aarch64_cortex-a53' "$ROOT/etc/uci-defaults/91-pt1570-apk-arch" \
            || { echo "::error::91-pt1570-apk-arch 没写 aarch64_cortex-a53"; exit 1; }
          echo "APK_SOURCE_OK=True feeds=$nfeed"

          # ---- sysupgrade 机型校验 ----
          # 上游 pt1500-fip.sh 按字母序排在 platform.sh 之后被 source，会覆盖
          # platform_check_image/do_upgrade 并写不存在的 fip 卷。编译期已移除，
          # 这里复核产物。
          UPG="$ROOT/lib/upgrade"
          [ -d "$UPG" ] || { echo "::error::镜像缺少 /lib/upgrade"; exit 1; }
          [ ! -e "$UPG/pt1500-fip.sh" ] \
            || { echo "::error::镜像仍含 pt1500-fip.sh（sysupgrade 会写不存在的 fip 卷）"; exit 1; }
          ! grep -rl 'this image is for youhua,pt1500-h10' "$UPG" 2>/dev/null | grep -q . \
            || { echo "::error::镜像 /lib/upgrade 残留 H10 老机型检查"; exit 1; }
          grep -q 'youhua,pt1570-h10-cu' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 白名单缺少 youhua,pt1570-h10-cu"; exit 1; }
          grep -q 'CI_KERNPART=fit' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 升级目标卷不是 fit"; exit 1; }
          echo "SYSUPGRADE_BOARD_OK=True"

          # ---- rpcd exec 插件 / argon 主题设置 ----
          # CRLF（#!/bin/sh\r）+ 0644 会让 5 个 luci.argon* ubus 对象全不注册。
          RPCD="$ROOT/usr/libexec/rpcd"
          [ -d "$RPCD" ] || { echo "::error::镜像缺少 /usr/libexec/rpcd"; exit 1; }
          n=0
          for f in "$ASSETS"/files-common/usr/libexec/rpcd/luci.argon*; do
            base=${f##*/}
            tgt="$RPCD/$base"
            [ -f "$tgt" ] || { echo "::error::镜像缺少 rpcd 插件 $base"; exit 1; }
            [ -x "$tgt" ] || { echo "::error::rpcd 插件 $base 不可执行（rpcd 不会加载）"; exit 1; }
            if grep -q "$(printf '\r')" "$tgt"; then
              echo "::error::rpcd 插件 $base 仍是 CRLF（shebang 会变成 /bin/sh\r）"; exit 1
            fi
            cmp -s "$f" "$tgt" || { echo "::error::镜像内 $base 与 assets 的 LF 版本不一致"; exit 1; }
            n=$((n+1))
          done
          [ "$n" = 5 ] || { echo "::error::argon rpcd 插件数量 $n != 5"; exit 1; }
          [ -f "$ROOT/etc/uci-defaults/92-pt1570-rpcd-eol" ] \
            || { echo "::error::镜像缺少 92-pt1570-rpcd-eol 兜底脚本"; exit 1; }
          echo "RPCD_ARGON_OK=True plugins=$n"

          # ---- sysupgrade 不保留配置 + fitblk 释放 FIT 子镜像 ----
          # H10 与 R10 同样靠 FIT 子镜像块设备挂根（ubi0_1(fit) -> ubiblock ->
          # /dev/fit0），platform.sh 直接 nand_do_upgrade() 绕过 fit.sh 的释放，
          # ubirmvol 会 EBUSY → 升级静默失败。zz- 脚本按字母序最后被 source 覆盖。
          ZZ="$ROOT/lib/upgrade/zz-pt1570-sysupgrade.sh"
          [ -f "$ZZ" ] || { echo "::error::镜像缺少 zz-pt1570-sysupgrade.sh"; exit 1; }
          grep -q 'UPGRADE_BACKUP' "$ZZ" \
            || { echo "::error::zz 脚本未按 UPGRADE_BACKUP 限制配置恢复"; exit 1; }
          grep -q 'umount -l /overlay' "$ZZ" \
            || { echo "::error::zz 脚本未卸载 overlay（ubirmvol 会失败）"; exit 1; }
          grep -q 'CI_KERNPART=fit' "$ZZ" \
            || { echo "::error::zz 脚本升级目标卷不是 fit"; exit 1; }
          LAST_SH=$(ls -1 "$ROOT"/lib/upgrade/*.sh 2>/dev/null | sed 's|.*/||' | sort | tail -1)
          [ "$LAST_SH" = "zz-pt1570-sysupgrade.sh" ] \
            || { echo "::error::zz 脚本不是 /lib/upgrade 里最后的 .sh（覆盖不生效）"; exit 1; }
          echo "SYSUPGRADE_KEEP_OK=True order=$LAST_SH"

          [ -f "$ROOT/usr/sbin/fitblk" ] && [ -s "$ROOT/usr/sbin/fitblk" ] \
            || { echo "::error::镜像缺少 /usr/sbin/fitblk（无法释放 /dev/fit0）"; exit 1; }
          grep -q 'RAMFS_COPY_BIN=.*fitblk' "$ZZ" \
            || { echo "::error::zz 脚本未把 fitblk 加进 RAMFS_COPY_BIN（stage2 找不到工具）"; exit 1; }
          grep -q '/usr/sbin/fitblk /dev/fit0' "$ZZ" \
            || { echo "::error::zz 脚本未释放 /dev/fit0"; exit 1; }
          grep -q '/usr/sbin/fitblk /dev/fitrw' "$ZZ" \
            || { echo "::error::zz 脚本未释放 /dev/fitrw"; exit 1; }
          F_LINE=$(grep -n '/usr/sbin/fitblk /dev/fit0' "$ZZ" | head -1 | cut -d: -f1)
          U_LINE=$(grep -n 'nand_do_upgrade "\$1"' "$ZZ" | head -1 | cut -d: -f1)
          [ -n "$F_LINE" ] && [ -n "$U_LINE" ] && [ "$F_LINE" -lt "$U_LINE" ] \
            || { echo "::error::fitblk 释放顺序不在 nand_do_upgrade 之前"; exit 1; }
          echo "FITBLK_RELEASE_OK=True fitblk_line=$F_LINE nand_line=$U_LINE"

          # ---- 首启脚本（LED / LAN / br-lan MAC / 默认 WAN + CU WAN/FE 修复）----
          UCI="$ROOT/etc/uci-defaults"
          for s in 90-tyfza1-pon-wan 95-pt1500-storage 96-pt1500-leds \
                   96-tyfza1-lan-mac 97-pt1500-lan5 \
                   95-pt1570-h10-cu-wan-default 96-pt1570-h10-cu-lan5 \
                   98-pt1570-h10-cu-leds; do
            [ -f "$UCI/$s" ] || { echo "::error::镜像缺少首启脚本 $s"; exit 1; }
          done
          # 固件态 有线 + 面板灯修复必须真的进了镜像
          grep -q 'lan4' "$UCI/96-pt1570-h10-cu-lan5" \
            || { echo "::error::镜像里 CU bridge 脚本未按 lan1..lan4 校正"; exit 1; }
          grep -q 'LED_PWR_G' "$UCI/98-pt1570-h10-cu-leds" \
            || { echo "::error::镜像里 CU LED 脚本缺电源灯兜底"; exit 1; }
          grep -q 'LED_EPHY' "$UCI/98-pt1570-h10-cu-leds" \
            || { echo "::error::镜像里 CU LED 脚本缺网口灯绑定"; exit 1; }
          echo "CU_LAN_LED_FIX_OK=True"
          # br-lan MAC 固定由上游 96-tyfza1-lan-mac 从 factory lan_mac 读取
          grep -q 'network.lan.macaddr' "$UCI/96-tyfza1-lan-mac" \
            || { echo "::error::96-tyfza1-lan-mac 未固定 br-lan MAC"; exit 1; }
          # CU WAN/FE/LAN 修复脚本必须带齐全部关键项（与 R10 同一个 PON FE 坑）
          H10WAN="$UCI/95-pt1570-h10-cu-wan-default"
          grep -q 'youhua,pt1570-h10-cu' "$H10WAN" \
            || { echo "::error::H10 WAN 脚本 board_name 不对"; exit 1; }
          for kw in 'wan_vlan=1101' 'mtu=1500' "offload='1'" 'flow_offloading_hw' 'type=8021q'; do
            grep -qF "$kw" "$H10WAN" || { echo "::error::镜像里 H10 WAN 脚本缺 $kw"; exit 1; }
          done
          # 绝不能把 R10 的网口/MAC 兜底与 WAN 覆盖带进 H10-CU
          [ ! -e "$UCI/99-pt1570-fit" ] \
            || { echo "::error::镜像混入 R10 的 99-pt1570-fit"; exit 1; }
          [ ! -e "$UCI/95-pt1570-wan-default" ] \
            || { echo "::error::镜像混入 R10 的 95-pt1570-wan-default"; exit 1; }
          echo "UCI_DEFAULTS_OK=True WAN_FE_FIX_OK=True"

          # ---- SSID 按型号+频段区分，禁用双频合一（2026-11-16）----
          [ -f "$ROOT/etc/config/wireless" ] \
            || { echo "::error::镜像缺少默认 /etc/config/wireless"; exit 1; }
          grep -q "^[[:space:]]*option ssid 'PT1570-H10-CU-5G'$" "$ROOT/etc/config/wireless" \
            || { echo "::error::镜像缺 5G SSID PT1570-H10-CU-5G"; exit 1; }
          grep -q "^[[:space:]]*option ssid 'PT1570-H10-CU-2.4G'$" "$ROOT/etc/config/wireless" \
            || { echo "::error::镜像缺 2.4G SSID PT1570-H10-CU-2.4G"; exit 1; }
          [ "$(grep -c "option ssid 'PT1570-H10-CU'" "$ROOT/etc/config/wireless")" = 0 ] \
            || { echo "::error::镜像仍有双频合一 SSID PT1570-H10-CU"; exit 1; }
          ssn=$(grep -c "option ssid" "$ROOT/etc/config/wireless")
          [ "$ssn" = 2 ] || { echo "::error::镜像 SSID 数 $ssn != 2"; exit 1; }
          echo "SSID_PER_BAND_OK=True (PT1570-H10-CU-5G / PT1570-H10-CU-2.4G, no dual-band unify)"

          # ---- hostapd 断流缓解参数（2026-11-17，移植自 lu-1991 CI）----
          [ "$(grep -c "option skip_inactivity_poll '1'" "$ROOT/etc/config/wireless")" = 2 ] \
            || { echo "::error::镜像两个 VAP 缺 skip_inactivity_poll=1"; exit 1; }
          [ "$(grep -c "option disassoc_low_ack '0'" "$ROOT/etc/config/wireless")" = 2 ] \
            || { echo "::error::镜像两个 VAP 缺 disassoc_low_ack=0"; exit 1; }
          [ -x "$ROOT/etc/uci-defaults/99-pt1570-h10-cu-wifi-stability" ] \
            || { echo "::error::99-pt1570-h10-cu-wifi-stability 未进镜像或丢了可执行位"; exit 1; }
          grep -q 'skip_inactivity_poll' "$ROOT/etc/uci-defaults/99-pt1570-h10-cu-wifi-stability" \
            || { echo "::error::CU stability 脚本缺 skip_inactivity_poll"; exit 1; }
          grep -q 'disassoc_low_ack' "$ROOT/etc/uci-defaults/99-pt1570-h10-cu-wifi-stability" \
            || { echo "::error::CU stability 脚本缺 disassoc_low_ack"; exit 1; }
          echo "HOSTAPD_STABILITY_OK=True (skip_inactivity_poll=1 / disassoc_low_ack=0 on 2 VAPs)"

          # ---- factory 提取脚本修补 + 校准软链接 ----
          grep -q 'mv "\$tmp" "\$3"' "$ROOT/etc/init.d/tyfza1-factory" \
            || { echo "::error::镜像里的 tyfza1-factory 未应用 factory_blob 修补"; exit 1; }
          echo "FACTORY_PATCH_OK=True"
          for l in \
            lib/firmware/realtek/rtl9617c/bosa-calibration.bin \
            lib/firmware/realtek/rtl9617c/a2h.bin; do
            [ -L "$ROOT/$l" ] || echo "::warning::缺少校准软链接 $l"
          done

          # ---- FIT rootfs 自洽性 ----
          # bootargs 不写 root=，由 MTD_ROOTFS_ROOT_DEV + fitblk 驱动自设 ROOT_DEV。
          KCFG=$(ls -d build_dir/target-*/linux-rtl9617c/linux-*/.config 2>/dev/null | head -1)
          [ -n "$KCFG" ] || KCFG=$(find build_dir -maxdepth 6 -path '*linux-rtl9617c*' \
              -name auto.conf 2>/dev/null | head -1)
          if [ -n "$KCFG" ]; then
            for sym in CONFIG_UIMAGE_FIT_BLK CONFIG_MTD_ROOTFS_ROOT_DEV CONFIG_SQUASHFS; do
              grep -q "^${sym}=y$" "$KCFG" \
                || { echo "::error::内核 $KCFG 里 ${sym} 不是 y，FIT rootfs 挂不上"; exit 1; }
            done
            echo "KERNEL_FIT_ROOTFS_OK=True ($KCFG)"
          else
            echo "::warning::找不到内核编译后的 .config，跳过 KERNEL_FIT_ROOTFS_OK"
          fi

          # 直接解析产出的 sysupgrade.itb：bootargs 不含 root=/rootwait/ubi.*、
          # rootdisk 指向 volname=fit 的卷、分区带 linux,ubi、model 不含 ABI。
          ITB=$(ls bin/targets/rtl9617c/generic/*sysupgrade.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "::error::找不到 sysupgrade.itb"; exit 1; }
          python3 "$ASSETS/scripts/verify-fit-boot.py" "$ITB"

          echo "IMAGE_PAYLOAD_OK=True"

      - name: Upload build log (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1570-H10-2P5G-CU-sysupgrade-build-log-${{ github.run_number }}
          path: |
            build.log
            step-feeds.log
          if-no-files-found: warn
          retention-days: 30

      - name: Refresh package index
        if: ${{ !inputs.test_only && inputs.publish_packages }}
        working-directory: wrt
        run: |
          make package/index
          find bin/targets/rtl9617c/generic/packages bin/packages \
            -name packages.adb -printf '%p %s bytes\n' 2>/dev/null | sort || true

      - name: Collect firmware + matching packages
        if: ${{ !inputs.test_only }}
        env:
          PUBLISH_PACKAGES: ${{ inputs.publish_packages }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/wrt"
          echo "===== bin/targets/rtl9617c/generic ====="
          ls -lh bin/targets/rtl9617c/generic/ | head -40

          find bin/targets/rtl9617c/generic -maxdepth 1 -type f \
            -name "*${PROFILE}*" ! -name "*.json" \
            -exec cp -v {} "$OUT/" \;

          ls "$OUT/"*sysupgrade.itb >/dev/null 2>&1 || {
            echo "ERROR: 没有产出 ${PROFILE} 的 sysupgrade.itb" >&2; exit 1; }

          cp .config "$OUT/Config-final.txt"
          echo "$SOURCE_HASH" > "$OUT/source-commit.txt"
          {
            echo "board=$MODEL ($BOARD_NAME)"
            echo "release_id=PT1570-H10-2P5G-CU-sysupgrade"
            echo "artifact_type=sysupgrade"
            echo "profile=$PROFILE"
            echo "dts=$DTS (injected from cu-h10/fw/board/dts, 2p5g baseline @ $SOURCE_HASH)"
            echo "source_ref=$SOURCE_REF"
            echo "source_commit=$SOURCE_HASH"
            echo "abi=ubi_device / factory(8MiB,static) / fit / rootfs_data"
            echo "firmware=sysupgrade.itb (FIT external-static-with-rootfs)"
            echo "bootloader=build-uboot-pt1570-h10-cu.yml (联通本机 mtd0 stock, BL33 replaced)"
            echo "bootloader_factory_size=8388608 (8 MiB static, CU defconfig)"
            echo "factory_image=pt1570-h10-cu-factory.bin (8 MiB, MAC/SN 见本机备份)"
            echo "factory_base_mac=a8:57:ba:53:c7:80"
            echo "factory_pon_sn=YHTCBA53C780"
            echo "lan_ip=192.168.1.1/24 (三机型统一；显式掩码，DHCPv4 必需；首启脚本迁移旧 18.1/2.1)"
            echo "default_wan=pon0.1101 pppoe (XGPON VLAN 1101, PON FE on, 95-pt1570-h10-cu-wan-default)"
            echo "wifi=rtl_ax_ap (2x PCIe WiFi6: 10ec:c852 / 10ec:0192)"
            echo "brickfix=ubi_device writable (CU DTS &qspi /delete-property/ read-only)"
            echo "wififix=PT1570 PE1 single-engine driver overlay (60 files, pe-tx-code.h 4076 words)"
            echo "lanfix=phy@6 C22 RTL8221B + realtek,p6-phy; lan1=2.5G, lan2/lan3/lan4=GE; addr7 C45 disabled"
            echo "p6_serdes=ni0 reg-names p6-serdes + <4 0xf550d000 0 0x1000> + dma-tx/qm-rx (资产保留)"
            echo "p6_mode=${{ inputs.p6_mode || 'bootsafe' }} (bootsafe=realtek,p6-bringup-off 关闭 QX bringup 保证启动 / attempt1g=回移植上游 1G lane 编程的实验版)"
            echo "bootfix=run4 刷入起不来的根因是 ni0 新增 p6-serdes 让 rtl_p6_bringup 真跑 QX 复位+15s 忙等；本版打开驱动原生 realtek,p6-bringup-off 回到 run3 可启动行为"
            echo "upstream_sync=lyq1996/rtl9617c-openwrt HEAD 13ebc89b 与锁定 ref 20b4cf4 分叉(ahead31/behind104)，HEAD 删除 tyfza1-*.dtsi 重写为 ni/ni_p6.c，不能直接切 ref；已逐项回移植 1G lane 编程，fit_do_upgrade/内建 RTL8221B patch 由 CU 现有等价实现覆盖"
            echo "h10_2026_stock=/本机 2026.6 原厂备份逆向资产：2.4G RFE50 iFEM(0x02=0x0000D, 0xFD=0x15027) + 5G RTC7676D 系列；fem_profile=h10_2026_stock 可切换"
            echo "ledfix=OEM低号GPIO (电源 gpio0 11H / 网口 0,1,3,4L) + 98-pt1570-h10-cu-leds; U-Boot run#5 同源"
            echo "fem_profile=${{ inputs.fem_profile || 'yh1570' }} (yh1570=CU 默认表 / ponwrt085=0.8.5 实机 v51 26 表 / generic=v51 回滚 / h10_2026_stock=本机 2026.6 原厂全套)"
            echo "ponwrt085_wifi=power_limit MIB=0, 0xd208/0xd21c vendor limit bits cleared, wifi-scripts txpower ucode patched, 0.8.5 v51 profile shipped"
            echo "wifi_diag=/tmp/pt1570-wifi-diag.txt (开机快照：PCIe 枚举 / ieee80211 phy / rtl_ax_ap dmesg / wireless path)"
            echo "packages=publish_packages=false（固件/WiFi 稳定前暂不产出同批 packages，减少下载量；需要时置 true 重编）"
          } > "$OUT/BUILD_INFO.txt"

          case "$PUBLISH_PACKAGES" in
            false) DO_PACKAGES=0 ;;
            *)     DO_PACKAGES=1 ;;
          esac
          if [ "$DO_PACKAGES" = "1" ]; then
            ROOT="$GITHUB_WORKSPACE/pkgroot"
            rm -rf "$ROOT"
            mkdir -p "$ROOT/targets/rtl9617c/generic/packages" "$ROOT/packages"
            cp -a bin/targets/rtl9617c/generic/packages/. \
                  "$ROOT/targets/rtl9617c/generic/packages/" 2>/dev/null || true
            if [ -d bin/packages ]; then cp -a bin/packages/. "$ROOT/packages/"; fi

            KMOD_N=$(find "$ROOT" -type f -name 'kmod-*.apk' | wc -l)
            APK_N=$(find "$ROOT" -type f -name '*.apk' | wc -l)
            IDX_N=$(find "$ROOT" -type f -name 'packages.adb' | wc -l)
            echo "===== matching packages: kmod=$KMOD_N apk=$APK_N index=$IDX_N ====="
            test "$KMOD_N" -gt 0 || { echo "ERROR: 没有 kmod-*.apk" >&2; exit 1; }
            test "$APK_N"  -gt 0 || { echo "ERROR: 没有 .apk" >&2; exit 1; }
            test "$IDX_N"  -gt 0 || { echo "ERROR: 没有 packages.adb" >&2; exit 1; }

            if [ -f public-key.pem ]; then
              cp public-key.pem "$ROOT/public-key.pem"
            else
              echo "WARN: public-key.pem 缺失，跨批次装包需自行导公钥" >&2
            fi
            {
              echo "# 同批 packages（源码 $SOURCE_REF @ $SOURCE_HASH，架构 aarch64_cortex-a55）"
              echo "# 解包到静态站点根 BASE 后按需写入 /etc/apk/repositories.d/customfeeds.list"
              echo "BASE/targets/rtl9617c/generic/packages/packages.adb"
              find "$ROOT/packages" -name packages.adb -printf '%P\n' 2>/dev/null \
                | sort | sed 's|^|BASE/packages/|' || true
            } > "$ROOT/apk-repos.txt"
            {
              echo "source_ref=$SOURCE_REF"
              echo "source_commit=$SOURCE_HASH"
              echo "target=rtl9617c/generic"
              echo "profile=$PROFILE"
              echo "arch_packages=aarch64_cortex-a55"
              echo "linux=$(grep -m1 '^CONFIG_LINUX_VERSION=' .config || echo unknown)"
              echo "kmods=$KMOD_N apks=$APK_N indexes=$IDX_N"
            } > "$ROOT/BUILD_INFO.txt"

            cd "$GITHUB_WORKSPACE"
            tar --zstd -cf "artifact/PT1570-H10-2P5G-CU-sysupgrade-packages-${{ github.run_number }}.tar.zst" \
                -C "$ROOT" .
            ls -lh "artifact/PT1570-H10-2P5G-CU-sysupgrade-packages-${{ github.run_number }}.tar.zst"
          fi

          cd "$OUT"
          find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%f\n' \
            | sort | xargs sha256sum > sha256sums.txt
          echo "===== artifact ====="
          ls -lh

      - name: Upload firmware
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1570-H10-2P5G-CU-sysupgrade-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ !inputs.test_only && inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: PT1570-H10-2P5G-CU-sysupgrade-${{ github.run_number }}
          name: PT1570-H10-2P5G-CU-sysupgrade (${{ github.run_number }})
          files: artifact/*
          body: |
            Release ID `PT1570-H10-2P5G-CU-sysupgrade`
            源码 lyq1996/rtl9617c-openwrt `${{ env.SOURCE_REF }}` @ `${{ env.SOURCE_HASH }}`
            机型 ${{ env.MODEL }} / profile `${{ env.PROFILE }}` / DTS `${{ env.DTS }}`（2p5g 基线注入）
            布局：factory(8 MiB static) + fit + rootfs_data（统一 UBI 方案），产物 sysupgrade.itb
            配置见 Config-final.txt；校验见 sha256sums.txt
            本版修复：① **run4 刷入后整机起不来**：run3→run4 的 DTS 唯一实质差异是 ni0 新增 7 项 reg/reg-names 里的 `p6-serdes`，它让 `rtl_p6_bringup()` 从直接 return 变成真跑 QXGMII 复位 + 写 `0xf550d000` + 约 15s 等时钟 + 2500M 强制编程；这套 QX 路径只在 PT1500-H10 验证过，在联通 XGPON + 双 WiFi6 板上把启动链打死。本版保留资源但打开驱动原生的 `realtek,p6-bringup-off`，回到 run3 已验证能启动的行为。**先保证机器能启动**；② ubi_device 被标 read-only → 刷入态黑砖（CU DTS 放开该分区写）；③ 上游 rtl_ax_ap PE 引擎坏版 → probe -110（整套替换为 PT1570 单 PE1 驱动）；④ 面板灯按原厂 mtd4 DTB 覆盖回低号 GPIO；⑤ 2.5G/网口4 形态：phy@6 C22 RTL8221B + realtek,p6-phy + lan-phys 四项，禁用电信 C45 addr7；⑥ 整合 PonWRT-TYFZA1 0.8.5 WiFi 功率修复 + `fem_profile=ponwrt085`；⑦ 三机型默认 LAN 统一 `192.168.1.1/24`。
            ⚠️ **2.5G 口本版回到 run3 状态（暂不 link）**。上游 `lyq1996/rtl9617c-openwrt` HEAD `13ebc89b` 与锁定 ref `20b4cf4` 已分叉（ahead 31 / behind 104），HEAD 删除了 `tyfza1-*.dtsi`、重写为 `ni/ni_p6.c` + 内建 RTL8221B patch + `fit_do_upgrade`，直接切 source_ref 会编译失败，所以只逐项回移植：重编时把 `p6_mode` 选 `attempt1g`，会编译期打开 QX bringup、把 15s 忙等降到 300ms、并回移植上游 `f74dc1e59646` 的 1G lane 编程（按 link 速度重载 `p6_serdes_sgmii_1g.txt`）。这是实验版，**单独编译、单独刷，可能仍起不来**，刷前请先确认 bootsafe 版能启动。
            ⚠️ **H10 2026.6 新批次**：按本机原厂 mtd4 备份逆向（不照抄网上拆机图），确认 2.4G 是 `RFE50/iFEM` 无外置 PA/LNA（`RadioA 0x02=0x0000D`、`0xFD=0x15027`），5G 是 `RFE54` 且 FEM 型号为 `RTC7676D` 系列而非 TYFZA1 的 `RTK66587_BPF`；默认管理页 `192.168.18.1` 只是运营商软件定制，不代表硬件拓扑变化。全套 112 张表已作为 `fem_profile=h10_2026_stock` 随镜像附带，可一键 A/B。注意 R10 实机已证明换表不能改 `TRSW/RFM` 前端值（由 rtl_ax_ap 驱动硬编码 TYFZA1 RFE54/eFEM 拓扑），2.4G 前端 iFEM 补丁仍在逆向，本版不含该补丁。
            ⚠️ run3 刷入后「仍完全无无线」本版尚未有实机 dmesg 佐证，因此保留开机诊断快照：登录后执行 `cat /tmp/pt1570-wifi-diag.txt` 回传，即可区分 PCIe 枚举 / mac80211 phy 注册 / PE 启动哪一段卡住。
            本轮 `publish_packages=false`，未产出同批 packages（固件/WiFi 稳定前减少下载量；需要配套 kmod / packages.adb 时置 true 重编，kmod 与固件 vermagic 绑定，须成对使用）。

            ⚠️ 仅适用于 PT1570-H10-CU（1x2.5GE + 3xGE + WiFi6，youhua,pt1570-h10-cu）。
            ⚠️ 刷机前必须已完成：U-Boot Web failsafe 里「重建 UBI」+ 导入 8 MiB factory 镜像。
               必须刷 build-uboot-pt1570-h10-cu.yml 产出的 boot.bin（联通本机 mtd0 作 stock）；
               直接刷电信版 U-Boot 会因 GPT GUID / BL2 / BL31 不匹配而起不来。
               CU defconfig 的 factory 卷定义是 8 MiB，导入镜像必须正好 8 MiB。
            ⚠️ 首次刷机需在恢复页「重建 UBI」后导入 8 MiB factory 镜像，再刷 sysupgrade.itb。
            ⚠️ 本固件 bootargs 不含 root=，挂根由内核 MTD_ROOTFS_ROOT_DEV + fitblk 驱动自设 ROOT_DEV 完成。
            ⚠️ 默认 LAN 192.168.1.1（三机型统一，旧地址自动迁移）；默认 WAN = pon0.1101（XGPON VLAN 1101）PPPoE，
               PON 转发引擎默认打开（pon.pon.offload=1 + flow_offloading_hw=1），
               底层 VLAN 口 MTU 1500。宽带账号需自行填写。


      - name: Save dl cache
        if: ${{ !cancelled() && !inputs.test_only }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/build_wrt/dl
          key: ${{ steps.cachekeys.outputs.DL_KEY }}-${{ github.run_id }}
