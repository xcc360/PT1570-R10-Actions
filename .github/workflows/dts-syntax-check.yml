name: DTS syntax check

# Fast pre-flight for board device tree sources.
#
# The OpenWrt build only reaches dtc during target/linux/install, i.e. after
# ~45 minutes of full firmware compilation. A malformed board .dts therefore
# costs a whole build cycle to discover. This job parses the board DTS with
# the same cpp + dtc invocation the kernel build uses, and finishes in about
# a minute.
#
# The refactor dtsi deliberately carries no /dts-v1/ marker, so each board
# DTS must declare it itself; this job is what catches that class of error.

on:
  workflow_dispatch:
    inputs:
      dts:
        description: 'DTS to parse (path inside this repository)'
        default: 'refactor/dts/rtl9617c-pt1570-h10-cu.dts'
        required: false
      upstream_dts:
        description: 'Optional upstream DTS to parse with the same dtsi (control)'
        default: ''
        required: false

jobs:
  dtc:
    name: dtc parse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assets
        uses: actions/checkout@v4
        with:
          # The board DTS lives on the feature branch; this is the exact
          # asset the firmware build consumes.
          ref: feature/pt1570-h10-cu-refactor

      - name: Install device-tree-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler

      - name: Fetch dtsi and dt-bindings
        run: |
          set -eu
          mkdir -p work/dts \
                   work/include/dt-bindings/interrupt-controller \
                   work/include/dt-bindings/gpio \
                   work/include/dt-bindings/input \
                   work/include/uapi/linux
          curl -sSfL --retry 3 --retry-delay 2 \
               https://raw.githubusercontent.com/lyq1996/rtl9617c-openwrt/refactor/target/linux/rtl9617c/dts/rtl9617c.dtsi \
               -o work/dts/rtl9617c.dtsi
          base=https://raw.githubusercontent.com/torvalds/linux/v6.18/include
          curl -sSfL --retry 3 --retry-delay 2 "$base/dt-bindings/interrupt-controller/arm-gic.h" \
               -o work/include/dt-bindings/interrupt-controller/arm-gic.h
          curl -sSfL --retry 3 --retry-delay 2 "$base/dt-bindings/interrupt-controller/irq.h" \
               -o work/include/dt-bindings/interrupt-controller/irq.h
          curl -sSfL --retry 3 --retry-delay 2 "$base/dt-bindings/gpio/gpio.h" \
               -o work/include/dt-bindings/gpio/gpio.h
          # dt-bindings/input/linux-event-codes.h is a symlink in the kernel
          # tree; mirror the real file and recreate the link.
          curl -sSfL --retry 3 --retry-delay 2 "$base/uapi/linux/input-event-codes.h" \
               -o work/include/uapi/linux/input-event-codes.h
          ln -sf ../../uapi/linux/input-event-codes.h \
                 work/include/dt-bindings/input/linux-event-codes.h
          cp '${{ inputs.dts }}' work/dts/board.dts
          if [ -n '${{ inputs.upstream_dts }}' ]; then
            curl -sSfL --retry 3 --retry-delay 2 "${{ inputs.upstream_dts }}" -o work/dts/upstream.dts
          fi

      - name: Parse board DTS
        run: |
          set -eu
          cpp -nostdinc -I work/dts -I work/include -undef -D__DTS__ \
              -x assembler-with-cpp -o work/board.pp work/dts/board.dts
          dtc -i work/dts -O dtb \
              -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size \
              -o work/board.dtb work/board.pp
          dtc -O dts work/board.dtb > work/board.decompiled.dts
          echo "DTC_OK board=${{ inputs.dts }} lines=$(wc -l < work/board.decompiled.dts)"

      - name: Parse upstream control DTS
        if: ${{ inputs.upstream_dts != '' }}
        run: |
          set -eu
          cpp -nostdinc -I work/dts -I work/include -undef -D__DTS__ \
              -x assembler-with-cpp -o work/upstream.pp work/dts/upstream.dts
          dtc -i work/dts -O dtb \
              -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size \
              -o work/upstream.dtb work/upstream.pp
          echo "DTC_OK upstream=${{ inputs.upstream_dts }}"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dtc-check-${{ github.run_number }}
          path: |
            work/board.decompiled.dts
            work/board.pp
          retention-days: 3
          if-no-files-found: ignore
