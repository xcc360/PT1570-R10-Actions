# SPDX-License-Identifier: MIT
# PonWRT / PT1500-H10 2.5G（youhua,pt1500-h10-2p5g）/ 统一 UBI 方案云编译
#
# 这是与 build-pt1570-fit.yml（PT1570-R10）完全隔离的独立 workflow：
#   * 不改动 R10 的任何文件、不共用 matrix、不共用 concurrency group；
#   * 后期两机型合并时，把公共段抽成可复用 composite action 即可。
#
# 机型事实（2026-11-14 实机核对，全部以设备实测为准）：
#   * U-Boot：lyq1996/rtl9617c-uboot @ 3a709714e551（2026-11-10 版，
#     pt1500-h10-2p5g_defconfig），不是 main 分支的 a9d26b0f。
#   * /api/info 的 board_data 明确写 factory size = 8388608（8 MiB static）。
#     恢复页「镜像大小必须与定义完全一致」的硬校验只认 8 MiB；
#     64 KiB 是新版 U-Boot 的布局，不适用于本机，别拿 64K 产物来刷。
#   * factory 卷已重建并写入，从设备读回 8 MiB 与本地
#     p1500-h10-factory.bin 逐字节一致（sha256 08cf837e...），
#     base MAC fc:34:e2:69:1b:7a / PON SN YHTCE2691B7A 均在。
#   * U-Boot 的 factory 卷定义为 8 MiB static；refactor DTS 的 ubi-volume-factory
#     通过 nvmem-layout 从该卷读 MAC/SN/校准（不再有 base 的 fpga-image@10000 节点），
#     卷大小与 U-Boot 布局匹配，无需 patch DTS。
#
# 布局：factory(8 MiB static) + fit + rootfs_data，产物 sysupgrade.itb
#       （FIT external-static-with-rootfs）。
#
# ★★★ 2026-11-17 第二次升级：refactor HEAD b5025a9d1c95 -> 659700cc1bbc ★★★
#   上游 4 个新提交：659700cc1bbc (harden OMCI handling and PON bring-up)、
#   f076437fb4d5 (hand flow offload back to firewall) + 两个 revert。
#   2.5G 架构零变化，且 run#6（b5025a9d1c95）已实机确认 2.5G 可用 —— 本次升级
#   同时修掉实机暴露的两个问题：
#     * 面板灯全错：上游 PT1500 DTS 的 leds GPIO 编号没按原厂 5-bank 换算，
#       8 个灯错 7 个（PWR_G 还抢占了原厂 LOS 的脚）。-> 新增
#       scripts/apply-dts-leds-fix.sh，按原厂 DTB flat 编号覆盖。
#     * XGPON 认证失败 / LuCI 报"设备初始化失败"：上游 config/pon 硬编码
#       `option mode 'epon-d10g'`（PT1500 EPON profile），而本机走 XGPON 线路；
#       驱动按 mode 选 serdes 表并分流 offload 路径，走错分支则 OMCI 通道不建立。
#       -> apply-board-h10.sh 在编译期把 mode 纠正为 xgpon，95 脚本首启再纠一次。
#   上游本次还删除了 90-pon-wan / 91-pon-offload / 97-rtl9617c-argon-default
#   —— WAN provisioning 收进 Rust pon daemon、offload 交回 firewall。
#   故 WAN/VLAN/PPPoE/PON FE 全部改由 files-h10 的 95 脚本负责，
#   断言改为「校验仍存在的 + 反向校验已删的确实不存在」。
#   注：89-rtl9617c-lan-ports **没被删**，只是形态变了 —— 上游把 rename-netdevs.uc
#   直接安装成 89（Makefile install 段），旧 HEAD 才是"包装脚本 + 单独装 uc"。
#
# ★★★ 2026-11-17 第一次重大变更：源码基线从 base 20b4cf4 整体切到 refactor ★★★
#   依据：网友 lyq1996 本机编译的 refactor 固件
#   （r36946+24-79bc56cb74）实机 2.5G 可用，而 base 20b4cf4 自编译固件 2.5G 不可用。
#   二进制比对确认两条铁证：
#     * 内核符号：refactor 有 rtl8221b_hisgmii / rtl9617c_serdes / rtl_ni_p6_set_interface；
#       base 只有 rtl8221b_tyfza1 / rtl_p6_set_speed（固定 SGMII，read_status 不切接口）。
#     * DTB：refactor 的 phy@6 带 realtek,hisgmii + serdes-option-mode、独立 serdes PHY 节点、
#       port@6 phy-mode=2500base-x；base 是 realtek,hsgmii + /etc/serdes/*.txt 文件加载。
#   详见 PT1500-H10-2.5G两固件二进制比对-根因锁定与方案-20261117.md。
#
# refactor 自带完整 H10 2p5g profile / DTS / 2.5G 驱动 / platform.sh 白名单 /
#       89+94-97-rtl9617c-* 首启脚本，本 workflow 不注入任何驱动/DTS/patch，
#       scripts/apply-board-h10.sh 退化为纯断言（防止上游改版把 2.5G 悄悄回退）：
#         1. 断言机型定义齐全；
#         2. 断言 2.5G HisGMII/SerDes/2500base-x 驱动与 DTS 特征齐全；
#         3. 断言 config-6.18 的 2.5G 驱动符号齐全；
#         4. 断言 rtl9617c-* 命名（非 tyfza1-*）的 WAN / 首启脚本齐全。
#   base 旧基线的 pt1500-fip.sh 移除 / tyfza1-factory 修补 / CI_KERNPART=fit +
#   zz 覆盖脚本 —— 在 refactor 下全部作废（无这些文件、升级走标准 fit_do_upgrade）。
#
# 与 R10 的关键差异（2.5G 版无 WiFi）：
#   * 不带 kmod-rtl-ax-ap / wpad-* / wireless-regdb / WiFi AP 固件 / RFE54 参数表；
#   * 不跑 patch-wifi-diag.sh / overlay-wifi-driver.sh / patch-upstream.sh；
#   * 不带 R10 的 99-pt1570-fit 与 95-pt1570-wan-default（那是 R10 的 board_name）；
#     网口、LED、br-lan MAC 由 refactor 的 89-rtl9617c-lan-ports（rename-netdevs.uc）
#     与 DTS nvmem（base_mac）处理；
#   * 带 H10 专用 95-pt1500-h10-wan-default（files-h10/etc/uci-defaults/）：
#     默认 WAN（上游 90-pon-wan 已删除，WAN 全部由本脚本负责）：
#     VLAN 1101 + 8021q 子设备（mtu 1500）+ PPPoE + PON FE on + LAN 统一 +
#     PON mode 纠正为 xgpon（首启再纠一次，防 sysupgrade 保留旧配置）；
#   * 只复用机型无关的通用修复：apk 源/公钥、argon rpcd 插件（LF+0755）、
#     92-pt1570-rpcd-eol 兜底、verify-fit-boot.py。
#     zz-pt1570-sysupgrade.sh 在 refactor 下不再需要（用标准 fit_do_upgrade）。
#
# 三机型统一默认 LAN IP = 192.168.1.1/24（2026-11-15 用户要求）：
# PT1570-R10 / PT1570-H10-CU / PT1500-H10 全部一致。旧 192.168.2.1 由
# files-h10 的 95-pt1500-h10-wan-default 在首启时自动迁移并补 /24。
# 调试时三台不要同时接同一网段，按 MAC 绑定网卡区分。
#
# 2.5G 口（refactor 架构，已实机验证可用）：rtl9617c-pt1500-h10-2p5g.dts 里
#   phy@6 带 realtek,hisgmii + serdes-option-mode=<1>，NI port@6 走 phy-mode=2500base-x
#   + phys=<&serdes>，配套 HisGMII PHY 驱动 + 独立 SerDes PHY + patch 700-730。
#   Configure 段加了防回退断言：上游 ref 一变导致这些 hisgmii/serdes 特征被删、
#   或串回 base 的 realtek,hsgmii/p6-serdes，都会直接编译失败。
#   历史：base 20b4cf4 用固定 SGMII + read_status 不切接口，2.5G 不可用；
#   CU 侧 attempt1g（QX 复位）曾把整机启动打死——refactor 是上游重写后的正解。
# 本机不需要补 DTS/驱动，也不需要动 U-Boot。
#
# Actions 运行时：checkout@v5 / upload-artifact@v6 / action-gh-release@v3。
# 同批 packages：kmod 绑定本次内核 vermagic，必须与固件成对产出、成对使用。

# 统一命名 ID: PT1500-H10-2P5G-CT-sysupgrade
#   规则 <型号>-<网口>-<运营商>-<产物类型>（uboot / sysupgrade）。
#   仅作用于展示层：workflow / job / artifact / release / packages / BUILD_INFO。
#   机器层 PROFILE / BOARD_NAME / DTS / SUPPORTED_DEVICES / Config target 符号
#   一律不动（uci-defaults 门控与 sysupgrade 白名单依赖它们），workflow 文件名
#   也保留，避免 GitHub 按路径重建 workflow、丢失 run 历史。
name: PT1500-H10-2P5G-CT-sysupgrade

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'lyq1996/rtl9617c-openwrt 的 commit / 分支（默认 refactor HEAD d8f2e9522063，与 PT1570-H10-CU 同步；2.5G 正解架构 + OMCI/PON 加固）'
        required: false
        default: 'd8f2e9522063'
        type: string
      test_only:
        description: '只生成并上传 .config / 校验报告，不编译'
        required: false
        default: false
        type: boolean
      create_release:
        description: '发布到 GitHub Release'
        required: false
        default: false
        type: boolean
      publish_packages:
        description: '同期收集并发布配套 packages（kmod + packages.adb + 公钥）；固件/2.5G 稳定前默认关闭，只出固件，需要时手动置 true'
        required: false
        default: false
        type: boolean
      packages_repo_url:
        description: '可选：自建 packages 静态源根 URL，随固件写入 customfeeds.list'
        required: false
        default: ''
        type: string
      apk_mirror_base:
        description: '可选：覆盖内置 apk 源（默认北大镜像 immortalwrt 25.12-SNAPSHOT 的 aarch64_cortex-a53 目录，公钥随镜像）。留空即用内置地址'
        required: false
        default: ''
        type: string
      apk_repo_key_url:
        description: '可选：外部 apk 源公钥 URL'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: pt1500-h10-2p5g-ct-sysupgrade-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    name: PT1500-H10-2P5G-CT-sysupgrade / build
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        # 独立 workflow：只编 H10。R10 在另一个 workflow 里，互不干扰。
        board: [h10]

    steps:
      - name: Checkout build assets
        uses: actions/checkout@v5

      # 防呆：任何把 R10 或第二个机型加回 matrix 的改动都会在这里失败。
      - name: Guard H10-only
        env:
          BOARD: ${{ matrix.board }}
        run: |
          [ "$BOARD" = "h10" ] || {
            echo "ERROR: 本 workflow 只编 H10，收到 board=$BOARD" >&2; exit 1; }
          WF="$GITHUB_WORKSPACE/.github/workflows/build-pt1500-h10.yml"
          LINE=$(grep -E '^[[:space:]]*board: \[' "$WF" | tr -d '[:space:]')
          [ "$LINE" = "board:[h10]" ] || {
            echo "ERROR: matrix board 行不是 [h10]：'$LINE'" >&2; exit 1; }
          echo "H10_ONLY_GUARD_OK=True board=$BOARD matrix=$LINE"

      - name: Resolve board parameters
        env:
          BOARD: ${{ matrix.board }}
        run: |
          case "$BOARD" in
            h10)
              echo "PROFILE=youhua_pt1500_h10_2p5g"      >> "$GITHUB_ENV"
              echo "BOARD_NAME=youhua,pt1500-h10-2p5g"  >> "$GITHUB_ENV"
              echo "DTS=rtl9617c-pt1500-h10-2p5g"       >> "$GITHUB_ENV"
              echo "MODEL=PT1500-H10-2p5G"              >> "$GITHUB_ENV"
              ;;
            *) echo "ERROR: H10 workflow 不接受 board=$BOARD" >&2; exit 1 ;;
          esac
          echo "board=$BOARD profile=youhua_pt1500_h10_2p5g dts=rtl9617c-pt1500-h10-2p5g"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get clean
          df -h /
          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt
          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"
          df -h /mnt

      - name: Install build dependencies
        # 与 R10 相同：包含 clang-18 / ld.lld-18 / llvm-objcopy-18，
        # target/linux/rtl9617c/pe/Makefile 硬编码它们编译 MIPS32 裸机 PE 程序。
        # refactor 的 rtl9617c-pon-control（Rust）需要 host rustup 补 aarch64-unknown-linux-musl std。
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang clang-18 cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld lld-18 llvm llvm-18 ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          if command -v rustup >/dev/null 2>&1; then
            rustup target add aarch64-unknown-linux-musl
            rustup target list --installed
          else
            echo "::error::runner 缺 rustup，无法补 aarch64-unknown-linux-musl std" >&2
            exit 1
          fi

      - name: Clone rtl9617c-openwrt source
        run: |
          set -e
          # 2026-11-17 基线切到 refactor（2.5G 正解架构，实机验证可用）
          REF="${{ inputs.source_ref || 'd8f2e9522063' }}"
          cd /mnt/build_wrt
          git init -q
          git remote add origin https://github.com/lyq1996/rtl9617c-openwrt.git
          if ! git fetch -q --depth=1 origin "$REF"; then
            echo "WARN: 按 commit 拉取失败，回退到 refactor 分支 HEAD" >&2
            git fetch -q --depth=1 origin refactor
          fi
          git checkout -q FETCH_HEAD
          echo "SOURCE_HASH=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$REF"                   >> "$GITHUB_ENV"
          echo "--- target (refactor 布局) ---"
          test -f target/linux/rtl9617c/image/Makefile
          # refactor 无 tyfza1.dtsi / rtl8221b-tyfza1.h（那是 base 旧架构）
          test -f target/linux/rtl9617c/dts/rtl9617c-pt1500-h10-2p5g.dts
          test -f target/linux/rtl9617c/files-6.18/drivers/net/phy/realtek/realtek_hisgmii.c
          test -f target/linux/rtl9617c/files-6.18/drivers/phy/realtek/phy-rtl9617c-serdes.c
          test -f package/utils/fitblk/files/fit.sh
          echo "source: $(git rev-parse HEAD)"

      - name: Build PE firmware (pe-tx-code.h) [base-only; skipped on refactor]
        # PE 固件（rtl_ax_ap / pe-tx-code.h）是 base 20b4cf4 基线的 WiFi 残留物。
        # refactor HEAD b5025a9d1c95 的 rtl9617c target 是纯 2.5G 无 WiFi：
        #   树里既没有 target/linux/rtl9617c/pe，也没有 rtl_ax_ap/ 驱动目录，
        #   RUN #5 就是死在 make -C .../pe (No such file or directory)。
        # 因此改为条件式：仅当源码树确有 pe/Makefile 才构建（兼容回退到 base）；
        # refactor 下直接跳过，不把 WiFi 驱动带进镜像。
        working-directory: wrt
        run: |
          set -eo pipefail
          if [ ! -f target/linux/rtl9617c/pe/Makefile ]; then
            echo "PE_SKIPPED=True (refactor baseline: no target/linux/rtl9617c/pe, no WiFi)"
            exit 0
          fi
          echo "=== PE toolchain (base baseline only) ==="
          for t in clang-18 ld.lld-18 llvm-objcopy-18 python3; do
            if ! command -v "$t" >/dev/null 2>&1; then
              echo "::error::PE 构建缺少工具 $t" >&2
              exit 1
            fi
            printf '  OK   %-20s %s\n' "$t" "$(command -v "$t")"
          done
          if ! make -C target/linux/rtl9617c/pe 2>&1 | tee /tmp/pe-build.log; then
            echo "::group::PE BUILD FAILED - last 60 lines"
            tail -n 60 /tmp/pe-build.log
            echo "::endgroup::"
            echo "::error::make -C target/linux/rtl9617c/pe 失败，pe-tx-code.h 未生成"
            exit 1
          fi
          HDR=target/linux/rtl9617c/files-6.18/drivers/net/wireless/realtek/rtl_ax_ap/pe-tx-code.h
          test -s "$HDR" || { echo "::error::pe-tx-code.h 未生成或为空"; exit 1; }
          grep -q 'static const u32 pe_tx_program\[\]' "$HDR" \
            || { echo "::error::pe-tx-code.h 内容不符"; exit 1; }
          echo "PE_HEADER_OK=True bytes=$(wc -c < "$HDR")"

      - name: Pin APK signing key (optional)
        working-directory: wrt
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -n "$APK_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$APK_SIGNING_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
            echo "APK build key pinned:"; sha256sum public-key.pem
          else
            echo "no APK_SIGNING_KEY: ephemeral key; firmware + packages of THIS run trust each other only"
          fi

      - name: Update and install feeds
        working-directory: wrt
        run: |
          LOG="$GITHUB_WORKSPACE/step-feeds.log"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1
          trap '
            rc=$?
            if [ "$rc" -ne 0 ]; then
              sleep 1
              echo "::group::FEEDS STEP FAILED (exit $rc) - last 80 lines"
              tail -n 80 "$LOG"
              echo "::endgroup::"
              last_step=$(grep "^STEP:" "$LOG" | tail -n 1)
              echo "::error::失败前最后进度: ${last_step:-未知}"
              grep -E "fatal:|error:|Error [0-9]|ERROR|No such file|not found|Failed|failed|denied|timed out|refusing" "$LOG" \
                | grep -v "::error::" | tail -n 6 | tr -d "\r" | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "::error::Update and install feeds 失败 (exit $rc)"
            fi
          ' EXIT

          echo "STEP: feeds update -a"
          ./scripts/feeds update -a
          echo "STEP: feeds install -a"
          ./scripts/feeds install -a
          echo "STEP: fix feed file permissions"
          # rpcd 会拒绝 world-writable 的 ucode handler
          chmod -R go-w feeds/luci feeds/packages 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/ucode/*' -type f -exec chmod 0755 {} + 2>/dev/null || true
          find feeds/luci -path '*/root/usr/share/rpcd/acl.d/*.json' -type f -exec chmod 0644 {} + 2>/dev/null || true
          # luci-app-argon-config / luci-theme-argon 带的是 CRLF（#!/bin/sh\r）+ 0644，
          # rpcd exec 插件一个都加载不了 → 主题设置页 luci.argon/avail -32000。
          # feed 源码先归一化一次，最终由 files-h10 overlay + 产物断言兜底。
          find feeds -path '*/root/usr/libexec/rpcd/*' -type f -print 2>/dev/null | while IFS= read -r f; do
            [ "$(head -c 2 "$f" 2>/dev/null)" = '#!' ] || continue
            tr -d '\r' < "$f" > "$f.lf" && cat "$f.lf" > "$f" && rm -f "$f.lf"
            chmod 0755 "$f"
          done || true
          echo "  OK   rpcd exec 插件：CRLF 归一化 + 0755"

      - name: Apply H10 board fixes (PON mode + panel LED GPIO)
        env:
          ASSETS: ${{ github.workspace }}
          WRT: ${{ github.workspace }}/wrt
        run: bash "$GITHUB_WORKSPACE/scripts/apply-board-h10.sh"

      - name: Apply custom rootfs files (files-h10)
        env:
          PACKAGES_REPO_URL: ${{ inputs.packages_repo_url }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/wrt/files"
          if [ -d "$GITHUB_WORKSPACE/files-h10" ]; then
            cp -a "$GITHUB_WORKSPACE/files-h10/." "$GITHUB_WORKSPACE/wrt/files/"
            # refactor 走标准 fit_do_upgrade，base 的 zz 覆盖脚本不再需要，别注入镜像
            rm -f "$GITHUB_WORKSPACE/wrt/files/lib/upgrade/zz-pt1570-sysupgrade.sh"
            chmod +x "$GITHUB_WORKSPACE/wrt/files/etc/uci-defaults/"* 2>/dev/null || true
            # rpcd exec 插件必须可执行，否则 rpcd 不加载，luci.argon* 对象不注册
            chmod +x "$GITHUB_WORKSPACE/wrt/files/usr/libexec/rpcd/"* 2>/dev/null || true
            echo "H10 custom rootfs files injected:"
            find "$GITHUB_WORKSPACE/files-h10" -type f -printf '  %P\n'
          fi
          if [ -n "$PACKAGES_REPO_URL" ]; then
            URL="${PACKAGES_REPO_URL%/}"
            mkdir -p "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d"
            {
              echo '# 本次固件同批编译的 packages 源（由 workflow 注入）'
              echo "$URL/targets/rtl9617c/generic/packages/packages.adb"
            } > "$GITHUB_WORKSPACE/wrt/files/etc/apk/repositories.d/customfeeds.list"
            echo "custom packages repo: $URL/targets/rtl9617c/generic/packages/packages.adb"
          fi

      - name: Configure
        working-directory: wrt
        env:
          ASSETS: ${{ github.workspace }}
          APK_MIRROR_BASE: ${{ inputs.apk_mirror_base }}
          APK_REPO_KEY_URL: ${{ inputs.apk_repo_key_url }}
        run: |
          set -e
          # ⚠️ 顺序敏感（R10 run #10 根因，同样适用于本 target）：
          #   绝不能在空 .config 上先跑 make defconfig。上游 target-metadata.pl
          #   把 Target System choice 硬编码为 default TARGET_mediatek，空配置
          #   defconfig 会选中 mediatek/filogic 默认机型 openwrt_one，把它的包集
          #   写成显式用户选择；切到 rtl9617c 后残留的 kmod-mac80211/cfg80211
          #   会与平台自带的 cfg80211.ko 互相覆盖（package/install Error 1）。
          #   正确顺序：先写最小配置（target + 机型 + 包断言），再 defconfig。
          rm -f .config
          cat "$GITHUB_WORKSPACE/Config-PT1500-H10.txt" >> .config
          bash "$GITHUB_WORKSPACE/customize-h10.sh"

          # uboot-envtools 的 host fw_printenv 在此 target 会挂，必须保持关闭
          sed -i 's|^CONFIG_PACKAGE_uboot-envtools=y|# CONFIG_PACKAGE_uboot-envtools is not set|' .config

          make defconfig
          cat "$GITHUB_WORKSPACE/Config-PT1500-H10.txt" >> .config
          make defconfig

          # defconfig 会静默丢掉未被 profile 点名的包，重新断言后再次 defconfig
          # refactor 包名：rtl9617c-pon-control / luci-app-rtl9617c-pon（非 tyfza1-*）
          for sym in rtl9617c-pon-control luci-app-rtl9617c-pon luci-ssl uhttpd fitblk \
                     luci-theme-argon; do
            if ! grep -q "^CONFIG_PACKAGE_${sym}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${sym} is not set$/d; /^CONFIG_PACKAGE_${sym}=/d" .config
              echo "CONFIG_PACKAGE_${sym}=y" >> .config
              echo "  re-asserted $sym"
            fi
          done
          make defconfig

          # 用户软件包基线（沿用 R10：tailscale 三件套），由 Config-PT1500-H10.txt
          # 直接写入；两次 defconfig 可能降级，这里统一重新断言再检查。
          echo "===== user-requested packages (tailscale baseline) ====="
          USER_PKGS="tailscale luci-app-tailscale-community \
                     luci-i18n-tailscale-community-zh-cn"
          for p in $USER_PKGS; do
            if ! grep -q "^CONFIG_PACKAGE_${p}=y$" .config; then
              sed -i "/^# CONFIG_PACKAGE_${p} is not set$/d; /^CONFIG_PACKAGE_${p}=/d" .config
              echo "CONFIG_PACKAGE_${p}=y" >> .config
              echo "  re-asserted $p"
            fi
          done
          make defconfig
          for p in $USER_PKGS; do
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config \
              || { echo "ERROR: $p 未启用（feed 里找不到该包，或依赖不满足被降级）" >&2; exit 1; }
            echo "  OK   $p"
          done

          echo "===== hard assertions ====="
          grep -q "^CONFIG_TARGET_rtl9617c_generic_DEVICE_${PROFILE}=y$" .config \
            || { echo "ERROR: profile $PROFILE 未启用" >&2; exit 1; }
          for sym in rtl9617c-pon-control luci-app-rtl9617c-pon luci-ssl uhttpd fitblk \
                     luci-theme-argon; do
            grep -q "^CONFIG_PACKAGE_${sym}=y$" .config \
              || { echo "ERROR: $sym 二次 defconfig 后仍被丢弃" >&2; exit 1; }
            echo "  OK   $sym"
          done
          grep -q '^# CONFIG_PACKAGE_uboot-envtools is not set$' .config \
            || { echo "ERROR: uboot-envtools 必须关闭" >&2; exit 1; }
          echo "  OK   uboot-envtools disabled"

          # FIT rootfs 挂根依赖两个内核符号（不能写顶层 .config，会被 defconfig 丢弃）
          grep -q '^CONFIG_UIMAGE_FIT_BLK=y$' target/linux/rtl9617c/config-6.18 \
            || { echo "ERROR: target config-6.18 缺少 CONFIG_UIMAGE_FIT_BLK=y" >&2; exit 1; }
          echo "  OK   CONFIG_UIMAGE_FIT_BLK (target config)"
          grep -q '^CONFIG_MTD_ROOTFS_ROOT_DEV=y$' target/linux/generic/config-6.18 \
            || { echo "ERROR: generic config-6.18 缺少 CONFIG_MTD_ROOTFS_ROOT_DEV=y" >&2; exit 1; }
          echo "  OK   CONFIG_MTD_ROOTFS_ROOT_DEV (generic config)"

          # refactor 2.5G 驱动必须编进内核（比 base 多三个 HisGMII/SerDes 符号）
          for sym in CONFIG_REALTEK_PHY_HISGMII CONFIG_PHY_RTL9617C_SERDES \
                     CONFIG_MDIO_REALTEK_RTL9617C CONFIG_RTL9617C_NI; do
            grep -q "^${sym}=y$" target/linux/rtl9617c/config-6.18 \
              || { echo "ERROR: target config-6.18 缺 $sym=y（2.5G 驱动没编进内核）" >&2; exit 1; }
            echo "  OK   $sym (2.5G refactor 驱动)"
          done

          # ★ 2026-11-17 基线升到 659700cc1bbc 后，上游删除了 90-pon-wan /
          #   91-pon-offload（WAN provisioning 收进 Rust pon daemon，offload 交回
          #   firewall）。因此 WAN/VLAN/PPPoE/PON FE 全部由我们的 95 脚本负责。
          #   这里做反向断言（上游确实没有这两个脚本）+ 校验 95 脚本的关键项。
          UCI_SRC=target/linux/rtl9617c/base-files/etc/uci-defaults
          [ ! -f "$UCI_SRC/90-pon-wan" ] \
            || { echo "ERROR: 上游 90-pon-wan 复活，需复核两套 WAN 逻辑是否冲突" >&2; exit 1; }
          [ ! -f "$UCI_SRC/91-pon-offload" ] \
            || { echo "ERROR: 上游 91-pon-offload 复活，需复核 offload 策略" >&2; exit 1; }
          H10WAN="$GITHUB_WORKSPACE/files-h10/etc/uci-defaults/95-pt1500-h10-wan-default"
          test -f "$H10WAN" || { echo "ERROR: 缺 H10 WAN/FE 修复脚本 95-pt1500-h10-wan-default" >&2; exit 1; }
          bash -n "$H10WAN" || { echo "ERROR: 95-pt1500-h10-wan-default 语法错误" >&2; exit 1; }
          for kw in 'wan_vlan=1101' 'mtu=1500' "offload='1'" 'flow_offloading_hw' 'type=8021q'; do
            grep -qF "$kw" "$H10WAN" || { echo "ERROR: H10 WAN 脚本缺关键项 $kw" >&2; exit 1; }
          done
          # PON mode 必须是 xgpon（本机为 XGPON 线路；上游默认 epon-d10g 已被纠正）
          grep -q "option mode 'xgpon'" \
            "$GITHUB_WORKSPACE/wrt/package/rtl9617c/rtl9617c-pon-control/files/etc/config/pon" \
            || { echo "ERROR: 上游 pon config 的 mode 未纠正为 xgpon" >&2; exit 1; }
          # 95 脚本必须带 mode 纠正逻辑（防 sysupgrade 保留旧配置时 mode 仍是错的）
          grep -qF "pon.pon.mode" "$H10WAN" \
            || { echo "ERROR: 95 脚本缺 PON mode 纠正逻辑" >&2; exit 1; }
          grep -qF "uci -q set pon.pon.mode='xgpon'" "$H10WAN" \
            || { echo "ERROR: 95 脚本未把 PON mode 设为 xgpon" >&2; exit 1; }
          echo "  OK   默认 WAN=pon0.1101（95 脚本负责），PON mode=xgpon"

          grep -q "SUPPORTED_DEVICES += ${BOARD_NAME}" target/linux/rtl9617c/image/Makefile \
            || { echo "ERROR: image/Makefile 缺少 SUPPORTED_DEVICES" >&2; exit 1; }
          grep -q "$BOARD_NAME" target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: platform.sh 白名单缺少 $BOARD_NAME" >&2; exit 1; }
          grep -q 'fit_do_upgrade' target/linux/rtl9617c/base-files/lib/upgrade/platform.sh \
            || { echo "ERROR: platform.sh 未走标准 fit_do_upgrade（refactor 基线特征）" >&2; exit 1; }
          test -f "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: DTS 缺失" >&2; exit 1; }
          grep -q 'volname = "fit"' "target/linux/rtl9617c/dts/${DTS}.dts" \
            || { echo "ERROR: DTS 缺少 volname=fit 的 UBI 卷" >&2; exit 1; }
          echo "  OK   DTS=$DTS board_name=$BOARD_NAME FIT/UBI 布局"

          # ---- 2.5G HisGMII/SerDes 资产防回退断言（refactor 正解架构）----
          # 这是本次切基线的核心：确保上游 ref 一变就把 2.5G 改回 bad base 时
          # 立即编译失败，而不是又产出一个 2.5G 不通的固件。
          UP_DTS="target/linux/rtl9617c/dts/${DTS}.dts"
          for kw in 'realtek,hisgmii' 'realtek,serdes-option-mode' \
                    'phy-mode = "2500base-x"' 'ethernet-phy@6' 'phys = <&serdes>'; do
            grep -qF "$kw" "$UP_DTS" \
              || { echo "ERROR: refactor DTS 缺 2.5G 特征 $kw（可能被改回 base 架构，请勿乱改 source_ref）" >&2; exit 1; }
          done
          # 反向：base 旧特征一旦出现说明基线串了
          for kw in 'realtek,hsgmii' 'realtek,p6-phy' 'fpga-image@10000'; do
            grep -qF "$kw" "$UP_DTS" \
              && { echo "ERROR: DTS 残留 base 旧架构特征 $kw（基线串回 20b4cf4？）" >&2; exit 1; } || true
          done
          DRV=target/linux/rtl9617c/files-6.18/drivers
          for f in "$DRV/net/phy/realtek/realtek_hisgmii.c" \
                   "$DRV/phy/realtek/phy-rtl9617c-serdes.c" \
                   "$DRV/net/ethernet/realtek/rtl9617c/ni/ni_p6.c"; do
            test -s "$f" || { echo "ERROR: refactor 2.5G 驱动缺失 $f" >&2; exit 1; }
          done
          echo "  OK   2.5G 架构：HisGMII + SerDes PHY + 2500base-x + ni_p6 齐全"

          # 三机型统一默认 LAN 192.168.1.1/24
          grep -qF 'WRT_IP="${WRT_IP:-192.168.1.1}"' \
            "$GITHUB_WORKSPACE/customize-h10.sh" \
            || { echo "ERROR: customize-h10.sh 默认 IP 不是 192.168.1.1" >&2; exit 1; }
          grep -qF "uci -q set network.lan.ipaddr='192.168.1.1/24'" \
            "$GITHUB_WORKSPACE/files-h10/etc/uci-defaults/95-pt1500-h10-wan-default" \
            || { echo "ERROR: 首启脚本未统一 LAN 到 192.168.1.1/24" >&2; exit 1; }
          echo "  OK   LAN 192.168.1.1/24（三机型统一）"

          # refactor 首启脚本在 package/rtl9617c 下（rtl9617c-* 命名），
          # 且绝不能混入 R10 的 99-pt1570-fit / 95-pt1570-wan-default。
          # ★ 2026-11-17 基线 659700cc1bbc：上游删除了 89-rtl9617c-lan-ports
          #   （rename-netdevs.uc 的包装脚本）与 97-rtl9617c-argon-default，
          #   所以这里只校验仍然存在的三个，并反向确认被删的两个确实已删。
          PKG_UCI=package/rtl9617c
          for s in 94-rtl9617c-cpu 95-rtl9617c-argon 96-rtl9617c-rpcd-perms; do
            found=0
            for f in "$PKG_UCI"/*/files/etc/uci-defaults/"$s" \
                     "$PKG_UCI"/*/root/etc/uci-defaults/"$s"; do
              [ -f "$f" ] && { found=1; break; }
            done
            [ "$found" = 1 ] || { echo "ERROR: refactor 首启脚本缺失：$s" >&2; exit 1; }
          done
          # rename-netdevs.uc 本体与 pon-leds 必须在（网卡重命名 + LOS/PON 灯驱动）
          test -f "$PKG_UCI/rtl9617c-pon-control/files/usr/share/rtl9617c/rename-netdevs.uc" \
            || { echo "ERROR: refactor rename-netdevs.uc 缺失" >&2; exit 1; }
          test -f "$PKG_UCI/rtl9617c-pon-control/files/etc/init.d/pon-leds" \
            || { echo "ERROR: refactor pon-leds 服务缺失" >&2; exit 1; }
          test -f "$PKG_UCI/rtl9617c-pon-control/files/pon-leds.uc" \
            || { echo "ERROR: refactor pon-leds.uc 缺失" >&2; exit 1; }
          # ★ 2026-11-17 基线 659700cc1bbc 的真实情况（run#8 实测纠正）：
          #   上游把 rename-netdevs.uc **直接安装成** 89-rtl9617c-lan-ports
          #   （Makefile: INSTALL_BIN ./files/usr/share/rtl9617c/rename-netdevs.uc
          #    -> $(1)/etc/uci-defaults/89-rtl9617c-lan-ports），
          #   而不是旧 HEAD 那种"包装脚本 + 单独装 uc"的形式。**功能完全等价**，
          #   所以 89 脚本仍然必须存在，不能断言它不存在。
          #   97-rtl9617c-argon-default 才是真正被删的。
          # 89 是 Makefile install 段安装的（源码树里没有这个静态文件），
          # 所以只能校验 Makefile 的安装规则 —— RUN #9 实测纠正：误查源码树导致误报缺失。
          PON_MK="$PKG_UCI/rtl9617c-pon-control/Makefile"
          test -f "$PON_MK" || { echo "ERROR: refactor 缺少 rtl9617c-pon-control/Makefile" >&2; exit 1; }
          grep -q '89-rtl9617c-lan-ports' "$PON_MK" \
            || { echo "ERROR: pon-control Makefile 不再安装 89-rtl9617c-lan-ports（网卡重命名会失效）" >&2; exit 1; }
          grep -q 'rename-netdevs.uc' "$PON_MK" \
            || { echo "ERROR: pon-control Makefile 不再安装 rename-netdevs.uc" >&2; exit 1; }
          found=0
          for f in "$PKG_UCI"/*/files/etc/uci-defaults/97-rtl9617c-argon-default \
                   "$PKG_UCI"/*/root/etc/uci-defaults/97-rtl9617c-argon-default; do
            [ -f "$f" ] && { found=1; break; }
          done
          [ "$found" = 0 ] || { echo "ERROR: 97-rtl9617c-argon-default 复活了（上游改版？）需复核" >&2; exit 1; }
          [ ! -e "$UCI_SRC/99-pt1570-fit" ] \
            || { echo "ERROR: 上游树混入 R10 的 99-pt1570-fit" >&2; exit 1; }
          [ ! -e "$UCI_SRC/95-pt1570-wan-default" ] \
            || { echo "ERROR: 上游树混入 R10 的 95-pt1570-wan-default" >&2; exit 1; }
          echo "  OK   refactor 首启脚本齐全，无 R10 资产串入"

          echo "===== config sanity（防回归 / 机型隔离）====="
          # 反向：空配置 defconfig 会把 mediatek/filogic/openwrt_one 的包集写成显式 =y
          for bad in kmod-mac80211 kmod-cfg80211 kmod-mt7915e kmod-mt76-core \
                     wpad-basic-mbedtls mt7981-wo-firmware eip197-mini-firmware \
                     airoha-en8811h-firmware kmod-phy-airoha-en8811h kmod-rtc-pcf8563; do
            if grep -qE "^CONFIG_PACKAGE_${bad}=(y|m)$" .config; then
              echo "ERROR: 检测到污染包 ${bad}（默认 target 包残留），检查 .config 初始化顺序" >&2
              exit 1
            fi
          done
          echo "  OK   无 mediatek/openwrt_one 残留包"
          # H10 2.5G 无 WiFi：R10 的 AP 驱动绝不能进本镜像
          for bad in kmod-rtl-ax-ap wpad-mbedtls wireless-regdb; do
            if grep -qE "^CONFIG_PACKAGE_${bad}=(y|m)$" .config; then
              echo "ERROR: H10 镜像混入了 R10 的 WiFi 包 ${bad}" >&2
              exit 1
            fi
          done
          echo "  OK   无 R10 WiFi 专属包"
          # 正向：H10 上游 profile 自带、且 Config 里显式点名的中文 LuCI / argon
          for good in luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn; do
            grep -q "^CONFIG_PACKAGE_${good}=y$" .config \
              || { echo "ERROR: 中文 LuCI 包 ${good} 未启用" >&2; exit 1; }
            echo "  OK   ${good}"
          done

          echo "===== key config ====="
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET)=' .config || true
          echo "  =m packages: $(grep -c '^CONFIG_PACKAGE_.*=m$' .config || true)"
          echo "--- files/etc/apk/repositories.d/distfeeds.list ---"
          cat files/etc/apk/repositories.d/distfeeds.list
          cp .config "$GITHUB_WORKSPACE/Config-final.txt"

      - name: Run static preflight (H10)
        if: ${{ inputs.test_only }}
        run: |
          set -e
          WF="$GITHUB_WORKSPACE/.github/workflows/build-pt1500-h10.yml"
          echo "=== 1. H10 资产齐全 ==="
          for f in "$WF" \
                   "$GITHUB_WORKSPACE/Config-PT1500-H10.txt" \
                   "$GITHUB_WORKSPACE/customize-h10.sh" \
                   "$GITHUB_WORKSPACE/scripts/apply-board-h10.sh" \
                   "$GITHUB_WORKSPACE/scripts/verify-fit-boot.py" \
                   "$GITHUB_WORKSPACE/files-h10/etc/apk/keys/immortalwrt-25.12.pem" \
                   "$GITHUB_WORKSPACE/files-h10/lib/upgrade/zz-pt1570-sysupgrade.sh" \
                   "$GITHUB_WORKSPACE/files-h10/etc/uci-defaults/95-pt1500-h10-wan-default"; do
            [ -f "$f" ] || { echo "ERROR: 缺资产 $f" >&2; exit 1; }
          done
          echo "  OK   H10 资产齐全"
          echo "=== 2. H10-only 结构 ==="
          LINE=$(grep -E '^[[:space:]]*board: \[' "$WF" | tr -d '[:space:]')
          [ "$LINE" = "board:[h10]" ] || { echo "ERROR: matrix 不是 [h10]: '$LINE'" >&2; exit 1; }
          grep -q 'Guard H10-only' "$WF" || { echo "ERROR: 缺 H10-only 防呆步骤" >&2; exit 1; }
          echo "  OK   matrix=[h10] + guard"
          echo "=== 3. 与 R10 资产隔离 ==="
          ! grep -qE 'scripts/(patch-upstream|patch-wifi-diag|overlay-wifi-driver|apply-board)\.sh|customize\.sh|Config-PT1570-FIT\.txt|Config-EXTRA\.txt|Config-DIAG\.txt' "$WF" \
            || { echo "ERROR: H10 workflow 仍引用 R10 专属脚本 / 配置" >&2; exit 1; }
          echo "  OK   无 R10 板级注入 / WiFi 资产引用"
          echo "=== 4. Config 基线关键符号 ==="
          C="$GITHUB_WORKSPACE/Config-PT1500-H10.txt"
          for sym in CONFIG_PACKAGE_fitblk CONFIG_PACKAGE_rtl9617c-pon-control \
                     CONFIG_PACKAGE_luci-theme-argon CONFIG_PACKAGE_tailscale; do
            grep -q "^${sym}=y$" "$C" || { echo "ERROR: $sym 缺失" >&2; exit 1; }
          done
          echo "  OK   Config 关键符号"
          echo "H10_PREFLIGHT_OK=True"

      - name: Upload config (test_only)
        if: ${{ inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1500-H10-2P5G-CT-sysupgrade-config-${{ github.run_number }}
          path: Config-final.txt
          retention-days: 14

      - name: Download sources
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          make package/base-files/clean >/dev/null 2>&1 || true
          make download -j"$(nproc)"

      - name: Compile
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          : > "$LOG"
          if make -j"$(nproc)" 2>&1 | tee -a "$LOG"; then
            echo "PARALLEL_BUILD_OK=True"
          else
            echo "::warning::并行编译失败，改用 -j1 V=s 重试并显示详细日志"
            if make -j1 V=s 2>&1 | tee -a "$LOG"; then
              echo "SERIAL_BUILD_OK=True"
            else
              echo "::group::BUILD FAILED - last 120 lines"
              tail -n 120 "$LOG"
              echo "::endgroup::"
              grep -E 'Error [0-9]|^make(\[[0-9]+\])?: \*\*\*|error:|No such file|not found|No space left|Killed|undefined reference|FATAL|FAIL' "$LOG" \
                | tail -n 8 | tr -d '\r' | while IFS= read -r l; do
                    echo "::error::${l//%/%25}"
                  done
              echo "BUILD_FAILED=True" >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Verify image payload (H10)
        if: ${{ !inputs.test_only }}
        working-directory: wrt
        env:
          ASSETS: ${{ github.workspace }}
          APK_MIRROR_BASE: ${{ inputs.apk_mirror_base }}
        run: |
          set -e
          ROOT=$(ls -d build_dir/target-*/root-rtl9617c* 2>/dev/null | head -1)
          [ -n "$ROOT" ] || { echo "::error::找不到 rootfs 目录 build_dir/target-*/root-rtl9617c*"; exit 1; }
          echo "rootfs dir: $ROOT"

          # ---- apk 源与索引公钥（缺公钥会 UNTRUSTED signature）----
          KEY_SRC="$ASSETS/files-h10/etc/apk/keys/immortalwrt-25.12.pem"
          KEY_DST="$ROOT/etc/apk/keys/immortalwrt-25.12.pem"
          [ -f "$KEY_DST" ] || { echo "::error::镜像缺少 apk 索引公钥 immortalwrt-25.12.pem"; exit 1; }
          cmp -s "$KEY_SRC" "$KEY_DST" || { echo "::error::镜像内 apk 公钥与资产不一致"; exit 1; }
          echo "  OK   apk key: immortalwrt-25.12.pem ($(stat -c %s "$KEY_DST") B)"

          DF="$ROOT/etc/apk/repositories.d/distfeeds.list"
          [ -f "$DF" ] || { echo "::error::镜像缺少 distfeeds.list"; exit 1; }
          nfeed=$(grep -vc '^[[:space:]]*#' "$DF" || true)
          [ "$nfeed" -ge 1 ] || { echo "::error::distfeeds.list 无有效源行"; exit 1; }
          if [ -n "${APK_MIRROR_BASE:-}" ]; then
            # 自定义 apk 源：只要求有有效源行，不校验北大镜像条数 / a53 目录
            echo "  OK   distfeeds: 自定义 apk 源，有效行 $nfeed（跳过北大镜像计数）"
          else
            npku=$(grep -c 'mirrors\.pku\.edu\.cn/immortalwrt/releases/25\.12-SNAPSHOT/packages/aarch64_cortex-a53/' "$DF" || true)
            [ "$npku" = 5 ] || { echo "::error::distfeeds 里北大 25.12 源 $npku 条 != 5（base/luci/packages/routing/telephony）"; exit 1; }
            grep -v '^[[:space:]]*#' "$DF" | grep -q 'aarch64_cortex-a55' \
              && { echo "::error::distfeeds 有效源指向了 aarch64_cortex-a55（refactor 应为 a53）"; exit 1; }
            echo "  OK   distfeeds: 北大镜像 25.12-SNAPSHOT ×$npku（aarch64_cortex-a53）"
          fi

          # refactor 编译架构就是 aarch64_cortex-a53（与镜像源目录一致），
          # 不再需要 base 时代「ROM a55 + 首启补 a53」的跨架构 hack。
          if [ -f "$ROOT/etc/apk/arch" ]; then
            grep -q 'aarch64_cortex-a53' "$ROOT/etc/apk/arch" \
              || { echo "::error::/etc/apk/arch 缺本机架构 aarch64_cortex-a53"; exit 1; }
            echo "  OK   /etc/apk/arch 本机架构 a53（refactor 原生）"
          else
            echo "::error::镜像缺少 /etc/apk/arch"; exit 1
          fi
          # 91-pt1570-apk-arch 保留作幂等兜底（防止后续源切换架构被拒装）
          [ -f "$ROOT/etc/uci-defaults/91-pt1570-apk-arch" ] \
            || { echo "::error::镜像缺少 91-pt1570-apk-arch 兜底脚本"; exit 1; }
          echo "APK_SOURCE_OK=True feeds=$nfeed"

          # ---- sysupgrade 机型校验（refactor 标准 fit_do_upgrade）----
          # refactor 无 pt1500-fip.sh 覆盖脚本，升级走 platform.sh 的 fit_do_upgrade；
          # platform.sh 自带 RAMFS_COPY_BIN='fitblk fit_check_sign'。
          UPG="$ROOT/lib/upgrade"
          [ -d "$UPG" ] || { echo "::error::镜像缺少 /lib/upgrade"; exit 1; }
          grep -q 'youhua,pt1500-h10-2p5g' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 白名单缺少 youhua,pt1500-h10-2p5g"; exit 1; }
          grep -q 'fit_do_upgrade' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 未走标准 fit_do_upgrade（refactor 基线特征）"; exit 1; }
          [ -f "$UPG/fit.sh" ] \
            || { echo "::error::镜像缺少 /lib/upgrade/fit.sh（fit_do_upgrade 依赖）"; exit 1; }
          grep -q 'fitblk' "$UPG/platform.sh" \
            || { echo "::error::platform.sh 的 RAMFS_COPY_BIN 未含 fitblk"; exit 1; }
          echo "SYSUPGRADE_BOARD_OK=True"

          # ---- rpcd exec 插件 / argon 主题设置 ----
          # CRLF（#!/bin/sh\r）+ 0644 会让 5 个 luci.argon* ubus 对象全不注册。
          RPCD="$ROOT/usr/libexec/rpcd"
          [ -d "$RPCD" ] || { echo "::error::镜像缺少 /usr/libexec/rpcd"; exit 1; }
          n=0
          for f in "$ASSETS"/files-h10/usr/libexec/rpcd/luci.argon*; do
            base=${f##*/}
            tgt="$RPCD/$base"
            [ -f "$tgt" ] || { echo "::error::镜像缺少 rpcd 插件 $base"; exit 1; }
            [ -x "$tgt" ] || { echo "::error::rpcd 插件 $base 不可执行（rpcd 不会加载）"; exit 1; }
            if grep -q "$(printf '\r')" "$tgt"; then
              echo "::error::rpcd 插件 $base 仍是 CRLF（shebang 会变成 /bin/sh\r）"; exit 1
            fi
            cmp -s "$f" "$tgt" || { echo "::error::镜像内 $base 与 assets 的 LF 版本不一致"; exit 1; }
            n=$((n+1))
          done
          [ "$n" = 5 ] || { echo "::error::argon rpcd 插件数量 $n != 5"; exit 1; }
          [ -f "$ROOT/etc/uci-defaults/92-pt1570-rpcd-eol" ] \
            || { echo "::error::镜像缺少 92-pt1570-rpcd-eol 兜底脚本"; exit 1; }
          echo "RPCD_ARGON_OK=True plugins=$n"

          # ---- fitblk 工具（refactor 的 fit_do_upgrade 用它释放 FIT 子镜像）----
          # base 老基线需 zz-pt1570-sysupgrade.sh 覆盖 nand_do_upgrade 才能释放
          # /dev/fit0；refactor 上游 platform.sh 已走标准 fit_do_upgrade，无需 zz。
          [ -f "$ROOT/usr/sbin/fitblk" ] && [ -s "$ROOT/usr/sbin/fitblk" ] \
            || { echo "::error::镜像缺少 /usr/sbin/fitblk（fit_do_upgrade 无法释放 /dev/fit0）"; exit 1; }
          [ ! -e "$ROOT/lib/upgrade/zz-pt1570-sysupgrade.sh" ] \
            || echo "::warning::镜像含 base 遗留 zz 脚本（refactor 不需要，应已从不注入）"
          echo "FITBLK_OK=True"

          # ---- 首启脚本（refactor rtl9617c-* 命名 + H10 WAN/FE 修复）----
          UCI="$ROOT/etc/uci-defaults"
          # ★ 基线 659700cc1bbc：上游已删 90-pon-wan / 91-pon-offload /
          #   89-rtl9617c-lan-ports / 97-rtl9617c-argon-default，
          #   WAN/VLAN/PPPoE/PON FE 全部由我们的 95 脚本负责。
          for s in 94-rtl9617c-cpu 95-rtl9617c-argon 96-rtl9617c-rpcd-perms \
                   95-pt1500-h10-wan-default; do
            [ -f "$UCI/$s" ] || { echo "::error::镜像缺少首启脚本 $s"; exit 1; }
          done
          # 上游 659700cc1bbc：89-rtl9617c-lan-ports 是 rename-netdevs.uc 本体
          # （Makefile 直接安装），必须存在；97-rtl9617c-argon-default 已删除。
          [ -e "$UCI/89-rtl9617c-lan-ports" ] \
            || { echo "::error::镜像缺少 89-rtl9617c-lan-ports（网卡重命名会失效）"; exit 1; }
          for s in 90-pon-wan 91-pon-offload 97-rtl9617c-argon-default; do
            [ ! -e "$UCI/$s" ] || { echo "::error::镜像里上游脚本 $s 不该存在（两套逻辑会打架）"; exit 1; }
          done
          # PON mode 必须是 xgpon（上游 epon-d10g 已在编译期纠正）
          grep -q "option mode 'xgpon'" "$ROOT/etc/config/pon" \
            || { echo "::error::镜像 /etc/config/pon 的 mode 不是 xgpon"; exit 1; }
          # H10 WAN/FE 修复脚本必须带齐全部关键项
          H10WAN="$UCI/95-pt1500-h10-wan-default"
          grep -q 'youhua,pt1500-h10-2p5g' "$H10WAN" \
            || { echo "::error::H10 WAN 脚本 board_name 不对"; exit 1; }
          for kw in 'wan_vlan=1101' 'mtu=1500' "offload='1'" 'flow_offloading_hw' 'type=8021q'; do
            grep -qF "$kw" "$H10WAN" || { echo "::error::镜像里 H10 WAN 脚本缺 $kw"; exit 1; }
          done
          # PON mode 纠正逻辑必须在（防 sysupgrade 保留旧配置时 mode 仍是错的）
          grep -qF "uci -q set pon.pon.mode='xgpon'" "$H10WAN" \
            || { echo "::error::镜像里 H10 WAN 脚本缺 PON mode=xgpon 纠正逻辑"; exit 1; }
          # 面板灯：镜像 DTB 必须是按原厂 DTB 换算后的 GPIO 编号
          # （上游 DTS 的编号未按原厂 5-bank 换算，8 个灯错 7 个，实机表现为灯全乱）
          DTB_SRC="$GITHUB_WORKSPACE/wrt/target/linux/rtl9617c/dts/${DTS}.dts"
          if [ -f "$DTB_SRC" ]; then
            for pair in 'LED_PPP_G 96' 'LED_LOS 11' 'LED_PON 108' 'LED_PWR_G 6' \
                        'LED_FXS 12' 'LED_EPHY1 103' 'LED_EPHY2 97' 'LED_EPHY3 100' \
                        'LED_USB0 99' 'LED_EPHY0 102' 'LED_USB1 101'; do
              lbl=${pair% *}; pin=${pair#* }
              grep -A3 "label = \"$lbl\"" "$DTB_SRC" | grep -q "gpios = <&gpio0 $pin " \
                || { echo "::error::DTS 灯 $lbl 的 GPIO 不是原厂 flat 编号 $pin（灯修复未生效？）"; exit 1; }
            done
            echo "  OK   DTS 面板灯 GPIO 已按原厂 DTB 换算（11 个灯全部核对通过）"
          else
            echo "::warning::找不到 DTS 源文件 $DTB_SRC，跳过灯 GPIO 校验"
          fi
          # 2.5G 口 netdev 重命名由 refactor 的 rename-netdevs.uc 处理。
          # ★ d8f2e9522063 起上游把 rename-netdevs.uc 用 INSTALL_BIN 直接
          #   安装成 /etc/uci-defaults/89-rtl9617c-lan-ports，不再单独落到
          #   /usr/share/rtl9617c/rename-netdevs.uc（源树里仍有源文件，但镜像
          #   产物只有 89）。故镜像阶段改为校验 89 存在且为 ucode 脚本本体。
          #   run#10 就是死在这条旧路径断言上（编译成功、仅校验失败）。
          [ -f "$UCI/89-rtl9617c-lan-ports" ] \
            || { echo "::error::镜像缺少 89-rtl9617c-lan-ports（rename-netdevs.uc 本体，2.5G 口命名会失效）"; exit 1; }
          grep -q 'uci' "$UCI/89-rtl9617c-lan-ports" \
            || { echo "::error::镜像 89-rtl9617c-lan-ports 内容异常（非 rename-netdevs.uc ucode 脚本）"; exit 1; }
          # 绝不能把 R10 的网口/MAC 兜底与 WAN 覆盖带进 H10
          [ ! -e "$UCI/99-pt1570-fit" ] \
            || { echo "::error::镜像混入 R10 的 99-pt1570-fit"; exit 1; }
          [ ! -e "$UCI/95-pt1570-wan-default" ] \
            || { echo "::error::镜像混入 R10 的 95-pt1570-wan-default"; exit 1; }
          echo "UCI_DEFAULTS_OK=True WAN_FE_FIX_OK=True"

          # ---- refactor factory：校准由驱动直读 UBI factory 卷，无 shell 修补 ----
          # base 的 tyfza1-factory 脚本（含 factory_blob 修补）在 refactor 下不存在，
          # commit b5025a9d1c9 起驱动是 factory 卷的唯一读取者。
          [ ! -e "$ROOT/etc/init.d/tyfza1-factory" ] \
            || echo "::warning::镜像残留 base 的 tyfza1-factory（refactor 不需要）"
          echo "FACTORY_DRIVER_READ_OK=True"

          # ---- FIT rootfs 自洽性 ----
          # bootargs 不写 root=，由 MTD_ROOTFS_ROOT_DEV + fitblk 驱动自设 ROOT_DEV。
          KCFG=$(ls -d build_dir/target-*/linux-rtl9617c/linux-*/.config 2>/dev/null | head -1)
          [ -n "$KCFG" ] || KCFG=$(find build_dir -maxdepth 6 -path '*linux-rtl9617c*' \
              -name auto.conf 2>/dev/null | head -1)
          if [ -n "$KCFG" ]; then
            for sym in CONFIG_UIMAGE_FIT_BLK CONFIG_MTD_ROOTFS_ROOT_DEV CONFIG_SQUASHFS; do
              grep -q "^${sym}=y$" "$KCFG" \
                || { echo "::error::内核 $KCFG 里 ${sym} 不是 y，FIT rootfs 挂不上"; exit 1; }
            done
            echo "KERNEL_FIT_ROOTFS_OK=True ($KCFG)"
            # refactor 2.5G 驱动符号必须在编译后的内核配置里
            for sym in CONFIG_REALTEK_PHY_HISGMII CONFIG_PHY_RTL9617C_SERDES \
                       CONFIG_MDIO_REALTEK_RTL9617C CONFIG_RTL9617C_NI; do
              grep -q "^${sym}=y$" "$KCFG" \
                || { echo "::error::内核缺 $sym=y（2.5G refactor 驱动没编进内核）"; exit 1; }
            done
            echo "KERNEL_2P5G_REFACTOR_OK=True"
          else
            echo "::warning::找不到内核编译后的 .config，跳过 KERNEL_FIT_ROOTFS_OK"
          fi

          # 直接解析产出的 sysupgrade.itb：bootargs 不含 root=/rootwait/ubi.*、
          # rootdisk 指向 volname=fit 的卷、分区带 linux,ubi、model 不含 ABI。
          ITB=$(ls bin/targets/rtl9617c/generic/*sysupgrade.itb 2>/dev/null | head -1)
          [ -n "$ITB" ] || { echo "::error::找不到 sysupgrade.itb"; exit 1; }
          python3 "$ASSETS/scripts/verify-fit-boot.py" "$ITB"

          echo "IMAGE_PAYLOAD_OK=True"

      - name: Upload build log (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1500-H10-2P5G-CT-sysupgrade-build-log-${{ github.run_number }}
          path: |
            build.log
            step-feeds.log
          if-no-files-found: warn
          retention-days: 30

      - name: Refresh package index
        if: ${{ !inputs.test_only && inputs.publish_packages }}
        working-directory: wrt
        run: |
          make package/index
          find bin/targets/rtl9617c/generic/packages bin/packages \
            -name packages.adb -printf '%p %s bytes\n' 2>/dev/null | sort || true

      - name: Collect firmware + matching packages
        if: ${{ !inputs.test_only }}
        env:
          PUBLISH_PACKAGES: ${{ inputs.publish_packages }}
        run: |
          set -e
          OUT="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$OUT"
          cd "$GITHUB_WORKSPACE/wrt"
          echo "===== bin/targets/rtl9617c/generic ====="
          ls -lh bin/targets/rtl9617c/generic/ | head -40

          find bin/targets/rtl9617c/generic -maxdepth 1 -type f \
            -name "*${PROFILE}*" ! -name "*.json" \
            -exec cp -v {} "$OUT/" \;

          ls "$OUT/"*sysupgrade.itb >/dev/null 2>&1 || {
            echo "ERROR: 没有产出 ${PROFILE} 的 sysupgrade.itb" >&2; exit 1; }

          cp .config "$OUT/Config-final.txt"
          echo "$SOURCE_HASH" > "$OUT/source-commit.txt"
          {
            echo "board=$MODEL ($BOARD_NAME)"
            echo "release_id=PT1500-H10-2P5G-CT-sysupgrade"
            echo "artifact_type=sysupgrade"
            echo "profile=$PROFILE"
            echo "dts=$DTS (refactor upstream @ $SOURCE_HASH; 面板灯 GPIO 已按原厂 DTB 覆盖)"
            echo "source_ref=$SOURCE_REF (baseline=refactor d8f2e9522063, 与 PT1570-H10-CU 同步, 2.5G 正解架构 + OMCI/PON 加固)"
            echo "source_commit=$SOURCE_HASH"
            echo "baseline=refactor d8f2e9522063 — HisGMII PHY + SerDes PHY + 按速切 2500BASEX/SGMII（run#6 实机验证 2.5G 可用）"
            echo "abi=ubi_device / factory(8MiB,static) / fit / rootfs_data"
            echo "firmware=sysupgrade.itb (FIT external-static-with-rootfs, 标准 fit_do_upgrade)"
            echo "bootloader=lyq1996/rtl9617c-uboot@3a709714e551 (2026-11-10, pt1500-h10-2p5g_defconfig)"
            echo "bootloader_factory_size=8388608 (8 MiB static, /api/info board_data)"
            echo "factory_image=p1500-h10-factory.bin sha256=08cf837e... (device readback byte-identical)"
            echo "factory_base_mac=fc:34:e2:69:1b:7a"
            echo "factory_pon_sn=YHTCE2691B7A"
            echo "arch=aarch64_cortex-a53 (refactor CPU_TYPE=cortex-a53)"
            echo "lan_ip=192.168.1.1/24 (三机型统一；首启脚本迁移旧 192.168.2.1)"
            echo "default_wan=pon0.1101 pppoe (95 脚本负责: VLAN 1101 + mtu1500 + PON FE on)"
            echo "wifi=none (2.5G variant)"
            echo "2p5g=refactor DTS realtek,hisgmii + serdes-option-mode + phy-mode=2500base-x + phys=&serdes；驱动 realtek_hisgmii.c + phy-rtl9617c-serdes.c + patch 700-730 (防回退断言，串回 base 会编译失败)"
            echo "packages=publish_packages=false（暂不产出同批 packages，减少下载量）"
          } > "$OUT/BUILD_INFO.txt"

          case "$PUBLISH_PACKAGES" in
            false) DO_PACKAGES=0 ;;
            *)     DO_PACKAGES=1 ;;
          esac
          if [ "$DO_PACKAGES" = "1" ]; then
            ROOT="$GITHUB_WORKSPACE/pkgroot"
            rm -rf "$ROOT"
            mkdir -p "$ROOT/targets/rtl9617c/generic/packages" "$ROOT/packages"
            cp -a bin/targets/rtl9617c/generic/packages/. \
                  "$ROOT/targets/rtl9617c/generic/packages/" 2>/dev/null || true
            if [ -d bin/packages ]; then cp -a bin/packages/. "$ROOT/packages/"; fi

            KMOD_N=$(find "$ROOT" -type f -name 'kmod-*.apk' | wc -l)
            APK_N=$(find "$ROOT" -type f -name '*.apk' | wc -l)
            IDX_N=$(find "$ROOT" -type f -name 'packages.adb' | wc -l)
            echo "===== matching packages: kmod=$KMOD_N apk=$APK_N index=$IDX_N ====="
            test "$KMOD_N" -gt 0 || { echo "ERROR: 没有 kmod-*.apk" >&2; exit 1; }
            test "$APK_N"  -gt 0 || { echo "ERROR: 没有 .apk" >&2; exit 1; }
            test "$IDX_N"  -gt 0 || { echo "ERROR: 没有 packages.adb" >&2; exit 1; }

            if [ -f public-key.pem ]; then
              cp public-key.pem "$ROOT/public-key.pem"
            else
              echo "WARN: public-key.pem 缺失，跨批次装包需自行导公钥" >&2
            fi
            {
              echo "# 同批 packages（源码 $SOURCE_REF @ $SOURCE_HASH，架构 aarch64_cortex-a53）"
              echo "# 解包到静态站点根 BASE 后按需写入 /etc/apk/repositories.d/customfeeds.list"
              echo "BASE/targets/rtl9617c/generic/packages/packages.adb"
              find "$ROOT/packages" -name packages.adb -printf '%P\n' 2>/dev/null \
                | sort | sed 's|^|BASE/packages/|' || true
            } > "$ROOT/apk-repos.txt"
            {
              echo "source_ref=$SOURCE_REF"
              echo "source_commit=$SOURCE_HASH"
              echo "target=rtl9617c/generic"
              echo "profile=$PROFILE"
              echo "arch_packages=aarch64_cortex-a53"
              echo "linux=$(grep -m1 '^CONFIG_LINUX_VERSION=' .config || echo unknown)"
              echo "kmods=$KMOD_N apks=$APK_N indexes=$IDX_N"
            } > "$ROOT/BUILD_INFO.txt"

            cd "$GITHUB_WORKSPACE"
            tar --zstd -cf "artifact/PT1500-H10-2P5G-CT-sysupgrade-packages-${{ github.run_number }}.tar.zst" \
                -C "$ROOT" .
            ls -lh "artifact/PT1500-H10-2P5G-CT-sysupgrade-packages-${{ github.run_number }}.tar.zst"
          fi

          cd "$OUT"
          find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%f\n' \
            | sort | xargs sha256sum > sha256sums.txt
          echo "===== artifact ====="
          ls -lh

      - name: Upload firmware
        if: ${{ !inputs.test_only }}
        uses: actions/upload-artifact@v6
        with:
          name: PT1500-H10-2P5G-CT-sysupgrade-${{ github.run_number }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: ${{ !inputs.test_only && inputs.create_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: PT1500-H10-2P5G-CT-sysupgrade-${{ github.run_number }}
          name: PT1500-H10-2P5G-CT-sysupgrade (${{ github.run_number }})
          files: artifact/*
          body: |
            Release ID `PT1500-H10-2P5G-CT-sysupgrade`
            源码 lyq1996/rtl9617c-openwrt `${{ env.SOURCE_REF }}` @ `${{ env.SOURCE_HASH }}`
            基线：refactor 分支（2.5G 正解架构；网友 lyq1996 本机编译固件已实机验证 2.5G 可用）
            机型 ${{ env.MODEL }} / profile `${{ env.PROFILE }}` / DTS `${{ env.DTS }}`（上游原生，未改动）
            布局：factory(8 MiB static) + fit + rootfs_data（统一 UBI 方案），产物 sysupgrade.itb
            架构：aarch64_cortex-a53（refactor CPU_TYPE=cortex-a53）
            2.5G：HisGMII PHY + 独立 SerDes PHY + 按速切 2500BASEX/SGMII + patch 700-730（防回退断言已开）
            配置见 Config-final.txt；校验见 sha256sums.txt
            本轮 `publish_packages=false`，未产出同批 packages（需要时置 true 重编）。
            ⚠️ 本次从 base 20b4cf4 切到 refactor 基线，是本机型 2.5G 的根本性修复尝试；
               依据为两固件二进制比对（见项目报告）。请刷入后接 2.5G 设备实测 link，
               读 `ethtool` / `dmesg | grep -E 'P6|serdes|hisgmii|8221'` 验证。

            ⚠️ 仅适用于 PT1500-H10 2.5G（youhua,pt1500-h10-2p5g），无 WiFi。
            ⚠️ 刷机前必须已完成：U-Boot Web failsafe 里「重建 UBI」+ 导入 8 MiB factory 镜像。
               本机 U-Boot 为 2026-11-10 版（`3a70971`），factory 卷定义是 8 MiB；
               64 KiB 产物是新版 U-Boot 布局，刷进去会被恢复页拒绝。
            ⚠️ factory 卷已实机写入并读回逐字节校验通过，刷机时无需再动 factory。
            ⚠️ 本固件 bootargs 不含 root=，挂根由内核 MTD_ROOTFS_ROOT_DEV + fitblk 驱动自设 ROOT_DEV 完成。
            ⚠️ 默认 LAN 192.168.1.1（三机型统一，旧 192.168.2.1 自动迁移）；默认 WAN = pon0.1101（XGPON VLAN 1101）PPPoE，
               PON 转发引擎默认打开（pon.pon.offload=1 + flow_offloading_hw=1），
               底层 VLAN 口 MTU 1500。宽带账号需自行填写。
